  }
  // Photos drawn before they were loaded get their picture when it arrives.
  function fillPhotos(root) {
    $$('img[data-photo]', root).forEach((im) => { if (!im.getAttribute('src')) photoGet(im.dataset.photo).then((v) => { if (v) im.src = v; }); });
  }
  // ---------- Photo documentation in Drive: <project folder>/תיעוד/<date>/ ----------
  // Photos taken on the site are kept in the project's Drive folder, one folder per date, and can be put from
  // there into any section of a report.
  const docOk = (p) => !!(p && p.driveFolder && GOOGLE && G.valid() && G.drive && G.drive.docUpload);
  const docCache = {};
  const docList = (p, fresh) => {
    if (fresh || !docCache[p.driveFolder]) docCache[p.driveFolder] = G.drive.docPhotos(p.driveFolder, 60).catch((e) => { delete docCache[p.driveFolder]; throw e; });
    return docCache[p.driveFolder];
  };
  const two = (n) => String(n).padStart(2, '0');
  // A photo straight from the camera is called by the time it was taken ("2026-11-25 14-32-05.jpg"); a photo from
  // the gallery keeps its own name.
  const docFileName = (f, date, camera) => {
    const ext = ((f.name || '').match(/\.\w{2,5}$/) || ['.jpg'])[0];
    if (!camera && f.name && !/^image\.\w+$/i.test(f.name)) return f.name;
    const d = new Date(); return `${date} ${two(d.getHours())}-${two(d.getMinutes())}-${two(d.getSeconds())}${ext}`;
  };
  const docErr = (e) => (e && (e.status === 403 || e.status === 404) ? 'אין הרשאה לכתוב בתיקיית הפרויקט ב-Drive. חברו מחדש את חשבון ה-Google בלשונית "יומן, מייל ו-Drive" ואשרו גישה מלאה ל-Drive.' : 'השמירה ב-Drive נכשלה' + (e && e.message ? ': ' + e.message : ''));
  // Photos that could not reach Drive (no connection for a moment, typically right after the camera on a phone):
  // they are tried again when the page is back in front / online, and every half minute, until saved.
  const docQueue = [];
  let docRetryT = null;
  const docNet = (e) => !!(e && (e.network || e.status >= 500 || e.status === 429));
  async function docFlush() {
    clearTimeout(docRetryT); docRetryT = null;
    if (!docQueue.length || !GOOGLE || !G.valid()) { if (docQueue.length) docRetryT = setTimeout(docFlush, 30000); return; }
    let ok = 0;
    while (docQueue.length) {
      const q = docQueue[0];
      try { await G.drive.docUpload(q.folder, q.date, q.name, q.file); docQueue.shift(); ok++; delete docCache[q.folder]; }
      catch (e) {
        if (docNet(e) && ++q.tries < 40) { docRetryT = setTimeout(docFlush, 30000); break; }
        docQueue.shift(); toast(docErr(e));
      }
    }
    docBar();
    if (ok) { toast((ok === 1 ? 'התמונה שחיכתה נשמרה' : ok + ' תמונות שחיכו נשמרו') + ' ב-Drive'); if (location.hash.startsWith('#project/')) render(); }
  }
  // A bar at the bottom while photos are waiting: try now, or connect straight to Google (a popup, without the
  // connection server) when the server cannot be reached.
  function docBar() {
    let bar = $('#docQueueBar');

    if (!bar) { bar = document.createElement('div'); bar.id = 'docQueueBar'; document.body.appendChild(bar); }
    bar.innerHTML = `<span>📷 ${docQueue.length === 1 ? 'תמונה אחת ממתינה' : docQueue.length + ' תמונות ממתינות'} לשמירה ב-Drive (אין חיבור לשרת של Google)</span>
      <button type="button" class="btn sm" data-qnow>נסה שוב</button>${G.direct ? '<button type="button" class="btn sm primary" data-qdirect>🔑 חיבור ישיר ל-Google ושמירה</button>' : ''}`;

  const docThumbUrl = (f) => (f.thumbnailLink ? f.thumbnailLink.replace(/=s\d+$/, '=s400') : '');

  function fixDocThumbs(root) {

  }
  const docDays = (files) => {
    const by = new Map(); files.forEach((f) => { if (!by.has(f.day)) by.set(f.day, []); by.get(f.day).push(f); });
    return Array.from(by.entries());

  const photoImg = (id, cls, sc) => { const v = photoCache.get(id); return `<img class="${cls}" data-photo="${esc(id)}" ${v ? `src="${v}"` : ''}${sc && sc !== 1 ? ` style="max-width:${Math.min(100, Math.round(sc * 100))}%;max-height:${Math.round(240 * sc)}px"` : ''} alt="">`; };
  // The size of a topic's photos in the document, in percent of the usual size (photoScale, 20 to 150).
  const photoScaleOf = (it) => { const n = parseInt(it && it.photoScale, 10); return n >= 20 && n <= 150 ? n : 100; };

  function protoDoc(pr) {
    const t = protoTpl(pr);

    const blocks = [];
    if (!t) {
      const meta = [['תאריך', fmtDate(pr.date)], ['סוג', pr.type], ['פרויקט', proj && proj.name], ['משתתפים', pr.participants]].filter((x) => x[1]);
      blocks.push({ kind: 'kv', rows: meta.map((m) => [m[0], cellOf(m[1])]) });

  // HTML for the card and for the PDF print view.

            : `<tr>${r.map((c, i) => `<td class="c-${bl.cols[i][2]}">${cellHtml(c)}</td>`).join('')}</tr>`)).join('')}</tbody></table>`;
      }

      return `${title}${bl.list ? `<ol>${bl.list.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>` : bl.paras.map((x) => `<p>${esc(x)}</p>`).join('')}`;
    }).join('')}</div>`;
  }

  // Plain text, for email and the calendar.
  function protocolText(pr) {
    const doc = protoDoc(pr);
    const flat = (cell) => cell.map((l) => l.t).join('\n');
    let t = doc.heading + '\n';
    doc.blocks.forEach((bl) => {
      if (bl.kind === 'kv') t += (bl.title ? '\n' + bl.title + '\n' : '') + bl.rows.map((r) => r[0] + ': ' + flat(r[1]).replace(/\n/g, ', ')).join('\n') + '\n';
      else if (bl.kind === 'table') {
        t += '\n' + (bl.title ? bl.title + '\n' : '');
        bl.rows.forEach((r) => {
          if (r.section) { t += '\n' + r.section + '\n'; return; }
          const parts = r.map((c, i) => [bl.cols[i][0], flat(c)]).filter((x) => x[1] && x[0] !== '' && x[0] !== 'מס"ד');
          const num = bl.cols[0][0] === '' || bl.cols[0][0] === 'מס"ד' ? flat(r[0]) + ' ' : '';
          t += num + parts.map((x, i) => (i ? x[0] + ': ' : '') + x[1]).join('\n   ') + '\n';
        });
      } else if (bl.kind === 'note') t += '\n' + bl.text + '\n';
      else t += '\n' + bl.title + '\n' + (bl.list ? bl.list.map((x, i) => (i + 1) + '. ' + x).join('\n') : bl.paras.join('\n')) + '\n';
    });
    return t + '\n--\nפמי הנדסה בע"מ | ייעוץ | ניהול פרויקטים\noffice@femy.co.il | ב.ס.ר 1 רמת גן\n';
  }

  const protoTaskRows = (pr) => protoTpl(pr) ? (pr.items || []).filter((i) => (i.owner || '').trim() && (i.details || i.instructions || '').trim()) : [];
  function protoCardHtml(pr, opts) {

    return `<div class="card proto ${ui.openProto === pr.id ? 'open' : ''}" data-id="${pr.id}">
      <div class="proto-head">

        <div style="flex:1;min-width:0"><div class="proto-title">${t ? `<span class="tpl-tag tpl-${pr.template}">${esc(t.short)}</span>` : ''}${esc((pr.subject || '').trim().replace(/\s*\n\s*/g, ' - ') || pr.title || protoHeading(pr))}${pr.draft && !protoSent(pr) ? `<span class="tpl-tag tpl-draft" style="margin-inline-start:7px">✏️ בעריכה${pr.editing && pr.editing.by && Date.now() - pr.editing.at < 180000 ? ': ' + esc(pr.editing.by) + ' עכשיו' : ''}</span>` : ''}</div>
          <div class="proto-sub">${sub.map(esc).join(' · ')}</div></div>
        <span class="chev">◀</span>
      </div>
      <div class="proto-body">
        <div class="proto-doc">${protoDocHtml(protoDoc(pr))}</div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
          <button class="btn sm" data-edit>עריכה</button>
          ${pr.draft && !protoSent(pr) ? '<button class="btn sm" data-finish title="בלי שליחה במייל. אחרי זה אפשרויות ההעתקה מהדוח הקודם לא יוצעו יותר">✓ סיום עריכה</button>' : ''}
          ${t ? '<button class="btn sm" data-dup>➕ פרוטוקול המשך</button>' : ''}
          ${p && !o.hideProject ? `<a class="btn sm" href="${projectHref(p)}">🏗️ לדף הפרויקט</a>` : ''}
          ${canTasks ? '<button class="btn sm" data-mktasks>יצירת משימות מהפרוטוקול</button>' : ''}
          <button class="btn sm" data-mail>✉️ שליחה במייל</button>
          <button class="btn sm" data-word>📄 ייצוא ל-Word</button>
          <button class="btn sm" data-pdf>📑 ייצוא ל-PDF</button>
          ${GOOGLE ? '<button class="btn sm" data-drive>📝 עדכון ה-Google Docs של הפרויקט</button>' : ''}
          ${pr.gdocLink ? `<a class="btn sm" href="${esc(pr.gdocLink)}" target="_blank" rel="noopener" title="העותק ב-Google Docs, מתעדכן עם כל שמירה">📝 Google Docs</a>` : ''}
          ${GOOGLE ? '<button class="btn sm" data-cal>📅 הוספה ליומן</button>' : ''}
          ${GOOGLE && pr.driveLink ? `<a class="btn sm" href="#" data-lapp="${esc(protoFileName(pr, 'docx'))}" title="מעתיק את נתיב הקובץ במחשב, להדבקה בסייר הקבצים עם Ctrl+L">📋 העתק נתיב</a>` : ''}
        </div>
      </div></div>`;
  }
  // "25.11.26", "25/11/2026" -> "2026-11-25"
  function parseHeDate(s) {
    const m = String(s || '').match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
    if (!m) return '';
    const y = m[3].length === 2 ? '20' + m[3] : m[3];
    return y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  }
  function bindProtoCards(root) {
    if (!root) return;
    fillPhotos(root);
    $$('.proto', root).forEach((c) => {
      const pr = byId(db.protocols, c.dataset.id);
      $('.proto-head', c).addEventListener('click', () => { ui.openProto = ui.openProto === pr.id ? null : pr.id; c.classList.toggle('open'); });
      $('[data-edit]', c).addEventListener('click', () => openProtocolForm(pr));
      const fin = $('[data-finish]', c);
      if (fin) fin.addEventListener('click', () => { protoMarkSent(pr, true); save(); render(); toast('העריכה הסתיימה'); });
      const dup = $('[data-dup]', c);

      $('[data-word]', c).addEventListener('click', () => exportProtocolWord(pr));
      $('[data-pdf]', c).addEventListener('click', () => exportProtocolPdf(pr));
      $('[data-mail]', c).addEventListener('click', () => emailProtocol(pr));
      const dv = $('[data-drive]', c);
      if (dv) dv.addEventListener('click', () => saveProtocolToDrive(pr));
      const cl = $('[data-cal]', c);
      if (cl) cl.addEventListener('click', () => openEventForm({ title: pr.title || protoHeading(pr), date: pr.date, description: protocolText(pr) }));
      const mk = $('[data-mktasks]', c);
      if (mk) mk.addEventListener('click', () => {
        const note = 'נוצר מפרוטוקול: ' + (pr.title || protoHeading(pr)) + ' (' + fmtDate(pr.date) + ')';
        let tasks;
        if (protoTpl(pr)) {
          tasks = protoTaskRows(pr).map((it) => {
            const what = protoLines(it.instructions || it.details)[0].replace(/^[-•*]\s*/, '');
            return { title: ((it.topic ? it.topic + ': ' : '') + what).slice(0, 140), assignee: it.owner.trim(), due: parseHeDate(it.due) || addDays(7) };
          });
        } else {
          tasks = protoLines(pr.actions).map((line) => { const m = line.match(/^([^:]{1,25}):\s*(.+)$/); return { title: m ? m[2] : line, assignee: m ? m[1].trim() : '', due: addDays(7) }; });
        }
        if (!confirm(`ליצור ${tasks.length} משימות חדשות מהפרוטוקול?`)) return;
        tasks.forEach((x) => db.tasks.push({ id: uid(), title: x.title, assignee: x.assignee, projectId: pr.projectId || '', priority: 'medium', status: 'todo', due: x.due, notes: note }));
        save(); updateBadge(); toast(tasks.length + ' משימות נוצרו');
        if (currentView() === 'project') render();
      });
    });
  }

  // ---------- Protocols from Drive ----------
  // Meeting summaries and execution reports kept in the "פרויקטים פמי" folder. The list in
  // protocols/drive-protocols.json shows right away; when the user's Google account is connected the site
  // scans the folder again (every 15 minutes at most, or on "סנכרון עכשיו") and keeps the result in this browser.
  const DP = window.FemyDriveProtocols;
  const DRIVE_PROTO_KEY = 'femy-drive-protos';
  const dprot = { items: [], base: null, at: 0, tried: 0, syncing: false, err: '', folders: {} };
  (function () {
    try {
      const c = JSON.parse(localStorage.getItem(DRIVE_PROTO_KEY) || 'null');
      if (c && Array.isArray(c.items)) { dprot.items = c.items; dprot.at = c.at || 0; dprot.folders = c.folders || {}; }
    } catch (e) {}
  })();
  function loadDriveProtos() {
    return fetch('protocols/drive-protocols.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => {
      dprot.base = d;
      if (!dprot.at) dprot.items = d.items || [];
      const v = currentView(); if (v === 'protocols' || v === 'project') render();
    }).catch(() => {});
  }
  const dpProject = (it) => byId(db.projects, it.projectId) || (it.projectFolder ? db.projects.find((p) => p.driveFolder === it.projectFolder) : null) || null;
  const dpUrl = (f) => (DP ? DP.fileUrl(f) : '#');
  // The sync server's copy comes first (no Google account needed); the user's own Google account is the
  // fallback, while the server is not set up.
  async function syncDriveProtos(manual) {
    if (!DP || dprot.syncing) return;
    const server = useSync(manual);
    const direct = GOOGLE && (G.silent() || (manual && !SYNC));
    if (!server && !direct) return;
    if (!manual && Date.now() - Math.max(dprot.at, dprot.tried) < (server ? 5 : 15) * 60 * 1000) return;
    dprot.syncing = true; dprot.tried = Date.now(); dprot.err = ''; showDriveProtoStatus();
    try {
      if (server) {
        try {
          if (manual) await syncRefresh();
          const d = await (await syncFetch('/data/drive')).json();
          if (!d || !Array.isArray(d.files)) throw new Error('no_data');
          dprot.items = DP.buildItems(d.files, d.folders || {}, d.root, db.projects);
          Object.assign(dprot.folders, d.folders || {});
          dprot.at = d.at || Date.now();
          try { localStorage.setItem(DRIVE_PROTO_KEY, JSON.stringify({ at: dprot.at, items: dprot.items, folders: dprot.folders })); } catch (e) {}
          if (manual) toast(`סונכרנו ${dprot.items.length} סיכומי פגישות ודוחות מה-Drive`);
          return;
        } catch (e) {
          if (!(GOOGLE && G.silent())) throw e;
        }
      }
      if (manual && !server) await G.token(); // may ask to connect, straight from the click
      const rootId = await G.drive.projectsRoot();
      const files = await G.drive.search(DP.driveQuery());
      const folders = Object.assign({}, (dprot.base && dprot.base.folders) || {}, dprot.folders);
      const stop = new Set([rootId].concat(db.projects.map((p) => p.driveFolder).filter(Boolean)));
      const top = (f) => { let a = (f.parents || [])[0]; let g = 0; while (a && !stop.has(a) && folders[a] && g++ < 30) a = folders[a][0]; return a; };
      // Walk up from each document to the projects folder, looking up the folders not seen before.
      let budget = 400;
      for (let round = 0; round < 15 && budget > 0; round++) {
        const need = new Set();
        files.forEach((f) => { const a = top(f); if (a && !stop.has(a) && !folders[a]) need.add(a); });
        if (!need.size) break;
        const ids = Array.from(need).slice(0, budget); budget -= ids.length;
        for (let i = 0; i < ids.length; i += 20) {
          await Promise.all(ids.slice(i, i + 20).map((id) => G.drive.meta(id)
            .then((m) => { folders[id] = [(m.parents || [])[0] || '', m.name || '']; dprot.folders[id] = folders[id]; })
            .catch(() => { folders[id] = ['', '']; })));
        }
      }
      dprot.items = DP.buildItems(files, folders, rootId, db.projects);
      dprot.at = Date.now();
      try { localStorage.setItem(DRIVE_PROTO_KEY, JSON.stringify({ at: dprot.at, items: dprot.items, folders: dprot.folders })); } catch (e) {}
      if (manual) toast(`סונכרנו ${dprot.items.length} סיכומי פגישות ודוחות מה-Drive`);
    } catch (e) {
      dprot.err = gErr(e);
      if (manual) toast('הסנכרון מה-Drive נכשל: ' + dprot.err);
    } finally {
      dprot.syncing = false;
      const v = currentView(); if (v === 'protocols' || v === 'project') render(); else showDriveProtoStatus();
    }
  }
  const agoText = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'עכשיו' : m < 60 ? `לפני ${m} דק'` : m < 1440 ? `לפני ${Math.round(m / 60)} שע'` : fmtDate(new Date(t).toISOString().slice(0, 10)); };
  function driveProtoStatusHtml() {
    const n = dprot.items.length;
    const when = dprot.syncing ? 'מסנכרן מה-Drive...' : dprot.at ? 'עודכן ' + agoText(dprot.at) : dprot.base ? 'לפי הרשימה מ-' + fmtDate(dprot.base.version) : '';
    return `☁️ ${n} מסמכים מתיקיית "פרויקטים פמי" · ${esc(when)}${dprot.err && !dprot.syncing ? ` · <span class="overdue">${esc(dprot.err)}</span>` : ''}
      ${(GOOGLE || SYNC) && !dprot.syncing ? ' · <a href="#" data-dpsync>🔄 סנכרון עכשיו</a>' : ''}`;
  }
  function showDriveProtoStatus() {
    $$('.dp-status').forEach((b) => { b.innerHTML = driveProtoStatusHtml(); });
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-dpsync]'); if (!a) return;

  document.addEventListener('click', (e) => {

  }, true);
  const DP_EXT = { pdf: 'PDF', gdoc: 'Google Docs', docx: 'Word', doc: 'Word' };
  function driveProtoHtml(it, opts) {
    const o = opts || {};
    const p = dpProject(it);
    const d = new Date((it.date || todayStr()) + 'T00:00:00');

    return `<div class="card dproto">
      <a class="proto-head" href="${esc(dpUrl(main))}" target="_blank" rel="noopener" title="פתיחת המסמך ב-Google Drive">
        <div class="proto-date">${d.getDate()}<small>${d.toLocaleDateString('he-IL', { month: 'short', year: '2-digit' })}</small></div>
        <div style="flex:1;min-width:0"><div class="proto-title"><span class="tpl-tag ${it.kind === 'report' ? 'tpl-supervision' : it.label === 'סיור קבלנים' ? 'tpl-tour' : 'tpl-meeting'}">${esc(it.label)}</span>${esc(it.title)}</div>
          <div class="proto-sub">${sub.map(esc).join(' · ')}${sub.length ? ' · ' : ''}<span class="dp-src">☁️ Drive</span></div></div>
      </a>
      <div class="dp-acts">${it.files.map((f) => `<a class="btn sm" href="${esc(dpUrl(f))}" target="_blank" rel="noopener">${DP_EXT[f.ext] || 'פתיחה'}</a>`).join('')}
        <a class="btn sm" href="#" data-dppath="${esc(it.id)}" data-dpfile="${esc(main.id)}" title="מעתיק את נתיב הקובץ במחשב, להדבקה בסייר הקבצים עם Ctrl+L">📋</a></div>
    </div>`;
  }
  const protoKind = (pr) => (pr.template === 'supervision' ? 'report' : 'meeting');
  const PROTO_KINDS = { meeting: 'סיכומי פגישות', report: 'דוחות ביצוע ופיקוח' };
  
  function renderProtocols(el) {
    syncDriveProtos(false);
    const kind = ui.protoKind === 'report' ? 'report' : 'meeting';
    const q = ui.protoQ.trim().toLowerCase();
    const src = ui.protoTpl; // '' all, 'drive', a template key, '_other' (site protocols from before the templates)
    const matchProject = (pid, p) => !ui.protoProject || (ui.protoProject === '_none' ? !p : (p && p.id === ui.protoProject));
    const site = db.protocols.filter((pr) => protoKind(pr) === kind).map((pr) => ({ site: pr, p: byId(db.projects, pr.projectId), date: pr.date || '', text: protoSearchText(pr) }));
    const drive = dprot.items.filter((it) => it.kind === kind).map((it) => { const p = dpProject(it); return { drive: it, p, date: it.date || '', text: [it.title, it.label, it.folder, it.group, p ? p.name : '', p ? p.client : ''].join(' ').toLowerCase() }; });
    const all = site.concat(drive);
    const list = all.filter((e) => (!q || e.text.includes(q)) && matchProject('', e.p)
      && (!src || (src === 'drive' ? e.drive : src === '_other' ? e.site && !protoTpl(e.site) : e.site && e.site.template === src)))
      .sort((a, b) => b.date.localeCompare(a.date));
    const cardHtml = (e, o) => (e.site ? protoCardHtml(e.site, o) : driveProtoHtml(e.drive, o));
    let body;
    if (ui.protoGroup !== 'date') {
      // One group per project (or client folder), the one with the most recent document first.
      const map = new Map();
      list.forEach((e) => {

        if (!map.has(k)) map.set(k, { k, p: e.p, label: e.p ? e.p.name : e.drive && e.drive.group ? e.drive.group : 'כללי / ללא פרויקט', items: [] });
        map.get(k).items.push(e);

          <span class="count">${g.items.length} ${noun}${g.p && g.p.client ? ' · ' + esc(g.p.client) : ''}</span>
          ${g.p ? `<button class="btn sm" data-newfor="${esc(g.p.id)}">+ ${kind === 'report' ? 'דוח פיקוח' : 'סיכום פגישה'}</button>` : ''}</div>`;
      const openG = ui.protoOpenGroup && groups.find((g) => g.k === ui.protoOpenGroup);
      if (openG) {

      } else {
        // A dense grid: one small tile per project with its 3 latest documents, as many projects on screen as fit.
        const shortDate = (dt) => (dt ? dt.slice(8, 10) + '.' + dt.slice(5, 7) + '.' + dt.slice(2, 4) : '');
        const row = (e) => {
          const title = e.site ? (e.site.title || protoHeading(e.site)) : (e.drive.title || e.drive.label);
          return e.drive
            ? `<li><a href="${esc(dpUrl(e.drive.files[0]))}" target="_blank" rel="noopener" title="פתיחה ב-Google Drive"><span class="d">${shortDate(e.date)}</span><span class="t">${esc(title)}</span></a></li>`

        };
        body = `<div class="prtiles">${groups.map((g) => `<div class="card prtile" data-tile="${esc(g.k)}" title="כל ה${noun} של ${esc(g.label)}">
          <div class="prtile-head"><b>${esc(g.label)}</b><span class="n">${g.items.length}</span></div>
          ${g.p && g.p.client ? `<div class="prtile-client">${esc(g.p.client)}</div>` : ''}
          <ul>${g.items.slice(0, 3).map(row).join('')}</ul>
          ${g.items.length > 3 ? `<div class="prtile-more">עוד ${g.items.length - 3} ←</div>` : ''}
        </div>`).join('')}</div>`;
      }
    } else {
      // By date: one section per month, newest first.
      const map = new Map();
      list.forEach((e) => { const k = (e.date || '').slice(0, 7); if (!map.has(k)) map.set(k, []); map.get(k).push(e); });
      body = Array.from(map.entries()).map(([k, items]) => {
        const label = k ? new Date(k + '-01T00:00:00').toLocaleDateString('he-IL', { month: 'long', year: 'numeric' }) : 'ללא תאריך';

      }).join('');

      const scope = e && (e.status === 403 || e.status === 401) && /scope|insufficient|permission/i.test(e.message || '');

    }
    if (gdocState[id].s === 'err') toast('Google Docs לא עודכן: ' + gdocState[id].m.replace(/<[^>]+>/g, ''));
    gdocShow(id);

    if (again) protoGdocPush(id);
  }
  // ---------- A report by mail, in the project's usual thread ----------
  // The thread: the one the last report / summary of the project went in (kept on the project), else the newest
  // mail the user sent about the project (by its name, then by the report's recipients).
  async function protoFindThread(pr, pj) {
    const kind = protoKind(pr);
    const known = pj && pj.mailThreads && (pj.mailThreads[kind] || pj.mailThreads.any);
    if (known) return known;
    const word = kind === 'report' ? 'דוח' : 'סיכום';
    const name = ((pj && pj.name) || '').replace(/["()]/g, ' ').trim();
    const first = cleanEmails(pr.emailTo).split(',')[0];
    const qs = [];
    if (name) qs.push(`subject:"${name}" ${word}`, `subject:"${name}"`, `"${name}" ${word}`);
    if (first) qs.push(`to:${first} ${word}`);
    for (const q of qs) { try { const id = await G.gmail.findSent(q); if (id) return id; } catch (e) {} }
    return '';
  }
  // The usual text, as in the last mail of the thread, with this report's date and number; a standard text otherwise.
  function protoMailBody(pr, prevText) {
    const [y, mo, d] = (pr.date || todayStr()).split('-');
    const no = protoNo(pr);
    let t = String(prevText || '').replace(/\r/g, '');
    // Only what the user wrote: not the quoted earlier mails.
    const cut = t.search(/\n[^\n]*(?:wrote:|כתב\/ה:|כתב:|נכתב:)\s*\n|\n-{2,}\s*Original Message|\n-{5,}\s*Forwarded|\nFrom: |\nמאת: /);
    if (cut > 0) t = t.slice(0, cut);
    t = t.split('\n').filter((l) => !/^\s*>/.test(l)).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    if (t) {
      t = t.replace(/\b(\d{1,2})([./])(\d{1,2})\2(\d{4}|\d{2})\b/g, (m, a, sep, b, yy) => [+d, +mo].map((x, i) => (String(i ? b : a).length === 2 ? String(x).padStart(2, '0') : String(x))).join(sep) + sep + (yy.length === 4 ? y : y.slice(2)));
      if (no) t = t.replace(/((?:דוח|דו"ח|ד"ח|סיכום|פרוטוקול)[^\d\n]{0,25}?(?:מס['׳"]?\.?|מספר|#)?\s*)(\d{1,3})(?![\d./])/g, (m, pre, n) => pre + (n.length > 1 ? no.padStart(n.length, '0') : String(parseInt(no, 10))));
      return t;
    }
    const pj = byId(db.projects, pr.projectId);
    const what = pr.template === 'supervision' ? 'דוח פיקוח' + (no ? ' מס\' ' + no : '') : pr.template === 'meeting' ? 'סיכום פגישה' + (no ? ' מס\' ' + no : '') + (pr.title ? ' - ' + pr.title : '') : 'פרוטוקול ' + (pr.title || '');
    return `שלום רב,\n\nמצורף ${what} מיום ${fmtDate(pr.date)}${pj ? ' בפרויקט ' + pj.name : ''}.\nנבקש לעבור על ההנחיות והמשימות שבאחריותכם.\n\nבברכה,\n${(me && me.name) || ''}\nפמי הנדסה בע"מ`;
  }
  // The attachment is always a PDF: from the report's Google Doc, else made through a temporary Google Doc
  // (the Word file on the letterhead, converted by Drive and deleted right after).
  async function protoMailAttachment(pr) {
    const pdf = (buf) => ({ name: protoFileName(pr, 'pdf'), blob: new Blob([buf], { type: 'application/pdf' }) });
    if (pr.gdocId && G.status().driveWrite !== false) {
      try {
        await protoGdocPush(pr.id);
        const cur = byId(db.protocols, pr.id) || pr;
        if (cur.gdocId) return pdf(await G.drive.exportFile(cur.gdocId, 'application/pdf'));
      } catch (e) { /* through a temporary document */ }
    }
    const tmp = await G.drive.save('זמני - ' + protoFileName(pr, 'docx').replace(/\.docx$/, ''), await buildProtocolDocx(pr), '', '', { gdoc: true });
    try { return pdf(await G.drive.exportFile(tmp.id, 'application/pdf')); } finally { G.drive.remove(tmp.id).catch(() => {}); }
  }
  // A problem with the mail is shown in a window that stays, not in a toast that disappears.

    const mine = ((me && me.email) || G.status().email || '').toLowerCase();

        ${G.status().gmailCompose === false ? '<br>כדי להכין את התשובה בתוך Gmail צריך לאשר הרשאה נוספת: <a href="#" data-gdocauth>אישור עכשיו</a>' : ''}</div>

  // Remote changes are merged into the existing objects, so open forms keep valid references.
  let pendingRender = false;
  function applyRemote(state) {
    ['projects', 'tasks', 'invoices', 'protocols'].forEach((col) => {
      const cur = new Map(db[col].map((x) => [x.id, x]));
      db[col] = state[col].map((r) => {
        const o = cur.get(r.id);
        if (!o) return r;
        Object.keys(o).forEach((k) => { if (!(k in r)) delete o[k]; });
        return Object.assign(o, r);
      });
    });

    if (a && $('#content').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) {

        const oldKey = un.split('@')[0] + '_' + BASE_KEY;
        if (oldKey !== key && !localStorage.getItem(key) && localStorage.getItem(oldKey)) {

          localStorage.setItem(key, localStorage.getItem(BASE_KEY));
          localStorage.setItem(BASE_KEY + '-before-login', localStorage.getItem(BASE_KEY));
          localStorage.removeItem(BASE_KEY);
        }
        localStorage.setItem(SESSION_KEY, JSON.stringify({ username: un, name: u.name || un, role: u.role || 'user' }));

        err(navigator.onLine === false ? 'אין חיבור לאינטרנט' : 'טעינת רשימת המשתמשים נכשלה');

  // The mail itself is shown in a closed frame: no scripts run in it, and its styles do not touch the site.
  function mailFrame(box, m, cids) {
    let html = m.html || `<div style="white-space:pre-wrap">${esc(m.text || '').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1">$1</a>')}</div>`;
    if (cids) html = html.replace(/cid:([^"'\s)>]+)/gi, (x, id) => cids[id] || x);
    const f = document.createElement('iframe');
    f.className = 'mr-frame';
    f.setAttribute('sandbox', 'allow-same-origin allow-popups allow-popups-to-escape-sandbox');
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="script-src 'none'; object-src 'none'"><base target="_blank">
      <style>html,body{margin:0;padding:0;background:#fff;color:#1c2533}body{display:flow-root;font:14px/1.55 Arial,'Segoe UI',sans-serif;overflow-wrap:anywhere;padding:2px}img{max-width:100%;height:auto}table{max-width:100%!important}pre{white-space:pre-wrap}blockquote{margin:6px 0;padding-inline-start:10px;border-inline-start:3px solid #d5dbe3;color:#55627a}</style></head><body dir="auto">${html}</body></html>`;
    box.appendChild(f);
    const fit = () => { try { const d = f.contentDocument; if (d && d.body) f.style.height = Math.max(40, Math.ceil(d.body.getBoundingClientRect().height) + 8) + 'px'; } catch (e) {} };
    f.addEventListener('load', () => {
      fit();
      try { new ResizeObserver(fit).observe(f.contentDocument.body); } catch (e) {}
      try { $$('img', f.contentDocument).forEach((i) => i.addEventListener('load', fit)); } catch (e) {}
    });
  }
  // The pictures inside a mail (cid:), as local addresses the frame can show.
  async function mailInline(m) {
    const out = {};
    for (const a of (m.inline || []).slice(0, 12)) {
      try { if (a.cid) out[a.cid] = URL.createObjectURL(await G.gmail.attachment(m.id, a)); } catch (e) {}
    }
    return out;
  }
  function replyDraft(m, all, fwd) {
    const me = (G.status().email || '').toLowerCase();
    const subj = m.subject.replace(/^\s*((re|fwd?|הע|תגובה)\s*:\s*)+/i, '');
    if (fwd) {
      const body = m.text || (m.html ? new DOMParser().parseFromString(m.html.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|tr)>/gi, '\n'), 'text/html').body.textContent : '');
      return { title: 'העברת מייל', to: '', cc: '', subject: 'Fwd: ' + subj,
        text: '\n\n---------- הודעה שהועברה ----------\nמאת: ' + m.from + '\nתאריך: ' + mailFullWhen(m.date) + '\nנושא: ' + m.subject + '\nאל: ' + m.to + '\n\n' + (body || '').trim() + (m.files.length ? '\n\n(קבצים מצורפים במקור: ' + m.files.map((f) => f.name).join(', ') + ')' : '') };
    }
    const sentByMe = m.labels.includes('SENT');
    let to = sentByMe ? mailAddrs(m.to) : mailAddrs(m.replyTo || m.from);
    let cc = [];
    if (all) {
      const seen = new Set(to.map((x) => x.toLowerCase()).concat([me]));
      cc = mailAddrs(sentByMe ? m.cc : [m.to, m.cc].filter(Boolean).join(',')).filter((x) => { const k = x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
    }
    return { title: all ? 'תשובה לכולם' : 'תשובה', to: to.join(', '), cc: cc.join(', '), subject: 'Re: ' + subj, text: '',
      threadId: m.threadId, inReplyTo: m.messageId, references: [m.references, m.messageId].filter(Boolean).join(' ') };
  }

  function mbContactGroups() {
    const seen = new Set();
    const person = (name, role, phone, email) => {
      const c = !email ? contactFor(name) : null;
      return { name: String(name || '').trim(), role: role || (c && (c.role || c.category)) || '', phone: phone || (c && c.phone) || '', email: email || (c && c.email) || '' };
    };
    const groups = (db.projects || []).slice().sort(projSort).map((p) => {
      const pn = normName(p.name);
      const list = []; const have = new Set();
      const add = (x) => { const k = normName(x.name); if (!k || have.has(k)) return; have.add(k); seen.add(k); list.push(x); };
      (p.team || []).forEach((m) => add(person(m.name, m.role, m.phone)));
      if (pn) (db.contacts || []).filter((c) => c.projects && normName(c.projects).includes(pn)).forEach((c) => add(person(c.name, c.role || c.category, c.phone, c.email)));
      return { p, list };
    }).filter((g) => g.list.length);
    const rest = (db.contacts || []).filter((c) => c.email && !seen.has(normName(c.name))).map((c) => person(c.name, c.role || c.category, c.phone, c.email));
    if (rest.length) groups.push({ p: null, list: rest });
    return groups;
  }

    else if ((k === 'o' || k === 'Enter') && !M.open && list[M.focus]) go(() => mbOpenThread(list[M.focus]));
    else if (k === 'u' && M.open) go(() => mbGo(M.view, M.arg));
    else if (k === 'x' && !M.open && list[M.focus]) go(() => { const id = list[M.focus].id; if (M.sel.has(id)) M.sel.delete(id); else M.sel.add(id); mbDrawList(panel); });
    else if (k === 's') go(() => { const ids = target(); const t0 = list.find((x) => x.id === ids[0]); if (ids.length) mbAct(t0 && t0.starred ? 'unstar' : 'star', ids); });
    else if (k === 'e') go(() => mbAct('archive', target()));
    else if (k === '#') go(() => mbAct(M.view === 'trash' ? 'untrash' : 'trash', target()));
    else if (k === '!') go(() => mbAct(M.view === 'spam' ? 'notspam' : 'spam', target()));
    else if (k === 'I' && e.shiftKey) go(() => mbAct('read', target()));
    else if (k === 'U' && e.shiftKey) go(() => mbAct('unread', target()));
    else if ((k === 'r' || k === 'a' || k === 'f') && M.open && M.convs[M.open]) go(() => { const msgs = M.convs[M.open].msgs; mbReply(msgs[msgs.length - 1], k === 'r' ? 'reply' : k === 'a' ? 'replyall' : 'fwd'); });
    else if (k === 'l' || k === 'v') go(() => {
      const ids = target(); if (!ids.length) return;
      const btn = $(M.open ? `[data-ract="${k === 'l' ? 'labels' : 'moveto'}"]` : `[data-bulk="${k === 'l' ? 'labels' : 'moveto'}"]`, panel) || $('.mb-bar', panel);
      if (k === 'v') mbMoveMenu(btn, ids); else mbLabelsMenu(btn, list.filter((x) => ids.includes(x.id)).length ? list.filter((x) => ids.includes(x.id)) : [{ id: ids[0], labels: [] }]);
    });
  });
  // Leaving the mail page: back to the regular layout.
  window.addEventListener('hashchange', () => { if (currentView() !== 'mail') document.body.classList.remove('mail-mode'); });

  // ---------- Settings ----------
  function bindLocalDriveSettings(el) {
    const b = $('#ldSave', el);
    if (b) b.addEventListener('click', () => { setLocalDrive({ letter: $('#ldLetter', el).value, root: $('#ldRoot', el).value.trim() }); toast('נשמר: \u2066' + localPath([]) + '\u2069'); render(); });
  }
  function renderSettings(el) {
    const st = settings();
    const ld = localDrive();
    el.innerHTML = cloudSettingsHtml() + googleSettingsHtml() + (GOOGLE ? `
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>נתיב Google Drive במחשב הזה</h2>
        <p>כפתורי "📋 העתק נתיב" מעתיקים את נתיב התיקייה ב-Google Drive למחשב, כדי להדביק בסייר הקבצים (Ctrl+L). ההגדרה נשמרת רק בדפדפן הזה, כי אות הכונן יכולה להיות שונה בכל מחשב.</p>
        <div class="row"><label>אות כונן <select class="input" id="ldLetter" style="width:auto">${'CDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((l) => `<option ${l === ld.letter ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <input class="input" id="ldRoot" dir="ltr" style="flex:1;min-width:220px" value="${esc(ld.root)}" title="התיקייה של פרויקטים פמי, יחסית לכונן">
        <button class="btn primary" id="ldSave">שמירה</button></div>
        <div class="hint" dir="ltr" style="text-align:right">${esc(localPath(['שם הפרויקט']))}</div>
      </div>` : '') + `
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>עוזר Claude</h2>
        <p>העוזר (הכפתור ✨ בפינה) עונה על שאלות על הנתונים במערכת, מסכם פרוטוקולים, ויכול ליצור ולעדכן משימות. הוא עובד עם מפתח API של Anthropic, וכל שיחה מחויבת בחשבון ה-API שלכם. ${CLOUD ? 'המפתח אישי: הוא נשמר בפרופיל הפרטי שלכם בענן, רק אתם יכולים לקרוא אותו, והוא זמין בכל המכשירים שבהם אתם מחוברים.' : 'המפתח נשמר רק בדפדפן הזה.'} הוא לא עולה לגיטהב ולא נכלל בקובץ הגיבוי. בכל שאלה נשלחים ל-Claude גם נתוני המערכת, כדי שיוכל לענות.</p>
        <div class="row"><input class="input" id="aiKeyInput" type="password" dir="ltr" autocomplete="off" placeholder="sk-ant-..." style="flex:1;min-width:220px" value="${esc(getAiKey())}">
        <button class="btn primary" id="aiKeySave">שמירה</button><button class="btn" id="aiKeyDel">מחיקה</button></div>
        <div class="hint">יוצרים מפתח ב-console.anthropic.com, תחת API Keys.</div>
      </div>
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>שליחת פרוטוקולים במייל</h2>
        <p>הנמענים האלה ימולאו אוטומטית בכל פעם שלוחצים "שליחה במייל" בפרוטוקול. אפשר לשנות אותם במייל עצמו לפני השליחה. מפרידים בין כתובות בפסיק.</p>
        <div class="modal-body" style="padding:0;margin-bottom:12px">
          <div class="field full"><label>נמענים קבועים (אל)</label><input class="input" id="setTo" dir="ltr" placeholder="name@example.com, name2@example.com" value="${esc(st.emailTo || '')}"></div>
          <div class="field full"><label>רשימת תפוצה (העתק)</label><textarea class="input" id="setCc" dir="ltr" placeholder="כתובת בכל שורה או מופרדות בפסיק">${esc(st.emailCc || '')}</textarea></div>
          <div class="field full"><label>לפתוח את המייל ב</label><select class="input" id="setApp">
            <option value="gmail" ${!st.mailApp || st.mailApp === 'gmail' ? 'selected' : ''}>Gmail (פתיחת טיוטה)</option>
            <option value="mailto" ${st.mailApp === 'mailto' ? 'selected' : ''}>אפליקציית המייל של המכשיר (Outlook, Mail)</option>
            ${GOOGLE ? `<option value="gmailApi" ${st.mailApp === 'gmailApi' ? 'selected' : ''}>Gmail: שליחה ישירה עם Word מצורף</option>` : ''}</select></div>
        </div>
        <div class="row"><button class="btn primary" id="saveMail">שמירה</button></div>
      </div>
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>גיבוי ושחזור</h2>
        <p>${CLOUD ? 'הנתונים נשמרים בענן ומסונכרנים בין כל המשתמשים והמכשירים, וזמינים גם בלי רשת (השינויים נשלחים כשהחיבור חוזר). אפשר גם להוריד קובץ גיבוי למחשב.' : 'הנתונים נשמרים רק בדפדפן ובמכשיר הזה. כדי לא לאבד אותם, או כדי להעביר אותם למכשיר אחר, הורידו קובץ גיבוי מדי פעם וטענו אותו במכשיר השני.'}</p>
        <div class="row"><button class="btn primary" id="expBtn">הורדת קובץ גיבוי</button>
        ${isAdmin() ? '<label class="btn">טעינת קובץ גיבוי<input type="file" id="impFile" accept=".json,application/json" hidden></label>' : ''}</div>
        <div class="hint">במערכת כרגע: ${db.projects.length} פרויקטים, ${db.tasks.length} משימות, ${db.invoices.length} חשבונות, ${db.protocols.length} פרוטוקולים.</div>
      </div>
      ${nativeBridge() ? '' : `<div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>התקנה כאפליקציה בטלפון</h2>
        <p><strong>אייפון:</strong> פתחו את האתר בספארי, לחצו על כפתור השיתוף ובחרו "הוספה למסך הבית".<br>
        <strong>אנדרואיד:</strong> פתחו את האתר בכרום, לחצו על תפריט שלוש הנקודות ובחרו "התקנת אפליקציה".</p>
        <div class="row"><button class="btn primary" id="installBtn" style="display:none">התקנה עכשיו</button></div>
      </div>`}
      ${isAdmin() ? `<div class="card card-pad settings" style="max-width:720px">
        <h2>איפוס</h2>
        <p>${CLOUD ? 'מחיקה של כל נתוני החברה בענן, אצל כל המשתמשים.' : 'מחיקה של כל הנתונים במכשיר הזה.'} כדאי להוריד קובץ גיבוי לפני כן.</p>
        <div class="row"><button class="btn danger" id="wipeBtn">מחיקת כל הנתונים</button>
        ${CLOUD ? '' : '<button class="btn" id="demoBtn">טעינת נתוני דוגמה</button>'}</div>
      </div>` : ''}`;
    $('#aiKeySave', el).addEventListener('click', async () => {
      const v = $('#aiKeyInput', el).value.trim();
      try { await setAiKey(v); } catch (e) { toast('שמירת המפתח נכשלה'); return; }
      aiClient = null; aiReset(); toast(v ? 'המפתח נשמר' : 'המפתח נמחק');
    });
    $('#aiKeyDel', el).addEventListener('click', async () => {
      try { await setAiKey(''); } catch (e) { toast('מחיקת המפתח נכשלה'); return; }
      $('#aiKeyInput', el).value = ''; aiClient = null; aiReset(); toast('המפתח נמחק');
    });
    $('#saveMail', el).addEventListener('click', () => {
      const bad = [$('#setTo', el).value, $('#setCc', el).value].join(',').split(/[\s,;]+/).filter((x) => x && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
      st.emailTo = $('#setTo', el).value.trim(); st.emailCc = $('#setCc', el).value.trim(); st.mailApp = $('#setApp', el).value;
      save(); toast(bad.length ? 'נשמר. כתובות לא תקינות ידולגו: ' + bad.join(', ') : 'הגדרות המייל נשמרו');
    });
    $('#expBtn', el).addEventListener('click', () => download('femy-גיבוי-' + todayStr() + '.json', JSON.stringify(db, null, 2), 'application/json'));
    const imp = $('#impFile', el);
    if (imp) imp.addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.projects)) throw new Error();
          if (!confirm(CLOUD ? 'הטעינה תחליף את כל נתוני החברה בענן, אצל כל המשתמשים. להמשיך?' : 'הטעינה תחליף את כל הנתונים הנוכחיים במכשיר. להמשיך?')) return;
          db = Object.assign(emptyDb(), d); if (CLOUD) db.demo = false; save(); render(); toast('הגיבוי נטען בהצלחה');
        } catch (err) { toast('הקובץ אינו קובץ גיבוי תקין'); }
      };
      r.readAsText(file);
    });
    const wipe = $('#wipeBtn', el);
    if (wipe) wipe.addEventListener('click', () => { if (confirm(CLOUD ? 'למחוק את כל נתוני החברה בענן, אצל כל המשתמשים? לא ניתן לבטל.' : 'למחוק את כל הנתונים? לא ניתן לבטל.')) { db = emptyDb(); save(); render(); toast('כל הנתונים נמחקו'); } });
    const demo = $('#demoBtn', el);
    if (demo) demo.addEventListener('click', () => { if (confirm('נתוני הדוגמה יחליפו את הנתונים הנוכחיים. להמשיך?')) { db = demoData(); save(); render(); } });
    bindCloudSettings(el);
    bindGoogleSettings(el);
    bindLocalDriveSettings(el);
    const ib = $('#installBtn', el);
    if (ib && deferredInstall) { ib.style.display = ''; ib.addEventListener('click', promptInstall); }
  }

  // ---------- Modal ----------
  let modalSubmit = null; let modalDelete = null; let modalOnClose = null; let modalGen = 0;
  function openModal(title, bodyHtml, onSubmit, onDelete, deleteNote) {
    $('#modalTitle').textContent = title;
    $('#modalForm').classList.remove('wide', 'with-pv');
    $('#modalBody').innerHTML = bodyHtml;
    modalSubmit = onSubmit; modalDelete = onDelete; modalOnClose = null; modalGen++;
    $('#modalForm button[type=submit]').textContent = 'שמירה';
    const del = $('#modalDelete');
    del.style.display = onDelete ? '' : 'none'; del.textContent = 'מחיקה';
    const gf = $('#modalGdoc'); gf.style.display = 'none'; $('[data-gdocst]', gf).dataset.id = ''; $('[data-gdocst]', gf).innerHTML = ''; $('[data-gdocfoot]', gf).onclick = null;
    del.dataset.note = deleteNote || '';
    $('#modalBg').classList.add('show');
    const first = $('#modalBody input, #modalBody select, #modalBody textarea');
    if (first && window.matchMedia('(min-width: 800px)').matches) first.focus();
  }
  function closeModal() {
    const fn = modalOnClose; modalOnClose = null;
    if (fn) try { fn(); } catch (e) {}
    $('#modalBg').classList.remove('show'); modalSubmit = modalDelete = null;
  }
  // The form's fields, as the submit hands them over.
  function modalData() {
    const fd = new FormData($('#modalForm')); const data = {};
    $$('#modalBody [name]').forEach((inp) => { data[inp.name] = inp.type === 'checkbox' ? inp.checked : (fd.get(inp.name) || '').toString().trim(); });
    return data;
  }
  // Saves the open form while it is being typed in (a moment after the last change, and when it closes), so
  // everyone sees the document / task as it is being written, not only after "שמירה".
  function liveForm(fn, delay) {
    const gen = modalGen; let timer = null;
    const run = () => { clearTimeout(timer); timer = null; if (gen === modalGen) fn(); };
    const later = () => { if (gen !== modalGen) return; clearTimeout(timer); timer = setTimeout(run, delay || 1500); };
    const body = $('#modalBody');
    body.addEventListener('input', later);
    body.addEventListener('change', later);
    body.addEventListener('click', (e) => { if (e.target.closest('button')) later(); });
    modalOnClose = () => { if (timer) run(); };
  }

  // ---------- Misc ----------
  // When running inside the phone app (Expo WebView), hand files to the native side.
  const nativeBridge = () => window.ReactNativeWebView;
  function downloadBlob(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
  function download(name, text, type) {
    if (nativeBridge()) { nativeBridge().postMessage(JSON.stringify({ type: 'download', name, text, mime: type })); return; }
    const blob = new Blob([text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function closeSidebar() { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }

  // PWA install prompt (Android / desktop Chrome)
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredInstall = e;
    $('#installTop').style.display = '';
    if (currentView() === 'settings') render();
  });
  function promptInstall() {
    if (!deferredInstall) { location.hash = 'settings'; return; }
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(() => { deferredInstall = null; $('#installTop').style.display = 'none'; });
  }
  window.addEventListener('appinstalled', () => { $('#installTop').style.display = 'none'; toast('האפליקציה הותקנה'); });

  // ---------- Init ----------
  document.addEventListener('DOMContentLoaded', () => {
    initAi();
    $('#modalForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = modalData();
      const fn = modalSubmit; modalOnClose = null; closeModal(); if (fn) fn(data);
    });
    $('#modalDelete').addEventListener('click', () => {
      const note = $('#modalDelete').dataset.note;
      if (!confirm('למחוק את הפריט?' + (note ? '\n' + note : ''))) return;
      const fn = modalDelete; closeModal(); if (fn) fn();
    });
    $$('[data-close]').forEach((b) => b.addEventListener('click', closeModal));
    $('#modalBg').addEventListener('mousedown', (e) => { if (e.target.id === 'modalBg') closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    $('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
    $('#overlay').addEventListener('click', closeSidebar);
    $('#installTop').addEventListener('click', promptInstall);
    $('#addBtn').addEventListener('click', () => {
      const v = currentView();
      if (v === 'projects') openProjectForm();
      else if (v === 'accounts') { if (ui.accTab === 'invoices') openInvoiceForm(); else openLedgerImport(); }
      else if (v === 'protocols') openProtocolForm();
      else if (v === 'project') openTaskForm(null, { projectId: ui.projectId });
      else openTaskForm();
    });
    window.addEventListener('hashchange', render);
    loadDriveProtos();
    G.onChange(() => { if (currentView() === 'google' || currentView() === 'mail' || currentView() === 'settings') render(); refreshMailBadge(); });
    if (CLOUD) { render(); startCloud(); }
    else if (!localSession) { localGate(); }
    else {
      $('#logoutName').textContent = localSession.name || localSession.username;
      $('#logoutTop').style.display = '';
      $('#logoutTop').addEventListener('click', localSignOut);
      G.init(localSession.username, /@/.test(localSession.username) ? localSession.username : '');
      window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) { db = load(); render(); } });
      if (!localStorage.getItem(STORE_KEY)) save();
      render();
      importDriveProjects(false).then(() => importLedgers(false)).then(() => syncTaskSheet(false));
      setInterval(() => syncTaskSheet(false), 10 * 60 * 1000);
      document.addEventListener('visibilitychange', () => {
        const st = settings().sheetSync;
        if (document.visibilityState === 'visible' && (!st || Date.now() - st.at > 5 * 60 * 1000)) syncTaskSheet(false);
      });
      G.onChange(() => { if (G.silent() && !settings().sheetSync) syncTaskSheet(false); });
    }

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  });
})();
</script>
</body>
</html>
