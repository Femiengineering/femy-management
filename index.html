  <style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e3e8ef;
  --text: #1c2533;
  --muted: #64748b;
  --primary: #1f5fae;
  --primary-soft: #e6effa;
  --sidebar: #15253d;
  --sidebar-text: #c9d5e6;
  --green: #1e8a5a;
  --green-soft: #e3f4ec;
  --amber: #b7791f;
  --amber-soft: #fdf3e1;
  --red: #c53b3b;
  --red-soft: #fbe9e9;
  --gray-soft: #eef1f5;
  --purple: #6b4fbb;
  --purple-soft: #efeafb;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Assistant", "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }

/* Layout */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 230px;
  background: var(--sidebar);
  color: var(--sidebar-text);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand-name { color: #fff; font-size: 20px; font-weight: 700; }
.brand-sub { font-size: 13px; opacity: .7; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 8px;
  color: var(--sidebar-text); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.active { background: var(--primary); color: #fff; }
.nav .ico { width: 20px; text-align: center; }
.nav .badge {
  margin-inline-start: auto; background: rgba(255,255,255,.15);
  border-radius: 10px; padding: 0 8px; font-size: 12px;
}
.nav-sep { margin: 14px 12px 4px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11.5px; opacity: .55; }
.nav a.minor { padding: 7px 12px; font-size: 14px; font-weight: 400; }
.sidebar-foot { padding: 14px 20px; font-size: 12px; opacity: .6; }

/* Project page and groups */
.back-link { display: inline-block; margin-bottom: 12px; text-decoration: none; font-weight: 600; }
.group-head { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; flex-wrap: wrap; }
.group-head:first-child { margin-top: 0; }
.group-head h2 { font-size: 17px; margin: 0; }
.group-head .count { color: var(--muted); font-size: 13px; }
.group-head a { text-decoration: none; color: inherit; }
.group-head a:hover { text-decoration: underline; }
.proj.click { cursor: pointer; transition: border-color .15s; }
.proj.click:hover { border-color: var(--primary); }
.proj-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.proj-head .grow { flex: 1; min-width: 240px; }
.proj-head h2 { font-size: 22px; margin: 0 0 2px; }
.proj-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.status-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.ov-name { font-weight: 600; color: inherit; text-decoration: none; }
.ov-name:hover { text-decoration: underline; }
td .progress { min-width: 80px; }
.proj-dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
.proj-dl dt { color: var(--muted); }
.proj-dl dd { margin: 0; }
.mini-proto { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.mini-proto:last-child { border-bottom: 0; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 28px; display: flex; align-items: center; gap: 18px;
  z-index: 5;
}
.topbar h1 { font-size: 20px; margin: 0; flex: 1; }
.top-logo-link { display: flex; flex-shrink: 0; padding-inline-end: 18px; border-inline-end: 1px solid var(--border); }
.top-logo { height: 120px; width: auto; display: block; }
.menu-btn { display: none; background: none; border: 0; font-size: 22px; cursor: pointer; padding: 4px 8px; }
.content { padding: 24px 28px 48px; max-width: 1400px; width: 100%; }

/* Buttons */
.btn {
  border: 1px solid var(--border); background: var(--surface);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
a.btn { text-decoration: none; color: inherit; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.icon-btn {
  background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 6px;
  color: var(--muted); font-size: 15px;
}
.icon-btn:hover { background: var(--gray-soft); color: var(--text); }

/* Cards & grid */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.card-pad { padding: 18px 20px; }
.card h2 { font-size: 16px; margin: 0 0 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-head h2 { margin: 0; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
.kpi { padding: 16px 18px; }
.kpi .label { color: var(--muted); font-size: 13px; font-weight: 600; }
.kpi .value { font-size: 28px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.kpi.warn .value { color: var(--red); }
.kpi.good .value { color: var(--green); }

.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-bottom: 18px; }
.grid-2 > * { min-width: 0; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar .spacer { flex: 1; }
.input, select.input, textarea.input {
  border: 1px solid var(--border); background: var(--surface);
  border-radius: 8px; padding: 8px 10px; min-width: 0;
}
.input:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
.search { width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--primary-soft); color: var(--primary); }

/* Pills */
.pill {
  display: inline-block; padding: 1px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.pill.gray { background: var(--gray-soft); color: #475569; }
.pill.blue { background: var(--primary-soft); color: var(--primary); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.purple { background: var(--purple-soft); color: var(--purple); }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 13px; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
tbody tr:hover { background: var(--surface-2); }
td.num, th.num { text-align: left; font-variant-numeric: tabular-nums; direction: ltr; }
td.actions { white-space: nowrap; text-align: left; width: 1%; }
tfoot td { font-weight: 700; background: var(--surface-2); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* Kanban */
.tgroup { padding: 14px 16px; margin-bottom: 12px; }
#taskViews { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
#taskViews button { white-space: nowrap; }
#taskArea { touch-action: pan-y; }
.sheet-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: -4px 0 12px; }
.tg-note { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.tg-title { min-width: 0; }
.contact .tg-meta a { color: inherit; }
.tlink { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--primary); text-decoration: none; background: var(--surface); white-space: nowrap; }
.tlink:hover { background: var(--primary-soft); }
.tg-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.tg-head .grow { flex: 1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.tg-row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tg-row:last-child { border-bottom: 0; }
.tg-title { flex: 1; min-width: 180px; color: inherit; text-decoration: none; }
.tg-title:hover { text-decoration: underline; }
.tg-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.col { background: #eaeef3; border-radius: var(--radius); padding: 10px; min-height: 200px; display: flex; flex-direction: column; }
.col.drop { outline: 2px dashed var(--primary); background: var(--primary-soft); }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 10px; font-weight: 700; }
.col-head .count { color: var(--muted); font-weight: 600; font-size: 13px; }
.col-body { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.tcard {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; cursor: grab; box-shadow: var(--shadow);
  border-inline-start: 4px solid var(--border);
}
.tcard.dragging { opacity: .5; }
.tcard.p-urgent { border-inline-start-color: var(--red); }
.tcard.p-high { border-inline-start-color: var(--amber); }
.tcard.p-medium { border-inline-start-color: var(--primary); }
.tcard.p-low { border-inline-start-color: #94a3b8; }
.tcard .t-title { font-weight: 600; margin-bottom: 6px; }
.tcard .t-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.overdue { color: var(--red) !important; font-weight: 700; }

/* Projects */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.pcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.pcol { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; min-width: 0; }
.pcol-title { font-size: 15px; margin: 0 0 8px; color: var(--muted); }
.pcol-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pcol-head .pcol-title { margin: 0; flex: 1; }
.pcol-head .hint { font-size: 12px; }
.pgroup { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); margin-bottom: 6px; overflow: hidden; }
.pgroup:last-child { margin-bottom: 0; }
.pgroup-head { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; font-size: 13px; color: inherit; text-align: start; padding: 9px 10px; background: none; border: 0; cursor: pointer; min-height: 40px; }
.pgroup-head:hover { background: var(--surface-2); }
.pgroup-head:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.pgroup-head .count { color: var(--muted); font-size: 12px; font-weight: 600; background: var(--surface-2); border-radius: 10px; padding: 1px 7px; }
.pgroup-head .pg-name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pgroup-head .pg-sum { display: flex; flex-wrap: wrap; gap: 8px; margin-inline-start: auto; color: var(--muted); font-size: 12px; justify-content: flex-end; }
.pgroup-head .pg-sum span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.pg-chev { flex: none; width: 16px; text-align: center; color: var(--muted); font-size: 11px; transition: transform .25s ease; }
.pgroup.open .pg-chev { transform: rotate(-90deg); }
.pgroup-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
.pgroup.open .pgroup-body { grid-template-rows: 1fr; }
.pgroup-inner { min-height: 0; overflow: hidden; }
.pgroup-inner .ptile-grid { padding: 2px 10px 10px; }
@media (prefers-reduced-motion: reduce) { .pgroup-body, .pg-chev { transition: none; } }
@media (max-width: 520px) { .pgroup-head { flex-wrap: wrap; } .pgroup-head .pg-sum { flex-basis: 100%; justify-content: flex-start; padding-inline-start: 24px; } }
.plist { display: flex; flex-direction: column; gap: 6px; }
.ptile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.ptile { aspect-ratio: auto; min-height: 76px; justify-content: space-between; }
.ptile { position: relative; display: flex; flex-direction: column; gap: 5px; padding: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); cursor: pointer; font-size: 12px; line-height: 1.3; min-width: 0; }
.ptile:hover { border-color: var(--primary); background: var(--primary-soft); }
.ptile.s-done { opacity: .65; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; align-items: start; }
.ccard { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; transition: border-color .15s, box-shadow .15s; }
.ccard:hover { border-color: var(--primary); }
.ccard.open { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.ccard-main { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; padding: 12px 10px 10px; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; text-align: center; border-radius: var(--radius); }
.ccard-main:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.ccard-logo { width: 100%; height: 96px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.ccard-logo img { max-width: 92%; max-height: 88px; object-fit: contain; }
.ccard-av { width: 60px; height: 60px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
.ccard-name { font-weight: 700; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ccard-sum { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; color: var(--muted); font-size: 11px; min-height: 15px; }
.ccard-sum span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.ccard-count { font-size: 12px; color: var(--muted); font-weight: 600; }
.ccard-acts { position: absolute; top: 16px; inset-inline-end: 14px; display: flex; gap: 3px; opacity: 0; transition: opacity .15s; }
.ccard:hover .ccard-acts, .ccard:focus-within .ccard-acts { opacity: 1; }
@media (hover: none) { .ccard-acts { opacity: 1; } }
.cpanel { grid-column: 1 / -1; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
.cpanel.open { grid-template-rows: 1fr; }
.cpanel-inner { min-height: 0; overflow: hidden; }
.cpanel .ptile-grid { background: var(--surface); border: 1px solid var(--primary); border-radius: var(--radius); padding: 10px; }
@media (prefers-reduced-motion: reduce) { .cpanel { transition: none; } }
@media (max-width: 520px) { .cgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .ccard-logo { height: 76px; } .ccard-logo img { max-height: 70px; } }
.pgroup-top { display: flex; align-items: center; }
.pgroup-top .pgroup-head { flex: 1; min-width: 0; }
.pg-acts { display: flex; gap: 3px; padding-inline-end: 8px; flex: none; }
.ptile-act { width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
.ptile-act:hover { border-color: var(--primary); }
.ptile-name { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.ptile-meta { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; }
.pg-logo { width: 40px; height: 40px; border-radius: 50%; flex: none; object-fit: contain; background: #fff; border: 1px solid var(--border); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
span.pg-logo { border: 0; }
img.pg-logo { width: 56px; border-radius: 8px; padding: 2px; }
.pdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #94a3b8; }
.pdot.blue { background: var(--primary); } .pdot.green { background: var(--green); } .pdot.amber { background: var(--amber); } .pdot.purple { background: var(--purple); } .pdot.red { background: var(--red); }
/* Project page: the phase, its progress chart and the four tiles */
.phase-card { margin-bottom: 18px; }
.phase-top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.phase-steps { display: flex; gap: 0; align-items: center; }
.phase-steps span { padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--gray-soft); border: 1px solid var(--border); }
.phase-steps span:first-child { border-radius: 0 99px 99px 0; }
.phase-steps span:last-child { border-radius: 99px 0 0 99px; }
.phase-steps span + span { border-right: 0; }
.phase-steps span.past { color: var(--green); background: var(--green-soft); }
.phase-steps span.on { color: #fff; background: var(--primary); border-color: var(--primary); }
.phase-steps span.on.done { background: var(--green); border-color: var(--green); }
.phase-kpi { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.phase-kpi strong { color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; }
.phase-kpi .behind { color: var(--red); } .phase-kpi .ahead { color: var(--green); }
.phase-upd { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-inline-start: auto; }
.phase-upd input[type=range] { width: 140px; }
.pchart { position: relative; margin-top: 10px; }
.pchart svg { display: block; width: 100%; height: auto; overflow: visible; }
.pchart .grid { stroke: var(--border); stroke-width: 1; }
.pchart .axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.pchart .plan { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.pchart .act { stroke: var(--primary); stroke-width: 2; fill: none; stroke-linejoin: round; }
.pchart .act-area { fill: var(--primary); opacity: .08; }
.pchart .pt { fill: var(--primary); stroke: var(--surface); stroke-width: 2; }
.pchart .today { stroke: var(--amber); stroke-width: 1; stroke-dasharray: 2 3; }
.pchart .today-l { fill: var(--amber); font-size: 11px; font-weight: 600; }
.pchart .ev { stroke: var(--surface); stroke-width: 2; }
.pchart .ev.report { fill: var(--purple); } .pchart .ev.meeting { fill: var(--green); }
.pchart .hit { fill: transparent; cursor: default; }
.pchart .pc-tip { position: absolute; pointer-events: none; background: var(--sidebar); color: #fff; font-size: 12px; padding: 5px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -10px; display: none; z-index: 2; }
.pc-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.pc-legend i { display: inline-block; vertical-align: middle; margin-inline-end: 5px; }
.pc-legend .l-act { width: 16px; height: 2px; background: var(--primary); }
.pc-legend .l-plan { width: 16px; height: 0; border-top: 2px dashed var(--muted); }
.pc-legend .l-dot { width: 8px; height: 8px; border-radius: 50%; }
.ptiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.ptk { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-decoration: none; color: inherit; min-width: 0; transition: border-color .15s; }
.ptk:hover { border-color: var(--primary); }
.ptk .lab { color: var(--muted); font-size: 13px; font-weight: 600; }
.ptk .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.ptk .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptk .progress { height: 6px; margin-top: 4px; }
.ptk.split { flex-direction: row; gap: 0; padding: 0; cursor: default; }
.ptk.split > a { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; color: inherit; text-decoration: none; min-width: 0; }
.ptk.split > a + a { border-right: 1px solid var(--border); }
.ptk.split > a:hover { background: var(--primary-soft); }
.ptk.split:hover { border-color: var(--border); }
@media (max-width: 1000px) { .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .ptiles { gap: 10px; } .ptk.split { grid-column: span 2; order: 1; } .ptk .val { font-size: 21px; } .phase-upd { margin-inline-start: 0; } }
@media (max-width: 800px) { .pcols { grid-template-columns: minmax(0, 1fr); } .ptile-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); } }
.proj { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.proj-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.proj-name { font-size: 17px; font-weight: 700; }
.proj-client { color: var(--muted); font-size: 13.5px; }
.proj dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13.5px; }
.proj dt { color: var(--muted); }
.proj dd { margin: 0; }
.progress { height: 8px; background: var(--gray-soft); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.progress.done > span { background: var(--green); }
.proj-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; font-size: 13px; color: var(--muted); }

/* Lists in dashboard */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .meta { font-size: 12.5px; color: var(--muted); }

.prog-row { display: grid; grid-template-columns: 1fr 2fr 44px; gap: 10px; align-items: center; padding: 7px 0; font-size: 14px; }
.prog-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-row .pct { text-align: left; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Bar chart */
.chart { display: flex; align-items: flex-end; gap: 14px; height: 180px; padding: 10px 4px 0; border-bottom: 1px solid var(--border); }
.chart .m { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.chart .bars { display: flex; gap: 3px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
.chart .bar { width: 40%; max-width: 22px; border-radius: 4px 4px 0 0; min-height: 2px; }
.chart .bar.in { background: var(--primary); }
.chart .bar.out { background: #e0a43a; }
.chart-labels { display: flex; gap: 14px; padding: 6px 4px 0; }
.chart-labels span { flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: middle; }

/* Protocols */
.proto { margin-bottom: 12px; }
.proto-head { display: flex; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; }
.proto-date { background: var(--primary-soft); color: var(--primary); border-radius: 8px; padding: 6px 10px; text-align: center; min-width: 64px; font-weight: 700; line-height: 1.2; }
.proto-date small { display: block; font-weight: 500; font-size: 11.5px; }
.proto-title { font-weight: 700; }
.proto-sub { font-size: 13px; color: var(--muted); }
.proto-body { padding: 0 18px 16px; border-top: 1px solid var(--border); display: none; }
.proto.open .proto-body { display: block; }
.proto-body h4 { margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
.proto-body p { margin: 0; white-space: pre-wrap; }
.proto-body ul { margin: 0; padding-inline-start: 20px; }
.chev { transition: transform .15s; color: var(--muted); }
.proto-new { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.tpl-tag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 1px 7px; margin-inline-end: 7px; vertical-align: 1px; background: var(--primary-soft); color: var(--primary); }
.tpl-tag.tpl-supervision { background: #fff1dc; color: #9a5b00; }
.tpl-tag.tpl-tour { background: #e8eefc; color: #2f55b5; }
.tpl-tag.tpl-draft { background: #fef3c7; color: #92400e; }
.pi-del { color: #b91c1c; white-space: nowrap; }
.pi-top .input { min-width: 0; }
@media (max-width: 700px) { .pi-del-l { display: none; } }
.pi-phpos { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.pv-gdoc { font-size: 12px; }
.pv-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; font-size: 13px; }
.pv-bar b { font-size: 14px; }
/* Protocol form: the form on the right, a fixed live preview on the left (on top on narrow screens). */
.modal.wide.with-pv { max-width: 1480px; }
.modal.with-pv .modal-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 44%); grid-template-areas: "form pv"; gap: 18px; align-items: start; }
.pv-form { grid-area: form; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; min-width: 0; }
/* Nothing in the form may grow under the preview (it would cover buttons such as "שמירה ושליחה במייל"). */
.pv-form > * { min-width: 0; }
.pv-form .input, .pv-form select, .pv-form textarea { max-width: 100%; }
.pv-pane { grid-area: pv; position: sticky; top: -28px; z-index: 3; background: var(--surface); padding: 6px 0; min-width: 0; }
.pv-pane iframe { width: 100%; height: calc(100vh - 70px); border: 1px solid var(--border); border-radius: 8px; background: #9aa1a8; display: block; }
.pv-pane [data-preview] { display: none; }
@media (max-width: 1099px) {
  .modal.with-pv .modal-body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "pv" "form"; }
  .pv-pane { position: static; }
  .pv-pane iframe { height: min(440px, 42vh); }
  .pv-pane [data-preview] { display: inline-flex; }
}
.proto-kinds { display: flex; width: 100%; margin-bottom: 12px; }
.proto-kinds button { flex: 1; padding: 10px 12px; font-size: 15px; }
.proto-kinds .n { display: inline-block; min-width: 22px; padding: 0 6px; border-radius: 10px; background: var(--border); color: var(--text); font-size: 12px; margin-inline-start: 4px; }
.proto-kinds button.on .n { background: var(--primary); color: #fff; }
.dp-status { margin: -4px 0 12px; }
/* Protocols by project: one compact tile per project with its latest documents. */
.prtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.prtile { display: flex; flex-direction: column; align-items: stretch; padding: 10px 12px; min-width: 0; cursor: pointer; transition: box-shadow .12s, border-color .12s; }
.prtile:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(16, 24, 40, .1); }
.prtile-head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
.prtile-head b { flex: 1; min-width: 0; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prtile-head .n { flex: none; font-size: 11.5px; font-weight: 600; color: var(--primary); background: var(--primary-soft); border-radius: 9px; padding: 0 7px; }
.prtile-client { font-size: 12px; color: var(--muted); margin: -4px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prtile ul { list-style: none; margin: 0; padding: 0; }
.prtile li { display: flex; font-size: 13px; padding: 3px 0; border-top: 1px solid var(--border); }
.prtile li a { color: inherit; text-decoration: none; display: flex; gap: 8px; align-items: baseline; min-width: 0; flex: 1; }
.prtile li a:hover .t { text-decoration: underline; color: var(--primary); }
.prtile li .d { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 58px; }
.prtile li .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prtile-more { margin-top: auto; padding-top: 4px; font-size: 12px; color: var(--primary); }
.dproto { display: flex; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.dproto .proto-head { flex: 1; min-width: 240px; text-decoration: none; color: inherit; }
.dproto .proto-head:hover .proto-title { text-decoration: underline; }
.dp-acts { display: flex; gap: 6px; padding: 0 14px 0 18px; flex-wrap: wrap; }
.dp-src { color: var(--primary); }
.dp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.dp-cols h3 { font-size: 15px; margin: 0 0 8px; }
.dp-line { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.dp-line small { color: var(--muted); white-space: nowrap; }
.dp-line a { flex: 1; min-width: 0; }
@media (max-width: 760px) { .dp-cols { grid-template-columns: 1fr; } .dp-acts { padding: 0 14px 12px; } }
.proto-doc { padding-top: 12px; overflow-x: auto; }
.proto-doc .fdoc { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 14px 12px 2px; min-width: 560px; font-size: 13px; }
.modal.wide { max-width: 940px; }
.pi-head { display: flex; align-items: center; gap: 8px; }
/* Project team: the people linked to a project, and picking who took part in a meeting */
.tp-box { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.tp-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; background: var(--surface); user-select: none; }
.tp-chip input { margin: 0; }
.tp-chip.on { background: var(--primary-soft); border-color: var(--primary); }
.tp-chip small { color: var(--muted); }
.tp-chip.sugg { border-style: dashed; color: var(--muted); }
.tp-add { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.tp-add .input { width: auto; flex: 1 1 140px; min-width: 0; }
.team-rows { display: flex; flex-direction: column; gap: 6px; }
.team-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; }
@media (max-width: 640px) { .team-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; } .team-row [data-tk="phone"] { display: none; } }
.team-list { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.team-list span b { font-weight: 600; }
.pi-head .spacer { flex: 1; }
.pi-row { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 8px; background: var(--bg); }
.pi-top { display: flex; gap: 6px; align-items: center; }
.pi-top .input { flex: 1; font-weight: 600; }
.pi-num { min-width: 22px; text-align: center; color: var(--muted); font-weight: 700; }
.pi-fields { display: grid; gap: 8px; margin-top: 6px; }
.pi-fields.pi-meeting { grid-template-columns: 1fr 130px 150px; }
.pi-fields.pi-supervision { grid-template-columns: 1fr 1fr 150px; }
.pi-fields.pi-tour { grid-template-columns: 1fr; }
.pi-f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.pi-f textarea { min-height: 54px; resize: vertical; }
.pi-row.asking { border-color: #93c5fd; }
.pf-mail { border-top: 1px dashed var(--border); padding-top: 10px; }
.pf-mail-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pf-mail-row .input { flex: 1 1 260px; }
.pi-photos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.pi-ph { position: relative; }
.pi-ph img { width: 84px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); display: block; background: var(--surface-2); }
.pi-ph button { position: absolute; top: -6px; inset-inline-end: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: #ef4444; color: #fff; font-size: 11px; cursor: pointer; line-height: 20px; padding: 0; }
.pi-phadd { cursor: pointer; }
#docQueueBar { position: fixed; bottom: 14px; inset-inline: 14px; z-index: 2000; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #fff7e6; border: 1px solid #f3c77a; color: #7a4a00; border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 14px; }
#docQueueBar span { flex: 1 1 220px; }
.pi-docpick { flex-basis: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--gray-soft); }
.pi-docpick-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.doc-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.doc-acts label { cursor: pointer; }
.doc-day + .doc-day { margin-top: 10px; }
.doc-day h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
.doc-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.doc-th { position: relative; display: block; width: 96px; height: 72px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; background: var(--gray-soft); cursor: pointer; padding: 0; }
.doc-th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.doc-th.sel { border-color: var(--primary, #2563eb); }
.doc-th.sel::after { content: '✓'; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--primary, #2563eb); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
.doc-up { width: 96px; height: 72px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); border: 1px dashed var(--border); }
@media (max-width: 700px) { .doc-th, .doc-up { width: calc(33.3% - 4px); height: 80px; } }
.pi-ask, .pi-askbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; font-size: 13px; color: #1e3a8a; }
.pi-askbar { margin: 8px 0 0; }
.pi-ask-q { font-weight: 700; white-space: nowrap; }
.pi-ask-txt { flex: 1 1 200px; min-width: 0; color: #334155; }
.pi-ask-btns { display: flex; gap: 6px; margin-inline-start: auto; }
@media (max-width: 700px) { .pv-form { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .pi-fields.pi-meeting, .pi-fields.pi-supervision { grid-template-columns: 1fr 1fr; } .pi-fields .pi-details, .pi-fields .pi-instructions { grid-column: 1 / -1; } }
.proto.open .chev { transform: rotate(-90deg); }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.summary .card { padding: 12px 16px; }
.summary .label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.summary .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.led-kpis { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 14px; color: var(--muted); }
.led-kpis strong { color: var(--text); font-variant-numeric: tabular-nums; margin-inline-start: 4px; }
.lchips { display: flex; flex-wrap: wrap; gap: 4px; }
.lchip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lchip.paid { background: var(--green-soft); color: var(--green); }
.lchip.billed { background: var(--amber-soft); color: var(--amber); }
.led-line { display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; padding: 12px 18px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s; }
.led-line:hover { border-color: var(--primary); }
.led-line .led-name { flex: 1 1 200px; font-size: 16px; }
.led-c { display: flex; flex-direction: column; min-width: 96px; }
.led-c small { color: var(--muted); font-size: 12px; }
.led-c strong { font-variant-numeric: tabular-nums; }
.led-pct { flex-direction: row; align-items: center; gap: 6px; min-width: 120px; }
.led-pct .progress { flex: 1; min-width: 70px; }
.led-table td, .led-table th { padding: 8px 10px; }
.led-table tr.lmain { cursor: pointer; }
.led-table tr.lmain:hover td { background: var(--surface-2); }
.led-table tr.lmain.open td { border-bottom-color: transparent; font-weight: 600; }
.led-table .larrow { display: inline-block; width: 14px; color: var(--muted); font-size: 12px; }
.led-table tr.ldetail td { background: var(--surface-2); padding: 10px 16px 14px; }
.led-contact { margin-top: 8px; font-size: 13.5px; }
.led-table tr.lgroup { cursor: pointer; }
.led-table tr.lgroup:hover td { background: var(--primary-soft); }
.led-table tr.lmain td:first-child { padding-inline-start: 28px; }
.led-table tr.lgroup td { background: var(--surface-2); font-weight: 700; font-size: 13.5px; }
.led-table tr.lsub td, .led-table tfoot td { font-weight: 700; }
.led-dep { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 14px; }
.led-pays { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.led-pays > div { display: flex; flex-direction: column; gap: 3px; }
.led-preview { padding: 8px 10px; border-radius: 8px; background: var(--green-soft); color: var(--green); }
.led-preview.err { background: var(--red-soft); color: var(--red); }

/* Modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
  display: none; align-items: flex-start; justify-content: center; z-index: 50;
  padding: 40px 16px; overflow-y: auto;
}
.modal-bg.show { display: flex; }
.modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 620px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-head h3 { margin: 0; font-size: 18px; }
.modal-body { padding: 18px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-start; }
.modal-foot .spacer { flex: 1; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field textarea { min-height: 80px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1c2533; color: #fff; padding: 10px 18px; border-radius: 8px;
  opacity: 0; transition: all .2s; z-index: 60; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.settings p { color: var(--muted); margin-top: 0; }
.settings .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.settings select.input { max-width: 100%; min-width: 0; width: 100%; }

.overlay { display: none; }

/* Responsive */
@media (max-width: 1000px) {
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 800px) {
  .sidebar {
    position: fixed; inset-inline-start: 0; top: 0; z-index: 40;
    transform: translateX(100%); transition: transform .2s;
  }
  .sidebar.open { transform: translateX(0); }
  .overlay.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
  .menu-btn { display: block; }

  <script>
/* פמי הנדסה - מערכת ניהול ומעקב
 * מצב מקומי: הנתונים נשמרים בדפדפן (localStorage).
 * מצב ענן (כשמוגדר firebase-config.js): התחברות, ונתונים משותפים ב-Firestore דרך cloud.js.
 */
(function () {
  'use strict';

  const BASE_KEY = 'femy-data-v1';
  // Local mode: simple sign-in against users.json. Each user's data has its own key (username_femy-data-v1).
  const SESSION_KEY = 'femy-session';
  const localSession = (() => {
    if (window.FEMY_FIREBASE && window.FEMY_FIREBASE.apiKey) return null;
    try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); return s && s.username ? s : null; } catch (e) { return null; }
  })();
  let STORE_KEY = localSession ? localSession.username + '_' + BASE_KEY : BASE_KEY;

  // ---------- Dictionaries ----------
  const TASK_STATUS = [
    { id: 'todo', label: 'לביצוע', color: 'gray' },
    { id: 'doing', label: 'בתהליך', color: 'blue' },
    { id: 'waiting', label: 'ממתין', color: 'amber' },
    { id: 'done', label: 'הושלם', color: 'green' },
  ];
  const PRIORITY = [
    { id: 'urgent', label: 'דחוף', color: 'red', rank: 0 },
    { id: 'high', label: 'גבוהה', color: 'amber', rank: 1 },
    { id: 'medium', label: 'בינונית', color: 'blue', rank: 2 },
    { id: 'low', label: 'נמוכה', color: 'gray', rank: 3 },
  ];
  const PROJECT_STATUS = [
    { id: 'planning', label: 'תכנון', color: 'purple' },
    { id: 'active', label: 'בביצוע', color: 'blue' },
    { id: 'paused', label: 'מושהה', color: 'amber' },
    { id: 'done', label: 'הושלם', color: 'green' },
  ];
  const INVOICE_TYPE = [
    { id: 'income', label: 'הכנסה (ללקוח)', short: 'הכנסה', color: 'green' },
    { id: 'expense', label: 'הוצאה (מספק)', short: 'הוצאה', color: 'amber' },
  ];
  const INVOICE_STATUS = [
    { id: 'draft', label: 'טיוטה', color: 'gray' },
    { id: 'sent', label: 'נשלח / ממתין לתשלום', short: 'ממתין', color: 'blue' },
    { id: 'paid', label: 'שולם', color: 'green' },
    { id: 'overdue', label: 'באיחור', color: 'red' },
  ];
  const MEETING_TYPE = ['ישיבת צוות', 'ישיבת תיאום', 'סיור באתר', 'פגישה עם לקוח', 'פגישה עם ספק', 'אחר'];

  const byId = (list, id) => list.find((x) => x.id === id);

  // ---------- Utils ----------
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const todayStr = () => toISO(new Date());
  function toISO(d) {
    const z = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  }
  function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return toISO(d); }
  function fmtDate(s) {
    if (!s) return '';
    const [y, m, d] = s.split('-');
    return d + '/' + m + '/' + y;
  }
  const money = new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 0 });
  const fmtMoney = (n) => money.format(Number(n) || 0);
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const pill = (dict, id, useShort) => {
    const o = byId(dict, id);
    return o ? `<span class="pill ${o.color}">${esc(useShort && o.short ? o.short : o.label)}</span>` : '';
  };
  const daysUntil = (s) => {
    if (!s) return null;
    const a = new Date(s + 'T00:00:00'); const b = new Date(todayStr() + 'T00:00:00');
    return Math.round((a - b) / 86400000);
  };
  const isOverdueTask = (t) => t.status !== 'done' && t.due && daysUntil(t.due) < 0;
  const invoiceStatus = (inv) => (inv.status === 'sent' && inv.dueDate && daysUntil(inv.dueDate) < 0 ? 'overdue' : inv.status);
  const invTotal = (inv) => (Number(inv.amount) || 0) * (inv.vat ? 1 + VAT : 1);
  const VAT = 0.18;

  // ---------- Data ----------
  const CLOUD = !!(window.FEMY_FIREBASE && window.FEMY_FIREBASE.apiKey);
  let cloud = null; // the cloud.js module, once loaded
  // The signed-in user's own Google account (calendar, Gmail, Drive), via google.js.
  const G = window.FemyGoogle || { enabled: false, status: () => ({}), valid: () => false, init() {}, forget() {}, onChange() {} };
  const GOOGLE = !!G.enabled;
  // The background sync server (worker/): every 15 minutes it reads the company's Drive with the Google
  // account already connected on the site (its stored token), so the tasks sheet and the protocols stay up to date even with no Google account connected.
  const SYNC = String((window.FEMY_GOOGLE && (window.FEMY_GOOGLE.syncServer || window.FEMY_GOOGLE.tokenServer)) || '').replace(/\/+$/, '');
  let syncDown = false; // the server has no data for us (not set up yet), so stop asking it this session
  async function syncFetch(path, opts) {
    let r;
    try { r = await fetch(SYNC + path, Object.assign({ cache: 'no-store' }, opts)); }
    catch (e) { throw new Error(navigator.onLine === false ? 'אין חיבור לאינטרנט' : 'שרת הסנכרון לא זמין'); }
    if (!r.ok) {
      let j = {}; try { j = await r.json(); } catch (e) { /* ignore */ }
      const down = r.status === 404 || r.status === 405 || r.status === 503;
      if (down) syncDown = true;
      throw Object.assign(new Error(down ? 'הסנכרון ברקע מה-Drive עדיין לא הוגדר בשרת' : j.error || 'HTTP ' + r.status), { status: r.status, code: j.error });
    }
    syncDown = false;
    return r;
  }
  const syncRefresh = () => syncFetch('/data/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  const useSync = (manual) => !!SYNC && (manual || !syncDown);
  let me = null; // signed-in user { uid, email, name, photo, role }
  let profile = {}; // the user's private profile (Claude key)
  const isAdmin = () => !CLOUD || (me && me.role === 'admin');
  let db = CLOUD || !localSession ? emptyDb() : load();

  function emptyDb() { return { projects: [], tasks: [], invoices: [], protocols: [], contacts: [], settings: {}, demo: false }; }
  const settings = () => (db.settings = db.settings || {});

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        return Object.assign(emptyDb(), d);
      }
    } catch (e) { /* ignore */ }
    return demoData();
  }
  function save() {
    if (CLOUD) { if (cloud && me) cloud.push(db).catch(() => {}); return; }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
    catch (e) { toast('שמירה נכשלה: האחסון בדפדפן אינו זמין'); }
  }
  // Data saved in this browser before the move to the cloud (not the demo data).
  function localLegacy() {
    try { const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); return d && !d.demo && (d.tasks || []).length + (d.projects || []).length + (d.protocols || []).length + (d.invoices || []).length ? d : null; } catch (e) { return null; }
  }

  function demoData() {
    const p1 = uid(), p2 = uid(), p3 = uid(), p4 = uid();
    return {
      demo: true,
      projects: [
        { id: p1, name: 'בניין מגורים - רחוב הרצל 12', client: 'לקוח לדוגמה א׳', location: 'רמת גן', manager: 'דני', status: 'active', progress: 55, start: addDays(-120), end: addDays(150), budget: 4200000, notes: 'שלב שלד, קומה 4 מתוך 7' },
        { id: p2, name: 'מבנה תעשייה - אזור התעשייה', client: 'לקוח לדוגמה ב׳', location: 'חולון', manager: 'רונית', status: 'planning', progress: 15, start: addDays(-20), end: addDays(300), budget: 2800000, notes: 'הגשת היתר בתהליך' },
        { id: p3, name: 'שיפוץ משרדים', client: 'לקוח לדוגמה ג׳', location: 'תל אביב', manager: 'דני', status: 'active', progress: 80, start: addDays(-60), end: addDays(25), budget: 650000, notes: '' },
        { id: p4, name: 'חיזוק מבנה תמ״א 38', client: 'לקוח לדוגמה ד׳', location: 'גבעתיים', manager: 'יוסי', status: 'done', progress: 100, start: addDays(-400), end: addDays(-15), budget: 3100000, notes: 'נמסר ללקוח' },
      ],
      tasks: [
        { id: uid(), title: 'הזמנת ברזל לקומה 5', projectId: p1, assignee: 'דני', priority: 'urgent', status: 'todo', due: addDays(1), notes: '' },
        { id: uid(), title: 'בדיקת מעבדה ליציקת תקרה', projectId: p1, assignee: 'יוסי', priority: 'high', status: 'doing', due: addDays(3), notes: '' },
        { id: uid(), title: 'השלמת מסמכים להיתר בנייה', projectId: p2, assignee: 'רונית', priority: 'high', status: 'waiting', due: addDays(-2), notes: 'ממתין לחתימת מהנדס קונסטרוקציה' },
        { id: uid(), title: 'תיאום יועץ חשמל', projectId: p2, assignee: 'רונית', priority: 'medium', status: 'todo', due: addDays(7), notes: '' },
        { id: uid(), title: 'התקנת תקרה אקוסטית', projectId: p3, assignee: 'דני', priority: 'medium', status: 'doing', due: addDays(10), notes: '' },
        { id: uid(), title: 'רשימת תיקונים לפני מסירה', projectId: p3, assignee: 'יוסי', priority: 'low', status: 'todo', due: addDays(20), notes: '' },
        { id: uid(), title: 'הגשת חשבון סופי ללקוח', projectId: p4, assignee: 'מוטי', priority: 'high', status: 'done', due: addDays(-5), notes: '' },

    } else {
      area.innerHTML = `<div class="card table-wrap"><table>

        <tbody>${list.map((t) => {

        }).join('') || '<tr><td colspan="8" class="empty">לא נמצאו משימות</td></tr>'}</tbody></table></div>`;
      $$('tr[data-id]', area).forEach((tr) => {

  }
  function updateBadge() {

  function openTaskForm(task, defaults) {

      ${GOOGLE ? `<div class="field full"><label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--text)"><input type="checkbox" name="toCal" ${taskCalId(t) ? 'checked' : ''}> ${taskCalId(t) ? 'לעדכן את האירוע ביומן Google שלי' : 'להוסיף ליומן Google שלי (ביום היעד)'}</label></div>` : ''}`,
    (data) => {
      const toCal = data.toCal; delete data.toCal;
      if (rec && !db.tasks.includes(rec)) rec = byId(db.tasks, rec.id) || null;

      if (rec) Object.assign(rec, data); else db.tasks.push(saved);
      save(); render(); toast(task ? 'המשימה עודכנה' : 'המשימה נוספה');
      if (toCal) taskToCalendar(saved);
    },
    task ? () => { db.tasks = db.tasks.filter((x) => x !== task); save(); render(); toast('המשימה נמחקה'); } : null);
    // Saved while typing, so the other users see it at once (a new task once it has a title).
    // A task from the sheet is not: the next sync of the sheet replaces it anyway.
    let rec = task;
    if (!t.sheet) liveForm(() => {
      const data = modalData(); delete data.toCal;
      if (!data.title) return;
      if (rec && !db.tasks.includes(rec)) rec = byId(db.tasks, rec.id) || null;
      const isNew = !rec;
      if (rec) Object.assign(rec, data); else db.tasks.push(rec = Object.assign({ id: uid() }, data));
      save();
      if (isNew) {
        render();

  // ---------- Sync from the tasks sheet ("משימות פמי" in Drive) ----------
  // The sheet is the source of the tasks and contacts: every 10 minutes (and on demand) the site reads it,
  // replaces the tasks that came from it, and keeps the tasks that were added on the site itself.
  const TASK_SHEET = (window.FEMY_GOOGLE && window.FEMY_GOOGLE.tasksSheetId) || '';
  const XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  let sheetSyncing = false;
  function sheetStatusText() {
    const st = settings().sheetSync;
    if (sheetSyncing) return '🔄 מסנכרן מהגיליון "משימות פמי"...';
    if (!st) return SYNC || (GOOGLE && G.status().connected) ? 'המשימות יסונכרנו מהגיליון "משימות פמי"' : 'כדי לסנכרן מהגיליון "משימות פמי", חברו את חשבון ה-Google (בלשונית יומן, מייל ו-Drive)';
    const min = Math.round((Date.now() - st.at) / 60000);
    return `מסונכרן מהגיליון "משימות פמי": ${st.tasks} משימות, ${st.contacts} אנשי קשר · ${min < 1 ? 'עכשיו' : min < 60 ? `לפני ${min} דק׳` : new Date(st.at).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' })}`;
  }
  function showSheetStatus() { const e = $('#sheetStatus'); if (e) e.textContent = sheetStatusText(); }
  // With a Google account connected the site reads the sheet itself (always the latest); without one it
  // takes the copy the sync server keeps (at most 15 minutes old).
  async function syncTaskSheet(manual) {
    if (!TASK_SHEET || !window.FemySheet || sheetSyncing || !isAdmin()) return;
    const direct = GOOGLE && (G.silent() || (manual && !SYNC));
    if (!direct && !useSync(manual)) return;
    sheetSyncing = true; showSheetStatus();
    try {
      let buf, at = Date.now();
      if (direct) {
        if (manual) await G.token(); // may ask to connect, straight from the click
        buf = await G.drive.exportFile(TASK_SHEET, XLSX);
      } else {
        if (manual) await syncRefresh();
        const r = await syncFetch('/data/sheet');
        at = Number(r.headers.get('X-Synced-At')) || at;
        const st = settings().sheetSync;
        if (!manual && st && st.at >= at) return; // nothing new since the last sync
        buf = await r.arrayBuffer();
      }
      const JSZip = await loadJSZip();
      const res = FemySheet.parse(await FemySheet.readXlsx(buf, JSZip));
      if (!res.tasks.length) throw new Error('לא נמצאו משימות בגיליון');
      applySheet(res, at);
      if (manual) toast(`סונכרנו ${res.tasks.length} משימות ו-${res.contacts.length} אנשי קשר מהגיליון`);
    } catch (e) {
      if (manual) toast('הסנכרון מהגיליון נכשל: ' + gErr(e));
    } finally { sheetSyncing = false; showSheetStatus(); }
  }
  function applySheet(res, at) {
    const st = settings();
    const map = st.sheetMap = st.sheetMap || {}; // "לקוח|פרויקט בגיליון" -> project id on the site
    res.groups.forEach((g) => {
      const key = g.client + '|' + g.name;
      if (map[key] && byId(db.projects, map[key])) return;
      let p = FemySheet.matchProject(g.name, g.client, db.projects);
      if (!p) {
        p = { id: 'sh-p-' + FemySheet.hash(key), name: g.name, client: g.client, location: '', manager: '', status: 'active', progress: 0, start: '', end: '', budget: '', notes: 'נוצר מהגיליון "משימות פמי".' };
        if (!byId(db.projects, p.id)) db.projects.push(p);
      }
      map[key] = p.id;
    });
    const old = {}; db.tasks.forEach((t) => { if (t.sheet) old[t.id] = t; });
    const fromSheet = res.tasks.map((t) => ({
      id: t.id, sheet: true, sheetClient: t.client, sheetNum: t.num, title: t.title, notes: t.notes,
      projectId: t.group ? map[t.client + '|' + t.group] || '' : '', assignee: t.assignee, contactName: t.contactName, contactPhone: t.contactPhone, priority: t.priority, status: t.status, due: t.due,
      cal: old[t.id] && old[t.id].cal,
    }));
    // The tasks taken from the status reports (drv-t-) are replaced by the sheet, which is the real list.
    db.tasks = db.tasks.filter((t) => !t.sheet && !/^drv-t-/.test(t.id)).concat(fromSheet);
    db.contacts = res.contacts;
    st.sheetSync = { at: at || Date.now(), tasks: fromSheet.length, contacts: res.contacts.length };
    save();
    // Don't redraw under someone who is typing or has a form open.
    const a = document.activeElement;
    const busy = (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) || ($('#modalBg') && $('#modalBg').classList.contains('show'));
    if (!busy) render(); else { updateBadge(); showSheetStatus(); }
  }

  // ---------- Per-task links: call whoever handles it, open its mail thread ----------
  const normName = (x) => String(x || '').replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
  function contactFor(name) {
    const n = normName(name); if (!n) return null;
    const list = db.contacts || [];
    return list.find((c) => normName(c.name) === n) || list.find((c) => { const cn = normName(c.name); return cn && (cn.startsWith(n + ' ') || n.startsWith(cn + ' ')); }) || null;
  }
  // The person to call: the task's contact (from the sheet or the form), else a contact named like the assignee.
  const myName = () => normName((me && me.name) || (localSession && localSession.name) || '');
  function taskPerson(t) {
    // Not yourself: when you are the assignee, only the task's outside contact counts.
    const mine = (n) => { const a = normName(n), m = myName(); return !!(m && a && (a === m || a.startsWith(m + ' ') || a.includes(' ' + m) || a.startsWith(m + ' ו'))); };
    const c = contactFor(t.contactName) || (!mine(t.assignee) ? contactFor(t.assignee) : null);
    const name = t.contactName || (c && c.name) || '';
    const phone = t.contactPhone || (c && c.phone) || '';
    return { name, phone, email: (c && c.email) || '' };
  }
  const TITLE_STOP = ['עם', 'של', 'את', 'על', 'לפי', 'מול', 'בין', 'עבור', 'אל', 'או', 'גם', 'רק', 'כל', 'לא', 'יש', 'מוטי', 'מנדי'];
  function taskMailQuery(t, withPerson) {
    const words = String(t.title || '').replace(/\(.*?\)/g, ' ').replace(/[–\-–—,.:;'"׳״/!?]/g, ' ').split(/\s+/)
      .filter((w) => w.length > 1 && !TITLE_STOP.includes(w)).slice(0, 4);
    const who = taskPerson(t);
    const parts = [];
    if (withPerson && who.email) parts.push(`{from:${who.email} to:${who.email} cc:${who.email}}`);
    if (words.length) parts.push(words.join(' '));
    return parts.join(' ');
  }
  function taskLinks(t) {
    const who = taskPerson(t);
    const tel = who.phone.replace(/[^\d+]/g, '');
    return `${tel ? `<a class="tlink" href="tel:${esc(tel)}" title="התקשרות ל${esc(who.name || 'מטפל')}" onclick="event.stopPropagation()">📞 ${esc(who.name || who.phone)}</a>` : ''}`
      + `<a class="tlink" href="#" data-mail="${esc(t.id)}" title="פתיחת שרשור המייל בנושא">✉️ מייל</a>`;
  }
  // Opens the newest mail thread on the task: first by its contact and words from the title, then by the words
  // alone, then by the contact alone. Without a Google connection, opens a Gmail search.
  async function openTaskMail(t) {
    const win = window.open('about:blank', '_blank'); // opened now, so the browser doesn't block it
    const qs = [taskMailQuery(t, true), taskMailQuery(t, false)];
    const who = taskPerson(t); if (who.email) qs.push(`{from:${who.email} to:${who.email}}`);
    const queries = qs.filter((q, i) => q && qs.indexOf(q) === i);
    const go = (url) => { if (win) win.location.href = url; else window.open(url, '_blank'); };
    const fallback = 'https://mail.google.com/mail/u/0/#search/' + encodeURIComponent(queries[0] || t.title);
    if (!GOOGLE || !G.valid()) { go(fallback); return; }
    try {
      for (const q of queries) {
        const id = await G.gmail.findThread(q);
        if (id) { go(G.gmail.link({ threadId: id })); return; }
      }
      toast('לא נמצא מייל בנושא, נפתח חיפוש ב-Gmail');
      go(G.gmail.searchLink(queries[queries.length - 1] || t.title));
    } catch (e) { go(fallback); }
  }
  // Every Drive link in the site copies the folder's local path (Google Drive for desktop) instead of opening the browser.
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-lproj]'); if (!a) return;
    e.preventDefault(); e.stopPropagation();
    const p = byId(db.projects, a.dataset.lproj); if (p) copyProjectPath(p, a.dataset.lsub ? [a.dataset.lsub] : []);
  }, true);
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-mail]'); if (!a) return;
    e.preventDefault(); e.stopPropagation();
    const t = byId(db.tasks, a.dataset.mail); if (t) openTaskMail(t);
  }, true);

  // ---------- Contacts (from the tasks sheet) ----------
  function renderContacts(el) {
    const q = ui.contactQ.trim().toLowerCase();
    const list = (db.contacts || []).filter((c) => !q || [c.name, c.category, c.role, c.projects, c.phone, c.email].join(' ').toLowerCase().includes(q));
    const sections = [];
    list.forEach((c) => { const k = c.category || c.section || ''; let s = sections.find((x) => x.k === k); if (!s) sections.push(s = { k, sub: c.section !== k ? c.section : '', items: [] }); s.items.push(c); });
    const tel = (p) => p.replace(/[^\d+]/g, '');
    el.innerHTML = `
      <div class="toolbar"><input class="input search" id="cq" placeholder="חיפוש לפי שם, תחום, פרויקט או טלפון..." value="${esc(ui.contactQ)}">
        <span class="spacer"></span>${TASK_SHEET ? `<span class="hint" id="sheetStatus">${sheetStatusText()}</span> <button class="btn sm" id="sheetSyncBtn">🔄 סנכרון</button>` : ''}</div>
      ${sections.map((s) => `<div class="card tgroup"><div class="tg-head"><b>${esc(s.k || 'אנשי קשר')}</b><span class="hint">${s.sub ? esc(s.sub) + ' · ' : ''}${s.items.length}</span></div>
        ${s.items.map((c) => `<div class="tg-row contact">
          <div class="tg-title"><b>${esc(c.name)}</b>${c.role ? `<div class="hint">${esc(c.role)}</div>` : ''}</div>
          <span class="tg-meta">${c.projects ? `<span>🏗 ${esc(c.projects)}</span>` : ''}
            ${c.phone ? `<a href="tel:${esc(tel(c.phone))}" dir="ltr">📞 ${esc(c.phone)}</a>` : ''}${c.email ? `<a href="mailto:${esc(c.email)}" dir="ltr">✉️ ${esc(c.email)}</a>` : ''}</span>
        </div>`).join('')}</div>`).join('') || `<div class="card empty">${(db.contacts || []).length ? 'לא נמצאו אנשי קשר' : 'אנשי הקשר יופיעו כאן אחרי הסנכרון מהגיליון "משימות פמי"'}</div>`}`;
    const inp = $('#cq', el);
    inp.addEventListener('input', () => { ui.contactQ = inp.value; renderContacts(el); const n = $('#cq', el); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
    const sb = $('#sheetSyncBtn', el); if (sb) sb.addEventListener('click', () => syncTaskSheet(true));
  }

  // ---------- Projects ----------
  const STATUS_ORDER = ['active', 'planning', 'paused', 'done'];
  const statusRank = (p) => { const i = STATUS_ORDER.indexOf(p.status); return i < 0 ? 9 : i; };
  const driveUrl = (p) => (p && p.driveFolder ? 'https://drive.google.com/drive/folders/' + encodeURIComponent(p.driveFolder) : '');
  // Local path of a Drive folder on this computer (Google Drive for desktop), to paste in Windows Explorer (Ctrl+L).
  // Kept per computer in the browser, since the drive letter differs between computers.
  const LOCAL_DRIVE_KEY = 'femy-local-drive';
  const localDrive = () => {
    let c = {}; try { c = JSON.parse(localStorage.getItem(LOCAL_DRIVE_KEY) || '{}') || {}; } catch (e) { c = {}; }
    const name = (window.FemyGoogle && FemyGoogle.drive.projectsName) || 'פרויקטים פמי';
    // The projects folder is shared with the office, so Google Drive for desktop keeps it under
    // .shortcut-targets-by-id\<folder id>\ (not under My Drive). The old default is treated as unset.
    const id = window.FEMY_GOOGLE && window.FEMY_GOOGLE.projectsFolderId;
    const def = id ? '.shortcut-targets-by-id\\' + id + '\\' + name : 'My Drive\\' + name;
    const saved = typeof c.root === 'string' ? c.root.trim() : '';
    return { letter: /^[A-Z]$/.test(c.letter || '') ? c.letter : 'G', root: saved && saved !== 'My Drive\\' + name ? saved : def };
  };
  const setLocalDrive = (patch) => { try { localStorage.setItem(LOCAL_DRIVE_KEY, JSON.stringify(Object.assign(localDrive(), patch))); } catch (e) {} };
  const localPath = (parts) => { const c = localDrive(); return [c.letter + ':', c.root.replace(/^[\\/]+|[\\/]+$/g, '')].concat(parts || []).filter(Boolean).join('\\'); };
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); }

      "function say(t) { sh.Popup(t, 0, 'Femy', 48); }",
      "var a = WScript.Arguments.length ? String(WScript.Arguments(0)) : '';",
      "var p = a.replace(/^femy-open:(\\/\\/)?/i, '').replace(/\\/$/, '');",
      "try { p = decodeURIComponent(p); } catch (e) { p = ''; }",
      "p = p.replace(/\\//g, '\\\\');",
      "var BAD = /\\.(exe|com|bat|cmd|ps1|psm1|psd1|vbs|vbe|js|jse|wsf|wsh|wsc|msi|msp|mst|lnk|scr|hta|reg|cpl|jar|pif|url|scf|inf|dll|sys|ocx|application|appref-ms|msc|gadget|settingcontent-ms|library-ms|search-ms|diagcab|appx|appxbundle|msix|msixbundle|appinstaller|iso|img|vhd|vhdx|chm|theme|themepack|xll|xla|xlam|ppa|ppam|website|mht|mhtml|ws)$/i;",
      "if (!/^[A-Za-z]:\\\\[^:*?\"<>|]*$/.test(p) || /(^|\\\\)\\.\\.(\\\\|$)/.test(p) || BAD.test(p)) { say('הקישור הזה לא נפתח: מותר לפתוח רק קבצים ותיקיות מ-Google Drive במחשב.'); WScript.Quit(1); }",

  function exportInvoicesCsv() {
    const rows = [['מספר', 'סוג', 'לקוח/ספק', 'פרויקט', 'סכום לפני מעמ', 'סהכ', 'תאריך הפקה', 'לתשלום עד', 'סטטוס', 'הערות']];
    filteredInvoices().forEach((i) => {
      const p = byId(db.projects, i.projectId);
      rows.push([i.number, byId(INVOICE_TYPE, i.type).short, i.party, p ? p.name : '', i.amount, invTotal(i).toFixed(2), fmtDate(i.issueDate), fmtDate(i.dueDate), byId(INVOICE_STATUS, invoiceStatus(i)).label, i.notes || '']);
    });
    const csv = '﻿' + rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');

  // ---------- Consultant ledgers (חשבונות יועצים) ----------
  // Each project can hold project.ledger, read from the office's "חשבונות ..." Excel sheet:
  // { file, fileDate, title, rows: [{ group, field, name, service, total, payments: [{ amount, billed }], person, phone, email }], deposits }
  // Amounts include VAT. A payment with billed: true was submitted but not paid yet.
  // accounts/consultant-accounts.json holds the sheets already collected from Drive; importLedgers adds them once per version.
  const ledPayments = (r) => (r.payments || []).filter((x) => x && Number(x.amount));
  const ledPaid = (r) => ledPayments(r).filter((x) => !x.billed).reduce((s, x) => s + Number(x.amount), 0);
  const ledBilled = (r) => ledPayments(r).filter((x) => x.billed).reduce((s, x) => s + Number(x.amount), 0);
  function ledSum(rows) {
    const o = { total: 0, paid: 0, billed: 0 };
    rows.forEach((r) => { o.total += Number(r.total) || 0; o.paid += ledPaid(r); o.billed += ledBilled(r); });
    o.left = Math.max(0, o.total - o.paid);
    o.pct = o.total ? Math.min(100, Math.round((o.paid / o.total) * 100)) : 0;
    return o;
  }
  const ledProjects = () => db.projects.filter((p) => p.ledger && Array.isArray(p.ledger.rows));
  // Category names as the office reads them: consultants, additional costs, paid directly by the developer.
  const ledGroupLabel = (g) => (!g || /יועצ/.test(g) ? 'עלות יועצים' : /נוספ/.test(g) ? 'עלויות נוספות' : g);

  async function importLedgers(manual) {
    if (!isAdmin()) return;
    let data;
    try { data = await (await fetch('accounts/consultant-accounts.json', { cache: 'no-cache' })).json(); }
    catch (e) { if (manual) toast('טעינת חשבונות היועצים נכשלה'); return; }
    if (!data || !Array.isArray(data.ledgers)) return;
    if (!manual && settings().ledgerImport === data.version) return;
    const norm = (x) => (x || '').replace(/\s+/g, ' ').trim();
    let n = 0;
    data.ledgers.forEach((l) => {
      const p = byId(db.projects, l.projectId) || db.projects.find((x) => norm(x.name) === norm(l.projectName));
      if (!p) return;
      if (p.ledger && (p.ledger.edited || p.ledger.seed === data.version)) return;
      const led = Object.assign({}, l, { seed: data.version });
      delete led.projectId; delete led.projectName;
      p.ledger = led; n++;
    });
    settings().ledgerImport = data.version;
    save();
    if (n) { render(); toast(`נוספו חשבונות יועצים ל-${n} פרויקטים`); }
    else if (manual) toast('חשבונות היועצים כבר מעודכנים');
  }

        </td></tr>` : ''}`;

    // Collapsed: one summary line per project; the button opens the full table.

  function bindLedgerCards(box) {
    $$('.ledger', box).forEach((card) => {
      const p = byId(db.projects, card.dataset.pid);
      if (!p) return;
      $('[data-ltoggle]', card).addEventListener('click', () => { ui.ledOpen = ui.ledOpen || {}; ui.ledOpen[p.id] = !ui.ledOpen[p.id]; render(); });
      if (card.classList.contains('led-line')) {
        card.addEventListener('click', (e) => { if (!e.target.closest('a, button')) $('[data-ltoggle]', card).click(); });
        return;
      }
      $('[data-lreimport]', card).addEventListener('click', () => openLedgerImport(p.id));
      $('[data-ladd]', card).addEventListener('click', () => openLedgerRowForm(p, -1));
      $$('tr.lgroup', card).forEach((tr) => tr.addEventListener('click', () => {
        ui.ledGrpOpen = ui.ledGrpOpen || {}; ui.ledGrpOpen[tr.dataset.gk] = !ui.ledGrpOpen[tr.dataset.gk]; render();
      }));
      $$('tr.lmain', card).forEach((tr) => tr.addEventListener('click', (e) => {
        if (e.target.closest('a, button')) return;
        const key = p.id + '/' + tr.dataset.row; ui.ledRowOpen = ui.ledRowOpen || {}; ui.ledRowOpen[key] = !ui.ledRowOpen[key]; render();
      }));
      $$('tr.ldetail [data-ledit]', card).forEach((b) => b.addEventListener('click', () => openLedgerRowForm(p, Number(b.closest('tr').dataset.row))));
    });
  }

  function openLedgerRowForm(p, idx) {
    const L = p.ledger;
    const r = idx >= 0 ? L.rows[idx] : { group: (L.rows[0] && L.rows[0].group) || '', field: '', name: '', total: '', payments: [] };
    const pays = (r.payments || []).filter((x) => x && Number(x.amount));
    const slots = Math.max(4, pays.length + 2);
    const groups = Array.from(new Set(L.rows.map((x) => x.group || '')));
    openModal(idx >= 0 ? 'עריכת שורת יועץ' : 'יועץ / תשלום חדש', `
      <div class="field"><label>תחום</label><input class="input" name="field" value="${esc(r.field)}"></div>
      <div class="field"><label>יועץ / ספק</label><input class="input" name="name" value="${esc(r.name)}"></div>
      <div class="field"><label>סוג השירות</label><input class="input" name="service" value="${esc(r.service || '')}"></div>
      <div class="field"><label>קבוצה</label><input class="input" name="group" list="ledGroups" value="${esc(r.group || '')}" placeholder="${esc(ledGroupLabel(''))}"><datalist id="ledGroups">${groups.filter(Boolean).map((g) => `<option value="${esc(g)}">`).join('')}</datalist></div>
      <div class="field"><label>עלות תכנון כוללת, כולל מע״מ (₪)</label><input class="input" type="number" step="0.01" min="0" name="total" value="${r.total == null ? '' : esc(r.total)}"></div>
      <div class="field"><label>איש קשר</label><input class="input" name="person" value="${esc(r.person || '')}"></div>
      <div class="field"><label>טלפון</label><input class="input" name="phone" dir="ltr" value="${esc(r.phone || '')}"></div>
      <div class="field"><label>מייל</label><input class="input" name="email" dir="ltr" value="${esc(r.email || '')}"></div>
      <div class="field full"><label>חשבונות (סכום כולל מע״מ)</label>
        <div class="led-pays">${Array.from({ length: slots }, (_, k) => { const x = pays[k] || {}; return `<div><span class="hint">חשבון ${k + 1}</span><input class="input" type="number" step="0.01" min="0" name="pay${k}" value="${x.amount ? esc(x.amount) : ''}"><label class="hint"><input type="checkbox" name="billed${k}" ${x.billed ? 'checked' : ''}> הוגש, טרם שולם</label></div>`; }).join('')}</div></div>`,
    (data) => {
      const out = Object.assign({}, idx >= 0 ? r : {}, { group: data.group, field: data.field, name: data.name, total: data.total === '' ? null : Number(data.total), payments: [] });
      ['service', 'person', 'phone', 'email'].forEach((k) => { if (data[k]) out[k] = data[k]; else delete out[k]; });
      for (let k = 0; k < slots; k++) { const a = Number(data['pay' + k]); if (a) out.payments.push(data['billed' + k] ? { amount: a, billed: true } : { amount: a }); }
      if (idx >= 0) L.rows[idx] = out; else L.rows.push(out);
      L.edited = true; save(); render(); toast(idx >= 0 ? 'השורה עודכנה' : 'השורה נוספה');
    },
    idx >= 0 ? () => { L.rows.splice(idx, 1); L.edited = true; save(); render(); toast('השורה נמחקה'); } : null);
  }

  // Picks the project whose name shares the most words with the file name ("חשבונות שמידמן.xlsx" -> שמידמן 3).
  function guessLedgerProject(fileName) {
    const f = fileName.replace(/\.[^.]+$/, '').replace(/[_\-.]+/g, ' ');
    let best = null; let score = 0;
    db.projects.forEach((p) => {
      const n = (p.name || '').split(/[\s\-–,()]+/).filter((w) => w.length >= 3 && !/^(בית|ספר|בתי|מתחם|פרויקט)$/.test(w)).filter((w) => f.includes(w)).length;
      if (n > score) { score = n; best = p; }
    });
    return best;
  }

  function openLedgerImport(projectId) {
    const p0 = projectId ? byId(db.projects, projectId) : null;
    openModal('ייבוא חשבונות יועצים מאקסל', `
      <div class="field full"><label>קובץ אקסל (xlsx) *</label><input class="input" type="file" id="ledFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required></div>
      <div class="field full"><label>פרויקט *</label><select class="input" name="projectId" id="ledProj" required>${projectOptions(projectId || '', 'בחירת פרויקט')}</select></div>
      <div class="field full hint">הקובץ צריך להיות בתבנית החשבונות של המשרד: שורת כותרות עם "עלות תכנון" ו"חשבון 1", "חשבון 2"... ושורה לכל יועץ. חשבונות שצבועים בצבע "הוגש חשבון" יסומנו כממתינים לתשלום.${p0 && p0.ledger ? ' <strong>החשבונות הקיימים של הפרויקט יוחלפו בנתונים מהקובץ.</strong>' : ''}</div>
      <div class="field full" id="ledPreview"></div>`,
    (data) => { if (pendingLedger && data.projectId) applyLedgerImport(data.projectId, pendingLedger); else toast('הקובץ לא נקרא, החשבונות לא עודכנו'); });
    let pendingLedger = null;
    const fileInp = $('#ledFile');
    fileInp.addEventListener('change', async () => {
      const f = fileInp.files[0]; const pv = $('#ledPreview');
      pendingLedger = null; if (!f) { pv.innerHTML = ''; return; }
      pv.innerHTML = '<span class="hint">קורא את הקובץ...</span>';
      try {
        const JSZip = await loadJSZip();
        const led = await window.FemyLedger.ledgerFromXlsx(await f.arrayBuffer(), JSZip);
        led.file = f.name; led.fileDate = f.lastModified ? toISO(new Date(f.lastModified)) : todayStr();
        pendingLedger = led;
        const s = ledSum(led.rows);
        pv.innerHTML = `<div class="led-preview">נמצאו <strong>${led.rows.length}</strong> שורות · עלות כוללת ${fmtMoney(s.total)} · שולם ${fmtMoney(s.paid)}${s.billed ? ' · הוגש וממתין ' + fmtMoney(s.billed) : ''}${led.deposits.length ? ' · ' + led.deposits.length + ' הפקדות יזם' : ''}</div>`;
        const sel = $('#ledProj');
        if (!sel.value) { const g = guessLedgerProject(f.name); if (g) sel.value = g.id; }
      } catch (e) {
        pv.innerHTML = `<div class="led-preview err">לא הצלחתי לקרוא את הקובץ: ${esc(e.message || e)}</div>`;
      }
    });
  }
  function applyLedgerImport(projectId, led) {
    const p = byId(db.projects, projectId);
    if (!p) return;
    p.ledger = Object.assign({}, led, { importedAt: new Date().toISOString() });
    ui.accTab = 'ledgers'; ui.ledClient = '';
    save(); render(); toast(`נטענו ${led.rows.length} שורות חשבונות לפרויקט ${p.name}`);
  }

  function exportLedgersCsv(list) {
    const rows = [['לקוח', 'פרויקט', 'קבוצה', 'תחום', 'יועץ / ספק', 'עלות כולל מעמ', 'חשבון 1', 'חשבון 2', 'חשבון 3', 'חשבון 4', 'חשבון 5', 'שולם', 'הוגש וממתין', 'יתרה', 'אחוז ששולם']];
    list.forEach((p) => p.ledger.rows.forEach((r) => {
      const pays = (r.payments || []).map((x) => (x && Number(x.amount) ? x.amount + (x.billed ? ' (הוגש)' : '') : ''));
      const total = Number(r.total) || 0; const paid = ledPaid(r);
      rows.push([p.client || '', p.name, ledGroupLabel(r.group), r.field || r.service || '', r.name || '', r.total == null ? '' : total, pays[0] || '', pays[1] || '', pays[2] || '', pays[3] || '', pays[4] || '', paid, ledBilled(r), total ? Math.max(0, total - paid) : '', total ? Math.round((paid / total) * 100) + '%' : '']);
    }));
    const csv = '﻿' + rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    download('חשבונות-יועצים-' + todayStr() + '.csv', csv, 'text/csv;charset=utf-8');
  }

  // ---------- Protocols ----------

      rows: [

        ['הפרויקט', '- \n- עבודות הבינוי והמערכות הוצגו ע"י נציג המזמין ומנהל הפרויקט.\n- הובהר כי כל הנאמר והכתוב הינו בנוסף ובכפוף למסמכי המכרז.'],
        ['אופי המכרז', '- המכרז הינו פאושלי לכלל העבודות והפרטים המופיעים בתכניות, ברשימות, במפרטים, בכתב הכמויות ובפרוטוקול זה.\n- כתבי הכמויות נמסרו לצורך עזרה בלבד. האחריות לבדיקת הכמויות ולהתאמתן לתכניות ולמפרטים חלה על הקבלן בלבד, ולא תשולם תוספת בגין כמויות נוספות הנדרשות להשלמת העבודה.\n- במקרה של סתירה בין התכניות, כתב הכמויות או המפרטים, מנהל הפרויקט ינחה את הקבלן לגבי אופן הביצוע. הנחיות אלו כלולות במחיר הפאושלי.'],

    },
  };
  const PROTO_TPL_KEYS = Object.keys(PROTO_TPL);
  const TOUR_PARTICIPANTS = 'נציגי המזמין: \nניהול פרויקט: \nהקבלנים שנכחו בסיור: ';
  const protoTpl = (pr) => PROTO_TPL[pr && pr.template] || null;

  // "הנדון" at the top of the document: typed by hand (pr.subject), else made from the project, the name and the number.

  }
  const protoFileName = (pr, ext) => {
    const t = protoTpl(pr);
    const parts = t ? [protoProjName(pr), t.short + (protoNo(pr) ? ' ' + protoNo(pr) : ''), pr.template === 'supervision' ? '' : pr.title]
      : ['פרוטוקול', pr.title];
    return (parts.filter(Boolean).join(' - ') + ' - ' + fmtDate(pr.date).replace(/\//g, '.')).replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim() + '.' + ext;
  };
  const protoSearchText = (p) => [p.title, p.participants, p.summary, p.decisions, p.actions, p.location, p.doneWork, p.nextWork, p.notDone,
    protoProjName(p), (protoTpl(p) || {}).label, ...(p.items || []).map((i) => [i.topic, i.details, i.instructions, i.due, i.owner].join(' '))].join(' ').toLowerCase();

  // ---------- Photos in protocol topics ----------
  // A protocol keeps only the ids of its photos ("ph...-WxH", in the topic's "photos"). The photos themselves are
  // kept in this browser (IndexedDB) and, in cloud mode, also in the shared database, one document per photo.
  const photoCache = new Map();
  let photoDbP = null;
  const photoDb = () => photoDbP || (photoDbP = new Promise((res, rej) => {
    const r = indexedDB.open('femy-photos', 1);

  async function photoPut(id, data) {
    photoCache.set(id, data);

  }
  async function photoGet(id) {

    }
    if (v) photoCache.set(id, v);

  }
  const photoIds = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean);
  const protoPhotoIds = (pr) => [].concat(...((pr && pr.items) || []).map((i) => photoIds(i.photos)));
  const ensurePhotos = (pr) => Promise.all(protoPhotoIds(pr).map((id) => photoGet(id).catch(() => '')));
  const photoSize = (id) => { const m = /-(\d+)x(\d+)$/.exec(id); return m ? [+m[1], +m[2]] : [4, 3]; };
  // A photo from the camera or the gallery, made smaller (up to 1400 px, JPEG) so a report with many photos stays light.
  async function makePhoto(file) {
    const url = URL.createObjectURL(file);

      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      let data = c.toDataURL('image/jpeg', 0.72);
