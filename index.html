  // ---------- Photos in protocol topics ----------
  // A protocol keeps only the ids of its photos ("ph...-WxH", in the topic's "photos"). The photos themselves are
  // kept in this browser (IndexedDB) and, in cloud mode, also in the shared database, one document per photo.
  const photoCache = new Map();
  let photoDbP = null;
  const photoDb = () => photoDbP || (photoDbP = new Promise((res, rej) => {
    const r = indexedDB.open('femy-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => res(r.result); r.onerror = () => { photoDbP = null; rej(r.error); };
  }));
  const idbDo = (mode, fn) => photoDb().then((d) => new Promise((res, rej) => {
    const tx = d.transaction('p', mode); const r = fn(tx.objectStore('p'));
    tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
  }));
  async function photoPut(id, data) {
    photoCache.set(id, data);
    await idbDo('readwrite', (st) => st.put(data, id)).catch(() => {});
    if (CLOUD && cloud && cloud.putPhoto) await cloud.putPhoto(id, data);
  }
  async function photoGet(id) {
    if (photoCache.has(id)) return photoCache.get(id);
    let v = await idbDo('readonly', (st) => st.get(id)).catch(() => null);
    if (!v && CLOUD && cloud && cloud.getPhoto) {
      v = await cloud.getPhoto(id).catch(() => null);
      if (v) idbDo('readwrite', (st) => st.put(v, id)).catch(() => {});
    }
    if (v) photoCache.set(id, v);
    return v || '';
  }
  const photoIds = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean);
  const protoPhotoIds = (pr) => [].concat(...((pr && pr.items) || []).map((i) => photoIds(i.photos)));
  const ensurePhotos = (pr) => Promise.all(protoPhotoIds(pr).map((id) => photoGet(id).catch(() => '')));
  const photoSize = (id) => { const m = /-(\d+)x(\d+)$/.exec(id); return m ? [+m[1], +m[2]] : [4, 3]; };
  // A photo from the camera or the gallery, made smaller (up to 1400 px, JPEG) so a report with many photos stays light.
  async function makePhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      let data = c.toDataURL('image/jpeg', 0.72);
      if (data.length > 900000) data = c.toDataURL('image/jpeg', 0.5);
      const id = 'ph' + uid() + '-' + w + 'x' + h;
      await photoPut(id, data);
      return id;
    } finally { URL.revokeObjectURL(url); }
  }
  // Photos drawn before they were loaded get their picture when it arrives.
  function fillPhotos(root) {
    $$('img[data-photo]', root).forEach((im) => { if (!im.getAttribute('src')) photoGet(im.dataset.photo).then((v) => { if (v) im.src = v; }); });
  }
  const photoImg = (id, cls) => { const v = photoCache.get(id); return `<img class="${cls}" data-photo="${esc(id)}" ${v ? `src="${v}"` : ''} alt="">`; };
  // photoPos "left": the photos beside the text, at its left (the text keeps the right side). Otherwise under it.
  const photoLines = (it) => photoIds(it.photos).map((id) => ({ img: id, t: '(תמונה)', side: it.photoPos === 'left' }));

  // The document model every output (card, PDF, Word, email) is drawn from.
  // A cell is a list of lines: [{ t: text, b: bold }].
  const cellOf = (s, bold, flags) => (s || '').split('\n').map((x) => x.replace(/\s+$/, '')).filter((x, i, a) => x || (i && i < a.length - 1)).map((t) => Object.assign({ t, b: !!bold }, flags));
  function protoDoc(pr) {
    const t = protoTpl(pr);
    const proj = byId(db.projects, pr.projectId);
    const blocks = [];
    if (!t) {
      const meta = [['תאריך', fmtDate(pr.date)], ['סוג', pr.type], ['פרויקט', proj && proj.name], ['משתתפים', pr.participants]].filter((x) => x[1]);
      blocks.push({ kind: 'kv', rows: meta.map((m) => [m[0], cellOf(m[1])]) });
      if (pr.summary) blocks.push({ kind: 'section', title: 'סיכום הדיון', paras: protoLines(pr.summary) });
      if (protoLines(pr.decisions).length) blocks.push({ kind: 'section', title: 'החלטות', list: protoLines(pr.decisions) });
      if (protoLines(pr.actions).length) blocks.push({ kind: 'section', title: 'משימות להמשך', list: protoLines(pr.actions) });
      return { tpl: 'legacy', heading: protoHeading(pr), blocks };
    }
    const subject = [proj && proj.name, pr.template === 'supervision' ? 'דוח פיקוח' + (pr.reportNo ? ' - ' + pr.reportNo : '')
      : pr.template === 'meeting' && protoNo(pr) ? (pr.title ? pr.title + ' - ' : '') + 'סיכום מס\' ' + protoNo(pr) : pr.title].filter(Boolean).join('\n');
    const date = fmtDate(pr.date).replace(/\/\d{2}(\d{2})$/, '/$1'); // 15/11/26, as on the documents sent so far
    let meta;
    if (pr.template === 'tour') meta = [['שם הפרויקט', [proj && proj.name, pr.title].filter(Boolean).join(' - ')], ['תאריך', date], ['מיקום', pr.location], ['משתתפים', pr.participants], ['העתקים', pr.copies]];
    else if (pr.template === 'supervision') meta = [['תאריך', date], ['הנדון', subject], ['סטטוס פרויקט', pr.status], ['מיקום', pr.location], ['משתתפים', pr.participants], ['העתקי הדוח', pr.copies]];
    else meta = [['תאריך', date], ['הנדון', subject], ['מיקום', pr.location], ['משתתפים', pr.participants], ['העתקים', pr.copies]];
    // The header table, as on the documents sent so far: the date row grey, the subject row light blue.
    blocks.push({ kind: 'kv', head: true, rows: meta.filter((m) => m[1]).map((m) => [m[0],
      cellOf(m[1], m[0] === 'הנדון' || m[0] === 'שם הפרויקט', m[0] === 'שם הפרויקט' ? { u: true } : null),
      m[0] === 'תאריך' ? 'date' : m[0] === 'הנדון' ? 'subj' : '']) });
    const items = (pr.items || []).filter((i) => t.cols.some((c) => (i[c[0]] || '').trim()) || photoIds(i.photos).length);
    if (pr.template === 'tour') {
      if (items.length) blocks.push({ kind: 'table', title: 'סיכום החלטות, הבהרות והנחיות', cols: [['מס"ד', 800, 'num'], ['תיאור', 7500, 'details']],
        rows: items.map((it, n) => [cellOf(String(n + 1) + '.'), [...(it.topic ? [{ t: it.topic + ':', u: true }] : []), ...cellOf(it.details), ...photoLines(it)]]) });
    } else {
      // Supervision: "סטטוס כללי" is the first row of the table, the works not done in red.
      let status = null;
      if (pr.template === 'supervision') {
        const st = [['עבודות שבוצעו:', pr.doneWork], ['הספקים לשבוע הקרוב:', pr.nextWork], ['עבודות בהספק השבועי האחרון שלא בוצעו:', pr.notDone, true]].filter((x) => (x[1] || '').trim());
        if (st.length) status = [].concat(...st.map((x) => [{ t: x[0], b: true, r: !!x[2] }].concat(cellOf(x[1], false, x[2] ? { r: true } : null))));
      }
      // A topic with nothing else filled in is a section row across the table (a building, a street).
      const isSection = (it) => !t.cols.some((c) => c[0] !== 'topic' && (it[c[0]] || '').trim()) && !photoIds(it.photos).length;
      if (items.length || status) {
        const cols = (t.numbered ? [['', 500, 'num']] : []).concat(t.cols
          .filter((c) => c[0] !== 'due' || items.some((it) => (it.due || '').trim()))
          .map((c) => [c[1], c[2], c[0]]));
        const rows = [];
        if (status) rows.push(cols.map((c) => (c[2] === 'topic' ? cellOf('סטטוס כללי') : c[2] === 'details' ? status : [])));
        let n = 0;
        items.forEach((it) => {
          if (isSection(it)) { rows.push({ section: it.topic }); return; }
          n++;
          rows.push(cols.map((c) => (c[2] === 'num' ? cellOf(n + '.')
            : cellOf(it[c[2]], (c[2] === 'topic' && pr.template === 'meeting') || c[2] === 'instructions', c[2] === 'instructions' ? { r: true } : null)
              .concat(c[2] === 'details' ? photoLines(it) : []))));
        });
        blocks.push({ kind: 'table', cols, rows });
      }
    }
    if (pr.notes) blocks.push({ kind: 'section', title: 'הערות', paras: protoLines(pr.notes) });
    if (t.footer) blocks.push({ kind: 'note', text: t.footer });
    return { tpl: pr.template, heading: protoHeading(pr), blocks };
  }

  // The look of the documents the office has sent so far (Google Docs / Word on the letterhead):
  // black borders, a coloured header row, grey section rows with dark blue text, instructions in red.
  // Shared by the card on the site, the live preview and the print / PDF view, so all three look the same.
  const PROTO_DOC_CSS = `
    .fdoc { font-family: Arial, "Assistant", sans-serif; color: #000; font-size: 11pt; line-height: 1.4; text-align: right; direction: rtl; }
    .fdoc table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 0 0 14px; }
    .fdoc th, .fdoc td { border: 1px solid #000; color: #000; padding: 3px 6px; vertical-align: top; text-align: right; font-weight: normal; word-wrap: break-word; overflow-wrap: anywhere; }
    .fdoc tr { break-inside: avoid; }
    .fdoc thead { display: table-row-group; }
    .fdoc .pd-h1 { font-size: 1.5em; font-weight: bold; text-align: center; margin: 0 0 12px; }
    .fdoc.t-tour .pd-h1 { font-weight: normal; color: #4472c4; text-decoration: underline; margin-bottom: 18px; }
    .fdoc .pd-head { width: 64%; }
    .fdoc .pd-head th { width: 27%; background: #e7e6e6; }
    .fdoc .pd-head td { text-align: center; }
    .fdoc.t-meeting .pd-head th::after { content: " :"; }
    .fdoc .pd-head tr.r-date td { background: #e7e6e6; }
    .fdoc .pd-head tr.r-subj th, .fdoc .pd-head tr.r-subj td { background: #bdd7ee; }
    .fdoc .pd-head tr.r-subj td { font-size: 1.12em; padding: 5px 6px 9px; }
    .fdoc.t-tour .pd-head { width: 86%; margin: 0 auto 26px; }
    .fdoc.t-tour .pd-head th { width: 22%; background: #d9d9d9; }
    .fdoc.t-tour .pd-head td { text-align: right; }
    .fdoc .pd-kv th { width: 24%; background: #e7e6e6; }
    .fdoc .pd-main thead th { background: #6666ef; color: #fff; font-weight: bold; text-align: center; vertical-align: middle; }
    .fdoc.t-supervision .pd-main thead th { background: #3c78d8; }
    .fdoc.t-tour .pd-main thead th, .fdoc.t-legacy .pd-main thead th { background: #d9d9d9; color: #000; font-weight: normal; }
    .fdoc.t-tour .pd-main tr.pd-cap th { background: #bfbfbf; }
    .fdoc .pd-main td.c-topic, .fdoc .pd-main td.c-owner, .fdoc .pd-main td.c-due { text-align: center; vertical-align: middle; }
    .fdoc .pd-main td.c-num { text-align: center; vertical-align: middle; }
    .fdoc.t-supervision .pd-main td.c-num { background: #ccc; }
    .fdoc.t-tour .pd-main td.c-num { vertical-align: top; padding-top: 8px; }
    .fdoc.t-tour .pd-main td.c-details { padding: 8px 10px; }
    .fdoc .pd-main td.c-instructions { font-size: .88em; }
    .fdoc .pd-main tr.pd-sec td { background: #d9d9d9; color: #1f4e79; font-size: 1.55em; text-align: center; padding: 1px 6px 3px; }
    .fdoc .red { color: #ff0000; }
    .fdoc img.pd-img { display: block; max-width: 100%; max-height: 240px; margin: 4px auto; object-fit: contain; }
    .fdoc .pd-split { display: flex; gap: 8px; align-items: flex-start; }
    .fdoc .pd-split-t { flex: 1 1 0; min-width: 0; }
    .fdoc .pd-split-i { flex: 0 0 42%; }
    .fdoc .pd-split-i img.pd-img { max-height: 200px; margin: 0 0 4px; }
    .fdoc .pd-title { font-weight: bold; margin: 14px 0 6px; break-after: avoid; }
    .fdoc .pd-note { text-align: center; font-weight: bold; margin-top: 14px; }
    .fdoc p { margin: 0 0 6px; white-space: pre-wrap; } .fdoc ol { margin: 0; padding-inline-start: 22px; } .fdoc li { margin-bottom: 3px; }`;
  document.head.insertAdjacentHTML('beforeend', '<style>' + PROTO_DOC_CSS + '</style>');

  // HTML for the card and for the PDF print view.
  const cellHtml = (cell) => {
    const side = cell.filter((l) => l.img && l.side);
    if (side.length) return `<div class="pd-split"><div class="pd-split-t">${cellHtml(cell.filter((l) => !(l.img && l.side)))}</div><div class="pd-split-i">${side.map((l) => photoImg(l.img, 'pd-img')).join('')}</div></div>`;
    return cellLinesHtml(cell);
  };
  const cellLinesHtml = (cell) => cell.map((l) => {
    if (l.img) return photoImg(l.img, 'pd-img');
    let h = esc(l.t);
    if (l.u) h = `<u>${h}</u>`;
    if (l.b) h = `<b>${h}</b>`;
    return l.r ? `<span class="red">${h}</span>` : h;
  }).join('<br>');
  function protoDocHtml(doc) {
    const head = doc.tpl === 'tour' || doc.tpl === 'legacy' ? `<h1 class="pd-h1">${esc(doc.heading)}</h1>` : '';
    return `<div class="fdoc t-${doc.tpl}">${head}${doc.blocks.map((bl) => {
      const title = bl.title && bl.kind !== 'table' ? `<div class="pd-title">${esc(bl.title)}</div>` : '';
      if (bl.kind === 'kv') return `${title}<table class="${bl.head ? 'pd-head' : 'pd-kv'}">${bl.rows.map((r) => `<tr${r[2] ? ` class="r-${r[2]}"` : ''}><th>${esc(r[0])}</th><td>${cellHtml(r[1])}</td></tr>`).join('')}</table>`;
      if (bl.kind === 'table') {
        const sum = bl.cols.reduce((a, c) => a + c[1], 0); const span = bl.cols.length;
        return `<table class="pd-main"><colgroup>${bl.cols.map((c) => `<col style="width:${(c[1] * 100 / sum).toFixed(1)}%">`).join('')}</colgroup>
          <thead>${bl.title ? `<tr class="pd-cap"><th colspan="${span}">${esc(bl.title)}</th></tr>` : ''}<tr>${bl.cols.map((c) => `<th>${esc(c[0])}</th>`).join('')}</tr></thead>
          <tbody>${bl.rows.map((r) => (r.section ? `<tr class="pd-sec"><td colspan="${span}">${esc(r.section)}</td></tr>`
            : `<tr>${r.map((c, i) => `<td class="c-${bl.cols[i][2]}">${cellHtml(c)}</td>`).join('')}</tr>`)).join('')}</tbody></table>`;
      }
      if (bl.kind === 'note') return `<p class="pd-note">${esc(bl.text)}</p>`;
      return `${title}${bl.list ? `<ol>${bl.list.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>` : bl.paras.map((x) => `<p>${esc(x)}</p>`).join('')}`;
    }).join('')}</div>`;
  }

  // Plain text, for email and the calendar.
  function protocolText(pr) {
    const doc = protoDoc(pr);
    const flat = (cell) => cell.map((l) => l.t).join('\n');
    let t = doc.heading + '\n';
    doc.blocks.forEach((bl) => {
      if (bl.kind === 'kv') t += (bl.title ? '\n' + bl.title + '\n' : '') + bl.rows.map((r) => r[0] + ': ' + flat(r[1]).replace(/\n/g, ', ')).join('\n') + '\n';
      else if (bl.kind === 'table') {
        t += '\n' + (bl.title ? bl.title + '\n' : '');
        bl.rows.forEach((r) => {
          if (r.section) { t += '\n' + r.section + '\n'; return; }
          const parts = r.map((c, i) => [bl.cols[i][0], flat(c)]).filter((x) => x[1] && x[0] !== '' && x[0] !== 'מס"ד');
          const num = bl.cols[0][0] === '' || bl.cols[0][0] === 'מס"ד' ? flat(r[0]) + ' ' : '';
          t += num + parts.map((x, i) => (i ? x[0] + ': ' : '') + x[1]).join('\n   ') + '\n';
        });
      } else if (bl.kind === 'note') t += '\n' + bl.text + '\n';
      else t += '\n' + bl.title + '\n' + (bl.list ? bl.list.map((x, i) => (i + 1) + '. ' + x).join('\n') : bl.paras.join('\n')) + '\n';
    });
    return t + '\n--\nפמי הנדסה בע"מ | ייעוץ | ניהול פרויקטים\noffice@femy.co.il | ב.ס.ר 1 רמת גן\n';
  }

  // One protocol as an expandable card, with its actions. Used on the protocols page and on a project page.
  const protoTaskRows = (pr) => protoTpl(pr) ? (pr.items || []).filter((i) => (i.owner || '').trim() && (i.details || i.instructions || '').trim()) : [];
  function protoCardHtml(pr, opts) {
    const o = opts || {};
    const p = byId(db.projects, pr.projectId);
    const t = protoTpl(pr);
    const d = new Date((pr.date || todayStr()) + 'T00:00:00');
    const canTasks = t ? protoTaskRows(pr).length : protoLines(pr.actions).length;
    const sub = [t ? t.label + (protoNo(pr) ? ' ' + protoNo(pr) : '') : pr.type, p && !o.hideProject ? p.name : '', (pr.participants || '').split('\n')[0]].filter(Boolean);
    return `<div class="card proto ${ui.openProto === pr.id ? 'open' : ''}" data-id="${pr.id}">
      <div class="proto-head">
        <div class="proto-date">${d.getDate()}<small>${d.toLocaleDateString('he-IL', { month: 'short', year: '2-digit' })}</small></div>
        <div style="flex:1;min-width:0"><div class="proto-title">${t ? `<span class="tpl-tag tpl-${pr.template}">${esc(t.short)}</span>` : ''}${esc(pr.title || protoHeading(pr))}${pr.draft && !protoSent(pr) ? `<span class="tpl-tag tpl-draft" style="margin-inline-start:7px">✏️ בעריכה${pr.editing && pr.editing.by && Date.now() - pr.editing.at < 180000 ? ': ' + esc(pr.editing.by) + ' עכשיו' : ''}</span>` : ''}</div>
          <div class="proto-sub">${sub.map(esc).join(' · ')}</div></div>
        <span class="chev">◀</span>
      </div>
      <div class="proto-body">
        <div class="proto-doc">${protoDocHtml(protoDoc(pr))}</div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
          <button class="btn sm" data-edit>עריכה</button>
          ${pr.draft && !protoSent(pr) ? '<button class="btn sm" data-finish title="בלי שליחה במייל. אחרי זה אפשרויות ההעתקה מהדוח הקודם לא יוצעו יותר">✓ סיום עריכה</button>' : ''}
          ${t ? '<button class="btn sm" data-dup>➕ פרוטוקול המשך</button>' : ''}
          ${p && !o.hideProject ? `<a class="btn sm" href="${projectHref(p)}">🏗️ לדף הפרויקט</a>` : ''}
          ${canTasks ? '<button class="btn sm" data-mktasks>יצירת משימות מהפרוטוקול</button>' : ''}
          <button class="btn sm" data-mail>✉️ שליחה במייל</button>
          <button class="btn sm" data-word>📄 ייצוא ל-Word</button>
          <button class="btn sm" data-pdf>📑 ייצוא ל-PDF</button>
          ${GOOGLE ? '<button class="btn sm" data-drive>☁️ שמירה ב-Google Drive</button>' : ''}
          ${pr.gdocLink ? `<a class="btn sm" href="${esc(pr.gdocLink)}" target="_blank" rel="noopener" title="העותק ב-Google Docs, מתעדכן עם כל שמירה">📝 Google Docs</a>` : ''}
          ${GOOGLE ? '<button class="btn sm" data-cal>📅 הוספה ליומן</button>' : ''}
          ${GOOGLE && pr.driveLink ? `<a class="btn sm" href="#" data-lapp="${esc(protoFileName(pr, 'docx'))}" title="מעתיק את נתיב הקובץ במחשב, להדבקה בסייר הקבצים עם Ctrl+L">📋 העתק נתיב</a>` : ''}
        </div>
      </div></div>`;
  }
  // "25.11.26", "25/11/2026" -> "2026-11-25"
  function parseHeDate(s) {
    const m = String(s || '').match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
    if (!m) return '';
    const y = m[3].length === 2 ? '20' + m[3] : m[3];
    return y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  }
  function bindProtoCards(root) {
    if (!root) return;
    fillPhotos(root);
    $$('.proto', root).forEach((c) => {
      const pr = byId(db.protocols, c.dataset.id);
      $('.proto-head', c).addEventListener('click', () => { ui.openProto = ui.openProto === pr.id ? null : pr.id; c.classList.toggle('open'); });
      $('[data-edit]', c).addEventListener('click', () => openProtocolForm(pr));
      const fin = $('[data-finish]', c);
      if (fin) fin.addEventListener('click', () => { protoMarkSent(pr, true); save(); render(); toast('העריכה הסתיימה'); });
      const dup = $('[data-dup]', c);
      if (dup) dup.addEventListener('click', () => openProtocolForm(null, protoFollowUp(pr)));
      $('[data-word]', c).addEventListener('click', () => exportProtocolWord(pr));
      $('[data-pdf]', c).addEventListener('click', () => exportProtocolPdf(pr));
      $('[data-mail]', c).addEventListener('click', () => emailProtocol(pr));
      const dv = $('[data-drive]', c);
      if (dv) dv.addEventListener('click', () => saveProtocolToDrive(pr));
      const cl = $('[data-cal]', c);
      if (cl) cl.addEventListener('click', () => openEventForm({ title: pr.title || protoHeading(pr), date: pr.date, description: protocolText(pr) }));
      const mk = $('[data-mktasks]', c);
      if (mk) mk.addEventListener('click', () => {
        const note = 'נוצר מפרוטוקול: ' + (pr.title || protoHeading(pr)) + ' (' + fmtDate(pr.date) + ')';
        let tasks;
        if (protoTpl(pr)) {
          tasks = protoTaskRows(pr).map((it) => {
            const what = protoLines(it.instructions || it.details)[0].replace(/^[-•*]\s*/, '');
            return { title: ((it.topic ? it.topic + ': ' : '') + what).slice(0, 140), assignee: it.owner.trim(), due: parseHeDate(it.due) || addDays(7) };
          });
        } else {
          tasks = protoLines(pr.actions).map((line) => { const m = line.match(/^([^:]{1,25}):\s*(.+)$/); return { title: m ? m[2] : line, assignee: m ? m[1].trim() : '', due: addDays(7) }; });
        }

  // ---------- Google: calendar, Gmail, Drive ----------
  const userKey = () => (me && me.email) || (localSession && localSession.username) || '';
  const taskCalId = (t) => (t && t.cal && t.cal[userKey()]) || '';
  function taskToCalendar(t) {
    if (!t.due) { toast('כדי להוסיף ליומן צריך תאריך יעד'); return; }
    const p = byId(db.projects, t.projectId);
    G.calendar.create({ title: '✅ ' + t.title, date: t.due, description: [p ? 'פרויקט: ' + p.name : '', t.assignee ? 'אחראי: ' + t.assignee : '', t.notes || ''].filter(Boolean).join('\n') }, taskCalId(t))
      .then((ev) => { t.cal = Object.assign({}, t.cal, { [userKey()]: ev.id }); save(); toast('המשימה נוספה ליומן'); })
      .catch((e) => toast('ההוספה ליומן נכשלה: ' + gErr(e)));
  }
  const timeOf = (d) => d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  function eventsHtml(evs) {
    let day = '';
    return evs.map((e) => {
      const allDay = !!e.start.date;
      const st = new Date(allDay ? e.start.date + 'T00:00:00' : e.start.dateTime);
      const k = toISO(st);
      const head = k !== day ? `<div class="g-day">${k === todayStr() ? 'היום' : k === addDays(1) ? 'מחר' : st.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' })}</div>` : '';
      day = k;
      return head + `<div class="g-ev"><div class="time">${allDay ? 'כל היום' : timeOf(st) + (e.end && e.end.dateTime ? '–' + timeOf(new Date(e.end.dateTime)) : '')}</div>
        <div class="grow"><a href="${esc(e.htmlLink || '#')}" target="_blank" rel="noopener"><b>${esc(e.summary || '(ללא כותרת)')}</b></a>
        ${e.location ? `<div class="hint">📍 ${esc(e.location)}</div>` : ''}</div></div>`;
    }).join('');
  }

  function bindLocalDriveSettings(el) {
    const b = $('#ldSave', el);
    if (b) b.addEventListener('click', () => { setLocalDrive({ letter: $('#ldLetter', el).value, root: $('#ldRoot', el).value.trim() }); toast('נשמר: \u2066' + localPath([]) + '\u2069'); render(); });
  }
  function renderSettings(el) {
    const st = settings();
    const ld = localDrive();
    el.innerHTML = cloudSettingsHtml() + googleSettingsHtml() + (GOOGLE ? `
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>נתיב Google Drive במחשב הזה</h2>
        <p>כפתורי "📋 העתק נתיב" מעתיקים את נתיב התיקייה ב-Google Drive למחשב, כדי להדביק בסייר הקבצים (Ctrl+L). ההגדרה נשמרת רק בדפדפן הזה, כי אות הכונן יכולה להיות שונה בכל מחשב.</p>
        <div class="row"><label>אות כונן <select class="input" id="ldLetter" style="width:auto">${'CDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((l) => `<option ${l === ld.letter ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <input class="input" id="ldRoot" dir="ltr" style="flex:1;min-width:220px" value="${esc(ld.root)}" title="התיקייה של פרויקטים פמי, יחסית לכונן">
        <button class="btn primary" id="ldSave">שמירה</button></div>
        <div class="hint" dir="ltr" style="text-align:right">${esc(localPath(['שם הפרויקט']))}</div>
      </div>` : '') + `
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>עוזר Claude</h2>
        <p>העוזר (הכפתור ✨ בפינה) עונה על שאלות על הנתונים במערכת, מסכם פרוטוקולים, ויכול ליצור ולעדכן משימות. הוא עובד עם מפתח API של Anthropic, וכל שיחה מחויבת בחשבון ה-API שלכם. ${CLOUD ? 'המפתח אישי: הוא נשמר בפרופיל הפרטי שלכם בענן, רק אתם יכולים לקרוא אותו, והוא זמין בכל המכשירים שבהם אתם מחוברים.' : 'המפתח נשמר רק בדפדפן הזה.'} הוא לא עולה לגיטהב ולא נכלל בקובץ הגיבוי. בכל שאלה נשלחים ל-Claude גם נתוני המערכת, כדי שיוכל לענות.</p>
        <div class="row"><input class="input" id="aiKeyInput" type="password" dir="ltr" autocomplete="off" placeholder="sk-ant-..." style="flex:1;min-width:220px" value="${esc(getAiKey())}">
        <button class="btn primary" id="aiKeySave">שמירה</button><button class="btn" id="aiKeyDel">מחיקה</button></div>
        <div class="hint">יוצרים מפתח ב-console.anthropic.com, תחת API Keys.</div>
      </div>
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>שליחת פרוטוקולים במייל</h2>
        <p>הנמענים האלה ימולאו אוטומטית בכל פעם שלוחצים "שליחה במייל" בפרוטוקול. אפשר לשנות אותם במייל עצמו לפני השליחה. מפרידים בין כתובות בפסיק.</p>
        <div class="modal-body" style="padding:0;margin-bottom:12px">
          <div class="field full"><label>נמענים קבועים (אל)</label><input class="input" id="setTo" dir="ltr" placeholder="name@example.com, name2@example.com" value="${esc(st.emailTo || '')}"></div>
          <div class="field full"><label>רשימת תפוצה (העתק)</label><textarea class="input" id="setCc" dir="ltr" placeholder="כתובת בכל שורה או מופרדות בפסיק">${esc(st.emailCc || '')}</textarea></div>
          <div class="field full"><label>לפתוח את המייל ב</label><select class="input" id="setApp">
            <option value="gmail" ${!st.mailApp || st.mailApp === 'gmail' ? 'selected' : ''}>Gmail (פתיחת טיוטה)</option>
            <option value="mailto" ${st.mailApp === 'mailto' ? 'selected' : ''}>אפליקציית המייל של המכשיר (Outlook, Mail)</option>
            ${GOOGLE ? `<option value="gmailApi" ${st.mailApp === 'gmailApi' ? 'selected' : ''}>Gmail: שליחה ישירה עם Word מצורף</option>` : ''}</select></div>
        </div>
        <div class="row"><button class="btn primary" id="saveMail">שמירה</button></div>
      </div>
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>גיבוי ושחזור</h2>
        <p>${CLOUD ? 'הנתונים נשמרים בענן ומסונכרנים בין כל המשתמשים והמכשירים, וזמינים גם בלי רשת (השינויים נשלחים כשהחיבור חוזר). אפשר גם להוריד קובץ גיבוי למחשב.' : 'הנתונים נשמרים רק בדפדפן ובמכשיר הזה. כדי לא לאבד אותם, או כדי להעביר אותם למכשיר אחר, הורידו קובץ גיבוי מדי פעם וטענו אותו במכשיר השני.'}</p>
        <div class="row"><button class="btn primary" id="expBtn">הורדת קובץ גיבוי</button>
        ${isAdmin() ? '<label class="btn">טעינת קובץ גיבוי<input type="file" id="impFile" accept=".json,application/json" hidden></label>' : ''}</div>
        <div class="hint">במערכת כרגע: ${db.projects.length} פרויקטים, ${db.tasks.length} משימות, ${db.invoices.length} חשבונות, ${db.protocols.length} פרוטוקולים.</div>
      </div>
      ${nativeBridge() ? '' : `<div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>התקנה כאפליקציה בטלפון</h2>
        <p><strong>אייפון:</strong> פתחו את האתר בספארי, לחצו על כפתור השיתוף ובחרו "הוספה למסך הבית".<br>
        <strong>אנדרואיד:</strong> פתחו את האתר בכרום, לחצו על תפריט שלוש הנקודות ובחרו "התקנת אפליקציה".</p>
        <div class="row"><button class="btn primary" id="installBtn" style="display:none">התקנה עכשיו</button></div>
      </div>`}
      ${isAdmin() ? `<div class="card card-pad settings" style="max-width:720px">
        <h2>איפוס</h2>
        <p>${CLOUD ? 'מחיקה של כל נתוני החברה בענן, אצל כל המשתמשים.' : 'מחיקה של כל הנתונים במכשיר הזה.'} כדאי להוריד קובץ גיבוי לפני כן.</p>
        <div class="row"><button class="btn danger" id="wipeBtn">מחיקת כל הנתונים</button>
        ${CLOUD ? '' : '<button class="btn" id="demoBtn">טעינת נתוני דוגמה</button>'}</div>
      </div>` : ''}`;
    $('#aiKeySave', el).addEventListener('click', async () => {
      const v = $('#aiKeyInput', el).value.trim();
      try { await setAiKey(v); } catch (e) { toast('שמירת המפתח נכשלה'); return; }
      aiClient = null; aiReset(); toast(v ? 'המפתח נשמר' : 'המפתח נמחק');
    });
    $('#aiKeyDel', el).addEventListener('click', async () => {
      try { await setAiKey(''); } catch (e) { toast('מחיקת המפתח נכשלה'); return; }
      $('#aiKeyInput', el).value = ''; aiClient = null; aiReset(); toast('המפתח נמחק');
    });
    $('#saveMail', el).addEventListener('click', () => {
      const bad = [$('#setTo', el).value, $('#setCc', el).value].join(',').split(/[\s,;]+/).filter((x) => x && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
      st.emailTo = $('#setTo', el).value.trim(); st.emailCc = $('#setCc', el).value.trim(); st.mailApp = $('#setApp', el).value;
      save(); toast(bad.length ? 'נשמר. כתובות לא תקינות ידולגו: ' + bad.join(', ') : 'הגדרות המייל נשמרו');
    });
    $('#expBtn', el).addEventListener('click', () => download('femy-גיבוי-' + todayStr() + '.json', JSON.stringify(db, null, 2), 'application/json'));
    const imp = $('#impFile', el);
    if (imp) imp.addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.projects)) throw new Error();
          if (!confirm(CLOUD ? 'הטעינה תחליף את כל נתוני החברה בענן, אצל כל המשתמשים. להמשיך?' : 'הטעינה תחליף את כל הנתונים הנוכחיים במכשיר. להמשיך?')) return;
          db = Object.assign(emptyDb(), d); if (CLOUD) db.demo = false; save(); render(); toast('הגיבוי נטען בהצלחה');
        } catch (err) { toast('הקובץ אינו קובץ גיבוי תקין'); }
      };
      r.readAsText(file);
    });
    const wipe = $('#wipeBtn', el);
    if (wipe) wipe.addEventListener('click', () => { if (confirm(CLOUD ? 'למחוק את כל נתוני החברה בענן, אצל כל המשתמשים? לא ניתן לבטל.' : 'למחוק את כל הנתונים? לא ניתן לבטל.')) { db = emptyDb(); save(); render(); toast('כל הנתונים נמחקו'); } });
    const demo = $('#demoBtn', el);
    if (demo) demo.addEventListener('click', () => { if (confirm('נתוני הדוגמה יחליפו את הנתונים הנוכחיים. להמשיך?')) { db = demoData(); save(); render(); } });
    bindCloudSettings(el);
    bindGoogleSettings(el);
    bindLocalDriveSettings(el);
    const ib = $('#installBtn', el);
    if (ib && deferredInstall) { ib.style.display = ''; ib.addEventListener('click', promptInstall); }
  }

  // ---------- Modal ----------
  let modalSubmit = null; let modalDelete = null; let modalOnClose = null; let modalGen = 0;
  function openModal(title, bodyHtml, onSubmit, onDelete, deleteNote) {
    $('#modalTitle').textContent = title;
    $('#modalForm').classList.remove('wide', 'with-pv');
    $('#modalBody').innerHTML = bodyHtml;
    modalSubmit = onSubmit; modalDelete = onDelete; modalOnClose = null; modalGen++;
    const del = $('#modalDelete');
    del.style.display = onDelete ? '' : 'none';
    del.dataset.note = deleteNote || '';
    $('#modalBg').classList.add('show');
    const first = $('#modalBody input, #modalBody select, #modalBody textarea');
    if (first && window.matchMedia('(min-width: 800px)').matches) first.focus();
  }
  function closeModal() {
    const fn = modalOnClose; modalOnClose = null;
    if (fn) try { fn(); } catch (e) {}
    $('#modalBg').classList.remove('show'); modalSubmit = modalDelete = null;
  }
  // The form's fields, as the submit hands them over.
  function modalData() {
    const fd = new FormData($('#modalForm')); const data = {};
    $$('#modalBody [name]').forEach((inp) => { data[inp.name] = inp.type === 'checkbox' ? inp.checked : (fd.get(inp.name) || '').toString().trim(); });
    return data;
  }
  // Saves the open form while it is being typed in (a moment after the last change, and when it closes), so
  // everyone sees the document / task as it is being written, not only after "שמירה".
  function liveForm(fn, delay) {
    const gen = modalGen; let timer = null;
    const run = () => { clearTimeout(timer); timer = null; if (gen === modalGen) fn(); };
    const later = () => { if (gen !== modalGen) return; clearTimeout(timer); timer = setTimeout(run, delay || 1500); };
    const body = $('#modalBody');
    body.addEventListener('input', later);
    body.addEventListener('change', later);
    body.addEventListener('click', (e) => { if (e.target.closest('button')) later(); });
    modalOnClose = () => { if (timer) run(); };
  }

  // ---------- Misc ----------
  // When running inside the phone app (Expo WebView), hand files to the native side.
  const nativeBridge = () => window.ReactNativeWebView;
  function downloadBlob(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
  function download(name, text, type) {
    if (nativeBridge()) { nativeBridge().postMessage(JSON.stringify({ type: 'download', name, text, mime: type })); return; }
    const blob = new Blob([text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function closeSidebar() { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }

  // PWA install prompt (Android / desktop Chrome)
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredInstall = e;
    $('#installTop').style.display = '';
    if (currentView() === 'settings') render();
  });
  function promptInstall() {
    if (!deferredInstall) { location.hash = 'settings'; return; }
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(() => { deferredInstall = null; $('#installTop').style.display = 'none'; });
  }
  window.addEventListener('appinstalled', () => { $('#installTop').style.display = 'none'; toast('האפליקציה הותקנה'); });

  // ---------- Init ----------
  document.addEventListener('DOMContentLoaded', () => {
    initAi();
    $('#modalForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = modalData();
      const fn = modalSubmit; modalOnClose = null; closeModal(); if (fn) fn(data);
    });
    $('#modalDelete').addEventListener('click', () => {
      const note = $('#modalDelete').dataset.note;
      if (!confirm('למחוק את הפריט?' + (note ? '\n' + note : ''))) return;
      const fn = modalDelete; closeModal(); if (fn) fn();
    });
    $$('[data-close]').forEach((b) => b.addEventListener('click', closeModal));
    $('#modalBg').addEventListener('mousedown', (e) => { if (e.target.id === 'modalBg') closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    $('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
    $('#overlay').addEventListener('click', closeSidebar);
    $('#installTop').addEventListener('click', promptInstall);
    $('#addBtn').addEventListener('click', () => {
      const v = currentView();
      if (v === 'projects') openProjectForm();
      else if (v === 'accounts') { if (ui.accTab === 'invoices') openInvoiceForm(); else openLedgerImport(); }
      else if (v === 'protocols') openProtocolForm();
      else if (v === 'project') openTaskForm(null, { projectId: ui.projectId });
      else openTaskForm();
    });
    window.addEventListener('hashchange', render);
    loadDriveProtos();
    G.onChange(() => { if (currentView() === 'google' || currentView() === 'settings') render(); });
    if (CLOUD) { render(); startCloud(); }
    else if (!localSession) { localGate(); }
    else {
      $('#logoutName').textContent = localSession.name || localSession.username;
      $('#logoutTop').style.display = '';
      $('#logoutTop').addEventListener('click', localSignOut);
      G.init(localSession.username, /@/.test(localSession.username) ? localSession.username : '');
      window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) { db = load(); render(); } });
      if (!localStorage.getItem(STORE_KEY)) save();
      render();
      importDriveProjects(false).then(() => importLedgers(false)).then(() => syncTaskSheet(false));
      setInterval(() => syncTaskSheet(false), 10 * 60 * 1000);
      document.addEventListener('visibilitychange', () => {
        const st = settings().sheetSync;
        if (document.visibilityState === 'visible' && (!st || Date.now() - st.at > 5 * 60 * 1000)) syncTaskSheet(false);
      });
      G.onChange(() => { if (G.silent() && !settings().sheetSync) syncTaskSheet(false); });
    }

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  });
})();
</script>
</body>
</html>
