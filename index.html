<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>פמי הנדסה - ניהול</title>
  <meta name="description" content="מערכת ניהול ומעקב: משימות, פרויקטים, חשבונות ופרוטוקולים">
  <meta name="theme-color" content="#15253d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="פמי הנדסה">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e3e8ef;
  --text: #1c2533;
  --muted: #64748b;
  --primary: #1f5fae;
  --primary-soft: #e6effa;
  --sidebar: #15253d;
  --sidebar-text: #c9d5e6;
  --green: #1e8a5a;
  --green-soft: #e3f4ec;
  --amber: #b7791f;
  --amber-soft: #fdf3e1;
  --red: #c53b3b;
  --red-soft: #fbe9e9;
  --gray-soft: #eef1f5;
  --purple: #6b4fbb;
  --purple-soft: #efeafb;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Assistant", "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }

/* Layout */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 230px;
  background: var(--sidebar);
  color: var(--sidebar-text);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand-name { color: #fff; font-size: 20px; font-weight: 700; }
.brand-sub { font-size: 13px; opacity: .7; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 8px;
  color: var(--sidebar-text); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.active { background: var(--primary); color: #fff; }
.nav .ico { width: 20px; text-align: center; }
.nav .badge {
  margin-inline-start: auto; background: rgba(255,255,255,.15);
  border-radius: 10px; padding: 0 8px; font-size: 12px;
}
.nav-sep { margin: 14px 12px 4px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11.5px; opacity: .55; }
.nav a.minor { padding: 7px 12px; font-size: 14px; font-weight: 400; }
.sidebar-foot { padding: 14px 20px; font-size: 12px; opacity: .6; }

/* Project page and groups */
.back-link { display: inline-block; margin-bottom: 12px; text-decoration: none; font-weight: 600; }
.group-head { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; flex-wrap: wrap; }
.group-head:first-child { margin-top: 0; }
.group-head h2 { font-size: 17px; margin: 0; }
.group-head .count { color: var(--muted); font-size: 13px; }
.group-head a { text-decoration: none; color: inherit; }
.group-head a:hover { text-decoration: underline; }
.proj.click { cursor: pointer; transition: border-color .15s; }
.proj.click:hover { border-color: var(--primary); }
.proj-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.proj-head .grow { flex: 1; min-width: 240px; }
.proj-head h2 { font-size: 22px; margin: 0 0 2px; }
.proj-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.status-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.ov-name { font-weight: 600; color: inherit; text-decoration: none; }
.ov-name:hover { text-decoration: underline; }
td .progress { min-width: 80px; }
.proj-dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
.proj-dl dt { color: var(--muted); }
.proj-dl dd { margin: 0; }
.mini-proto { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.mini-proto:last-child { border-bottom: 0; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 28px; display: flex; align-items: center; gap: 18px;
  z-index: 5;
}
.topbar h1 { font-size: 20px; margin: 0; flex: 1; }
.top-logo-link { display: flex; flex-shrink: 0; padding-inline-end: 18px; border-inline-end: 1px solid var(--border); }
.top-logo { height: 120px; width: auto; display: block; }
.menu-btn { display: none; background: none; border: 0; font-size: 22px; cursor: pointer; padding: 4px 8px; }
.content { padding: 24px 28px 48px; max-width: 1400px; width: 100%; }

/* Buttons */
.btn {
  border: 1px solid var(--border); background: var(--surface);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
a.btn { text-decoration: none; color: inherit; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.icon-btn {
  background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 6px;
  color: var(--muted); font-size: 15px;
}
.icon-btn:hover { background: var(--gray-soft); color: var(--text); }

/* Cards & grid */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.card-pad { padding: 18px 20px; }
.card h2 { font-size: 16px; margin: 0 0 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-head h2 { margin: 0; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
.kpi { padding: 16px 18px; }
.kpi .label { color: var(--muted); font-size: 13px; font-weight: 600; }
.kpi .value { font-size: 28px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.kpi.warn .value { color: var(--red); }
.kpi.good .value { color: var(--green); }

.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-bottom: 18px; }
.grid-2 > * { min-width: 0; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar .spacer { flex: 1; }
.input, select.input, textarea.input {
  border: 1px solid var(--border); background: var(--surface);
  border-radius: 8px; padding: 8px 10px; min-width: 0;
}
.input:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
.search { width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--primary-soft); color: var(--primary); }

/* Pills */
.pill {
  display: inline-block; padding: 1px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.pill.gray { background: var(--gray-soft); color: #475569; }
.pill.blue { background: var(--primary-soft); color: var(--primary); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.purple { background: var(--purple-soft); color: var(--purple); }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 13px; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
tbody tr:hover { background: var(--surface-2); }
td.num, th.num { text-align: left; font-variant-numeric: tabular-nums; direction: ltr; }
td.actions { white-space: nowrap; text-align: left; width: 1%; }
tfoot td { font-weight: 700; background: var(--surface-2); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* Kanban */
.tgroup { padding: 14px 16px; margin-bottom: 12px; }
#taskViews { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
#taskViews button { white-space: nowrap; }
#taskArea { touch-action: pan-y; }
.sheet-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: -4px 0 12px; }
.tg-note { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.tg-title { min-width: 0; }
.contact .tg-meta a { color: inherit; }
.tlink { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--primary); text-decoration: none; background: var(--surface); white-space: nowrap; }
.tlink:hover { background: var(--primary-soft); }
.tg-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.tg-head .grow { flex: 1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.tg-row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tg-row:last-child { border-bottom: 0; }
.tg-title { flex: 1; min-width: 180px; color: inherit; text-decoration: none; }
.tg-title:hover { text-decoration: underline; }
.tg-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.col { background: #eaeef3; border-radius: var(--radius); padding: 10px; min-height: 200px; display: flex; flex-direction: column; }
.col.drop { outline: 2px dashed var(--primary); background: var(--primary-soft); }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 10px; font-weight: 700; }
.col-head .count { color: var(--muted); font-weight: 600; font-size: 13px; }
.col-body { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.tcard {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; cursor: grab; box-shadow: var(--shadow);
  border-inline-start: 4px solid var(--border);
}
.tcard.dragging { opacity: .5; }
.tcard.p-urgent { border-inline-start-color: var(--red); }
.tcard.p-high { border-inline-start-color: var(--amber); }
.tcard.p-medium { border-inline-start-color: var(--primary); }
.tcard.p-low { border-inline-start-color: #94a3b8; }
.tcard .t-title { font-weight: 600; margin-bottom: 6px; }
.tcard .t-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.overdue { color: var(--red) !important; font-weight: 700; }

/* Projects */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.pcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.pcol { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; min-width: 0; }
.pcol-title { font-size: 15px; margin: 0 0 8px; color: var(--muted); }
.pgroup { margin-bottom: 12px; }
.pgroup:last-child { margin-bottom: 0; }
.pgroup-head { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
.pgroup-head .count { color: var(--muted); font-size: 12px; }
.ptile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(120px, 100%), 1fr)); gap: 5px; }
.ptile { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); cursor: pointer; font-size: 12px; line-height: 1.3; min-width: 0; }
.ptile:hover { border-color: var(--primary); background: var(--primary-soft); }
.ptile.s-done { opacity: .6; }
.ptile-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.pdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #94a3b8; }
.pdot.blue { background: var(--primary); } .pdot.green { background: var(--green); } .pdot.amber { background: var(--amber); } .pdot.purple { background: var(--purple); } .pdot.red { background: var(--red); }
@media (max-width: 800px) { .pcols { grid-template-columns: minmax(0, 1fr); } .ptile-grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); } }
.proj { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.proj-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.proj-name { font-size: 17px; font-weight: 700; }
.proj-client { color: var(--muted); font-size: 13.5px; }
.proj dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13.5px; }
.proj dt { color: var(--muted); }
.proj dd { margin: 0; }
.progress { height: 8px; background: var(--gray-soft); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.progress.done > span { background: var(--green); }
.proj-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; font-size: 13px; color: var(--muted); }

/* Lists in dashboard */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .meta { font-size: 12.5px; color: var(--muted); }

.prog-row { display: grid; grid-template-columns: 1fr 2fr 44px; gap: 10px; align-items: center; padding: 7px 0; font-size: 14px; }
.prog-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-row .pct { text-align: left; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Bar chart */
.chart { display: flex; align-items: flex-end; gap: 14px; height: 180px; padding: 10px 4px 0; border-bottom: 1px solid var(--border); }
.chart .m { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.chart .bars { display: flex; gap: 3px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
.chart .bar { width: 40%; max-width: 22px; border-radius: 4px 4px 0 0; min-height: 2px; }
.chart .bar.in { background: var(--primary); }
.chart .bar.out { background: #e0a43a; }
.chart-labels { display: flex; gap: 14px; padding: 6px 4px 0; }
.chart-labels span { flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: middle; }

/* Protocols */
.proto { margin-bottom: 12px; }
.proto-head { display: flex; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; }
.proto-date { background: var(--primary-soft); color: var(--primary); border-radius: 8px; padding: 6px 10px; text-align: center; min-width: 64px; font-weight: 700; line-height: 1.2; }
.proto-date small { display: block; font-weight: 500; font-size: 11.5px; }
.proto-title { font-weight: 700; }
.proto-sub { font-size: 13px; color: var(--muted); }
.proto-body { padding: 0 18px 16px; border-top: 1px solid var(--border); display: none; }
.proto.open .proto-body { display: block; }
.proto-body h4 { margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
.proto-body p { margin: 0; white-space: pre-wrap; }
.proto-body ul { margin: 0; padding-inline-start: 20px; }
.chev { transition: transform .15s; color: var(--muted); }
.proto-new { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.tpl-tag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 1px 7px; margin-inline-end: 7px; vertical-align: 1px; background: var(--primary-soft); color: var(--primary); }
.tpl-tag.tpl-supervision { background: #fff1dc; color: #9a5b00; }
.tpl-tag.tpl-tour { background: #e8eefc; color: #2f55b5; }
.tpl-tag.tpl-draft { background: #fef3c7; color: #92400e; }
.pi-phpos { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.pv-gdoc { font-size: 12px; }
.pv-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; font-size: 13px; }
.pv-bar b { font-size: 14px; }
/* Protocol form: the form on the right, a fixed live preview on the left (on top on narrow screens). */
.modal.wide.with-pv { max-width: 1480px; }
.modal.with-pv .modal-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 44%); grid-template-areas: "form pv"; gap: 18px; align-items: start; }
.pv-form { grid-area: form; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; min-width: 0; }
.pv-pane { grid-area: pv; position: sticky; top: -28px; z-index: 3; background: var(--surface); padding: 6px 0; min-width: 0; }
.pv-pane iframe { width: 100%; height: calc(100vh - 70px); border: 1px solid var(--border); border-radius: 8px; background: #9aa1a8; display: block; }
.pv-pane [data-preview] { display: none; }
@media (max-width: 1099px) {
  .modal.with-pv .modal-body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "pv" "form"; }
  .pv-pane { top: -40px; }
  .pv-pane iframe { height: min(440px, 42vh); }
  .pv-pane [data-preview] { display: inline-flex; }
}
.proto-kinds { display: flex; width: 100%; margin-bottom: 12px; }
.proto-kinds button { flex: 1; padding: 10px 12px; font-size: 15px; }
.proto-kinds .n { display: inline-block; min-width: 22px; padding: 0 6px; border-radius: 10px; background: var(--border); color: var(--text); font-size: 12px; margin-inline-start: 4px; }
.proto-kinds button.on .n { background: var(--primary); color: #fff; }
.dp-status { margin: -4px 0 12px; }
/* Protocols by project: one compact tile per project with its latest documents. */
.prtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.prtile { display: flex; flex-direction: column; align-items: stretch; padding: 10px 12px; min-width: 0; cursor: pointer; transition: box-shadow .12s, border-color .12s; }
.prtile:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(16, 24, 40, .1); }
.prtile-head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
.prtile-head b { flex: 1; min-width: 0; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prtile-head .n { flex: none; font-size: 11.5px; font-weight: 600; color: var(--primary); background: var(--primary-soft); border-radius: 9px; padding: 0 7px; }
.prtile-client { font-size: 12px; color: var(--muted); margin: -4px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prtile ul { list-style: none; margin: 0; padding: 0; }
.prtile li { display: flex; font-size: 13px; padding: 3px 0; border-top: 1px solid var(--border); }
.prtile li a { color: inherit; text-decoration: none; display: flex; gap: 8px; align-items: baseline; min-width: 0; flex: 1; }
.prtile li a:hover .t { text-decoration: underline; color: var(--primary); }
.prtile li .d { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 58px; }
.prtile li .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prtile-more { margin-top: auto; padding-top: 4px; font-size: 12px; color: var(--primary); }
.dproto { display: flex; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.dproto .proto-head { flex: 1; min-width: 240px; text-decoration: none; color: inherit; }
.dproto .proto-head:hover .proto-title { text-decoration: underline; }
.dp-acts { display: flex; gap: 6px; padding: 0 14px 0 18px; flex-wrap: wrap; }
.dp-src { color: var(--primary); }
.dp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.dp-cols h3 { font-size: 15px; margin: 0 0 8px; }
.dp-line { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 14px; }

/* פמי הנדסה - מערכת ניהול ומעקב
 * מצב מקומי: הנתונים נשמרים בדפדפן (localStorage).
 * מצב ענן (כשמוגדר firebase-config.js): התחברות, ונתונים משותפים ב-Firestore דרך cloud.js.

    if (dc) G.calendar.events(2).then((evs) => { if (document.body.contains(dc)) dc.innerHTML = eventsHtml(evs) || '<div class="empty">אין אירועים היום ומחר</div>'; })
      .catch(() => { if (document.body.contains(dc)) dc.innerHTML = '<div class="hint">לא ניתן לטעון את היומן כרגע</div>'; });
    const cd = $('[data-act="clear-demo"]', el);
    if (cd) cd.addEventListener('click', () => {
      if (!confirm('למחוק את כל נתוני הדוגמה ולהתחיל מערכת ריקה?')) return;
      db = emptyDb(); save(); render(); toast('נתוני הדוגמה נמחקו');
    });
  }

  // ---------- Tasks ----------
  function filteredTasks() {
    const f = ui.taskFilter; const q = f.q.trim().toLowerCase();
    return db.tasks.filter((t) => {
      if (f.project && t.projectId !== f.project) return false;
      if (f.assignee && t.assignee !== f.assignee) return false;
      if (f.priority && t.priority !== f.priority) return false;
      if (q && !(t.title + ' ' + (t.notes || '') + ' ' + (t.assignee || '')).toLowerCase().includes(q)) return false;
      return true;
    });
  }
  function projectOptions(selected, emptyLabel) {
    return `<option value="">${emptyLabel}</option>` + db.projects.map((p) => `<option value="${p.id}" ${p.id === selected ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  }
  function dictOptions(dict, selected, emptyLabel) {
    return (emptyLabel != null ? `<option value="">${emptyLabel}</option>` : '') + dict.map((o) => `<option value="${o.id}" ${o.id === selected ? 'selected' : ''}>${esc(o.label)}</option>`).join('');
  }
  const assignees = () => Array.from(new Set(db.tasks.map((t) => t.assignee).filter(Boolean))).sort();

  const GROUP_VIEWS = ['priority', 'projects', 'client'];
  const TASK_VIEWS = [['priority', 'לפי דחיפות'], ['projects', 'לפי פרויקט'], ['client', 'לפי לקוח'], ['board', 'לוח'], ['list', 'רשימה']];
  function renderTasks(el) {
    const f = ui.taskFilter;
    el.innerHTML = `
      <div class="toolbar">
        <input class="input search" id="tq" placeholder="חיפוש משימה..." value="${esc(f.q)}">
        <select class="input" id="tp">${projectOptions(f.project, 'כל הפרויקטים')}</select>
        <select class="input" id="ta"><option value="">כל האחראים</option>${assignees().map((a) => `<option ${a === f.assignee ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select>
        <select class="input" id="tpr">${dictOptions(PRIORITY, f.priority, 'כל העדיפויות')}</select>
        <span class="spacer"></span>
        <div class="seg" id="taskViews">${TASK_VIEWS.map(([k, l]) => `<button data-v="${k}" class="${ui.taskView === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      </div>
      ${TASK_SHEET ? `<div class="sheet-bar"><span class="hint" id="sheetStatus">${sheetStatusText()}</span>
        <a class="hint" href="https://docs.google.com/spreadsheets/d/${encodeURIComponent(TASK_SHEET)}/edit" target="_blank" rel="noopener">פתיחת הגיליון ↗</a>
        <button class="btn sm" id="sheetSyncBtn">🔄 סנכרון עכשיו</button></div>` : ''}
      <div id="taskArea"></div>`;
    const ssb = $('#sheetSyncBtn', el);
    if (ssb) ssb.addEventListener('click', () => syncTaskSheet(true));
    const rerender = () => drawTasks($('#taskArea', el));
    $('#tq', el).addEventListener('input', (e) => { f.q = e.target.value; rerender(); });
    $('#tp', el).addEventListener('change', (e) => { f.project = e.target.value; rerender(); });
    $('#ta', el).addEventListener('change', (e) => { f.assignee = e.target.value; rerender(); });
    $('#tpr', el).addEventListener('change', (e) => { f.priority = e.target.value; rerender(); });
    $$('.seg button', el).forEach((b) => b.addEventListener('click', () => { ui.taskView = b.dataset.v; renderTasks(el); }));
    // Swipe right or left on the tasks to move between the views, in the order of the buttons.
    // The page is right to left, so the next view sits to the left: a swipe to the right brings it in.
    const area = $('#taskArea', el);
    let sx = null, sy = 0;
    area.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1 || e.target.closest('.kanban, .table-wrap')) { sx = null; return; }
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    area.addEventListener('touchend', (e) => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
      if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
      const keys = TASK_VIEWS.map(([k]) => k);
      const i = keys.indexOf(ui.taskView) + (dx > 0 ? 1 : -1);
      if (i < 0 || i >= keys.length) return;
      ui.taskView = keys[i]; renderTasks(el);
      const on = $('#taskViews .on', el); if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }, { passive: true });
    rerender();
  }

  function taskCard(t) {
    const p = byId(db.projects, t.projectId);
    const od = isOverdueTask(t);
    return `<div class="tcard p-${t.priority}" draggable="true" data-id="${t.id}">
      <div class="t-title">${esc(t.title)}</div>

      <div class="t-meta" style="margin-top:6px">${taskLinks(t)}</div>
    </div>`;
  }

  function drawTasks(area) {
    const list = filteredTasks().sort((a, b) => byId(PRIORITY, a.priority).rank - byId(PRIORITY, b.priority).rank || (a.due || '9999').localeCompare(b.due || '9999'));
    if (GROUP_VIEWS.includes(ui.taskView)) {
      // Grouped views: by urgency, by project or by client. Each group shows its open tasks,
      // with the completed ones folded at the bottom.
      const mode = ui.taskView;
      const projOf = (t) => byId(db.projects, t.projectId);
      let groups;
      if (mode === 'priority') {
        groups = PRIORITY.map((pr) => ({ key: 'pr-' + pr.id, title: pr.label, head: '', add: { priority: pr.id }, items: list.filter((t) => t.priority === pr.id) }));
      } else if (mode === 'client') {
        const clients = [];
        db.projects.forEach((pj) => { const c = (pj.client || '').trim(); if (!clients.includes(c)) clients.push(c); });
        groups = clients.map((c) => {
          const ids = db.projects.filter((pj) => (pj.client || '').trim() === c).map((pj) => pj.id);
          return { key: 'cl-' + c, title: c || 'ללא לקוח', head: `<span class="hint">${ids.length} פרויקטים</span>`, add: {}, items: list.filter((t) => ids.includes(t.projectId)) };
        });
        groups.push({ key: 'cl-_none', title: 'ללא פרויקט', head: '', add: {}, items: list.filter((t) => !projOf(t)) });
      } else {
        groups = db.projects.map((pj) => ({ key: pj.id, title: pj.name, head: `<span class="hint">${esc(pj.client || '')}</span> ${pill(PROJECT_STATUS, pj.status)}`, add: { projectId: pj.id }, pid: pj.id, items: list.filter((t) => t.projectId === pj.id) }));
        groups.push({ key: '_none', title: 'ללא פרויקט', head: '', add: {}, items: list.filter((t) => !projOf(t)) });
      }
      const filtering = ui.taskFilter.q || ui.taskFilter.assignee || ui.taskFilter.priority || ui.taskFilter.project;
      const hasOpen = (g) => g.items.some((t) => t.status !== 'done');
      let shown = groups.filter((g) => g.items.length && (mode !== 'projects' || !ui.taskFilter.project || g.pid === ui.taskFilter.project));
      if (mode !== 'priority') shown = shown.sort((a, b) => hasOpen(b) - hasOpen(a));
      const row = (t) => {
        const od = isOverdueTask(t); const done = t.status === 'done'; const pj = projOf(t);
        return `<div class="tg-row" data-id="${t.id}">
          <input type="checkbox" data-done ${done ? 'checked' : ''} title="סימון כהושלם">
          <a href="#" data-edit class="tg-title" style="${done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(t.title)}${t.notes ? `<div class="hint tg-note">${esc(t.notes.split('\n')[0])}</div>` : ''}</a>
          <span class="tg-meta">${taskLinks(t)}${mode !== 'projects' && pj ? `<span>🏗 ${esc(pj.name)}</span>` : ''}${t.assignee ? `<span>👤 ${esc(t.assignee)}</span>` : ''}${t.due ? `<span class="${od ? 'overdue' : ''}">📅 ${fmtDate(t.due)}</span>` : ''}${mode !== 'priority' ? pill(PRIORITY, t.priority) : ''}${pill(TASK_STATUS, t.status)}</span>
        </div>`;
      };
      area.innerHTML = shown.map((g) => {
        const open = g.items.filter((t) => t.status !== 'done'); const done = g.items.filter((t) => t.status === 'done');
        const odN = open.filter(isOverdueTask).length;
        const showDone = ui.taskOpenDone[g.key];
        return `<div class="card tgroup" data-key="${esc(g.key)}">
          <div class="tg-head"><div class="grow"><b>${esc(g.title)}</b> ${g.head}</div>
            <span class="hint">${open.length} פתוחות${odN ? ` · <span class="overdue">${odN} באיחור</span>` : ''}</span>
            <button class="btn sm" data-addg="${esc(JSON.stringify(g.add))}">+ משימה</button></div>
          ${open.map(row).join('') || '<div class="hint" style="padding:8px 0">אין משימות פתוחות</div>'}
          ${done.length ? `<a href="#" class="hint" data-toggle-done style="display:inline-block;padding-top:8px">${showDone ? 'הסתרת' : 'הצגת'} ${done.length} משימות שהושלמו</a>${showDone ? done.map(row).join('') : ''}` : ''}
        </div>`;
      }).join('') || `<div class="card empty">${filtering ? 'לא נמצאו משימות' : 'אין משימות עדיין'}</div>`;
      $$('.tg-row', area).forEach((r) => {
        const t = byId(db.tasks, r.dataset.id);
        $('[data-edit]', r).addEventListener('click', (e) => { e.preventDefault(); openTaskForm(t); });
        $('[data-done]', r).addEventListener('change', (e) => { t.status = e.target.checked ? 'done' : 'todo'; save(); drawTasks(area); updateBadge(); });
      });
      $$('.tgroup', area).forEach((g) => {
        const tg = $('[data-toggle-done]', g);
        if (tg) tg.addEventListener('click', (e) => { e.preventDefault(); ui.taskOpenDone[g.dataset.key] = !ui.taskOpenDone[g.dataset.key]; drawTasks(area); });
        $('[data-addg]', g).addEventListener('click', (e) => openTaskForm(null, JSON.parse(e.currentTarget.dataset.addg)));
      });
    } else if (ui.taskView === 'board') {
      area.innerHTML = `<div class="kanban">${TASK_STATUS.map((s) => {
        const items = list.filter((t) => t.status === s.id);
        return `<div class="col" data-status="${s.id}">
          <div class="col-head"><span>${s.label}</span><span class="count">${items.length}</span></div>
          <div class="col-body">${items.map(taskCard).join('')}</div>
          <button class="btn sm" style="margin-top:8px;justify-content:center;background:transparent;border-style:dashed" data-add="${s.id}">+ הוספה</button>
        </div>`;
      }).join('')}</div>`;
      $$('.tcard', area).forEach((c) => {
        c.addEventListener('click', (e) => { if (e.target.closest('a')) return; openTaskForm(byId(db.tasks, c.dataset.id)); });
        c.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging'); });
        c.addEventListener('dragend', () => c.classList.remove('dragging'));
      });
      $$('.col', area).forEach((col) => {
        col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drop'); });
        col.addEventListener('dragleave', () => col.classList.remove('drop'));
        col.addEventListener('drop', (e) => {
          e.preventDefault(); col.classList.remove('drop');
          const t = byId(db.tasks, e.dataTransfer.getData('text/plain'));
          if (t && t.status !== col.dataset.status) { t.status = col.dataset.status; save(); drawTasks(area); updateBadge(); }
        });
      });
      $$('[data-add]', area).forEach((b) => b.addEventListener('click', () => openTaskForm(null, { status: b.dataset.add })));
    } else {
      area.innerHTML = `<div class="card table-wrap"><table>
        <thead><tr><th style="width:1%"></th><th>משימה</th><th>פרויקט</th><th>אחראי</th><th>עדיפות</th><th>סטטוס</th><th>תאריך יעד</th><th></th></tr></thead>
        <tbody>${list.map((t) => {
          const p = byId(db.projects, t.projectId); const od = isOverdueTask(t);
          return `<tr data-id="${t.id}">
            <td><input type="checkbox" data-done ${t.status === 'done' ? 'checked' : ''} title="סימון כהושלם"></td>
            <td style="${t.status === 'done' ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(t.title)}</td>
            <td>${p ? esc(p.name) : '<span class="hint">ללא</span>'}</td>
            <td>${esc(t.assignee || '')}</td>
            <td>${pill(PRIORITY, t.priority)}</td>
            <td>${pill(TASK_STATUS, t.status)}</td>
            <td class="${od ? 'overdue' : ''}">${fmtDate(t.due)}</td>
            <td class="actions" style="white-space:nowrap">${taskLinks(t)} <button class="icon-btn" data-edit title="עריכה">✏️</button></td></tr>`;
        }).join('') || '<tr><td colspan="8" class="empty">לא נמצאו משימות</td></tr>'}</tbody></table></div>`;
      $$('tr[data-id]', area).forEach((tr) => {
        const t = byId(db.tasks, tr.dataset.id);
        $('[data-edit]', tr).addEventListener('click', () => openTaskForm(t));
        $('[data-done]', tr).addEventListener('change', (e) => { t.status = e.target.checked ? 'done' : 'todo'; save(); drawTasks(area); updateBadge(); });
      });
    }
  }
  function updateBadge() {
    const n = db.tasks.filter((t) => t.status !== 'done').length;
    $('#badgeTasks').textContent = n || ''; $('#badgeTasks').style.display = n ? '' : 'none';
  }

  function openTaskForm(task, defaults) {
    const t = task || Object.assign({ title: '', projectId: ui.taskFilter.project || '', assignee: '', priority: 'medium', status: 'todo', due: '', notes: '' }, defaults || {});
    openModal(task ? 'עריכת משימה' : 'משימה חדשה', `
      ${t.sheet ? `<div class="field full hint" style="background:var(--amber-soft);padding:8px 10px;border-radius:8px">המשימה מגיעה מהגיליון "משימות פמי" (${esc(t.sheetClient || '')}${t.sheetNum ? ', שורה ' + esc(t.sheetNum) : ''}). שינוי כאן יוחלף בסנכרון הבא, לכן עדכנו אותה בגיליון. <a href="https://docs.google.com/spreadsheets/d/${encodeURIComponent(TASK_SHEET)}/edit" target="_blank" rel="noopener">פתיחת הגיליון</a></div>` : ''}
      <div class="field full"><label>כותרת *</label><input class="input" name="title" required value="${esc(t.title)}"></div>
      <div class="field"><label>פרויקט</label><select class="input" name="projectId">${projectOptions(t.projectId, 'ללא פרויקט')}</select></div>
      <div class="field"><label>אחראי</label><input class="input" name="assignee" list="assigneeList" value="${esc(t.assignee)}">
        <datalist id="assigneeList">${assignees().map((a) => `<option value="${esc(a)}">`).join('')}</datalist></div>
      <div class="field"><label>איש קשר לטיפול</label><input class="input" name="contactName" list="contactList" value="${esc(t.contactName || '')}">
        <datalist id="contactList">${(db.contacts || []).map((c) => `<option value="${esc(c.name)}">${esc(c.role || '')}</option>`).join('')}</datalist></div>
      <div class="field"><label>טלפון איש הקשר</label><input class="input" name="contactPhone" type="tel" dir="ltr" value="${esc(t.contactPhone || '')}" placeholder="ימולא מאנשי הקשר אם ריק"></div>
      <div class="field"><label>עדיפות</label><select class="input" name="priority">${dictOptions(PRIORITY, t.priority)}</select></div>
      <div class="field"><label>סטטוס</label><select class="input" name="status">${dictOptions(TASK_STATUS, t.status)}</select></div>
      <div class="field"><label>תאריך יעד</label><input class="input" type="date" name="due" value="${esc(t.due)}"></div>
      <div class="field full"><label>הערות</label><textarea class="input" name="notes">${esc(t.notes)}</textarea></div>
      ${GOOGLE ? `<div class="field full"><label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--text)"><input type="checkbox" name="toCal" ${taskCalId(t) ? 'checked' : ''}> ${taskCalId(t) ? 'לעדכן את האירוע ביומן Google שלי' : 'להוסיף ליומן Google שלי (ביום היעד)'}</label></div>` : ''}`,
    (data) => {
      const toCal = data.toCal; delete data.toCal;
      if (rec && !db.tasks.includes(rec)) rec = byId(db.tasks, rec.id) || null;
      const saved = rec || Object.assign({ id: uid() }, data);
      if (rec) Object.assign(rec, data); else db.tasks.push(saved);
      save(); render(); toast(task ? 'המשימה עודכנה' : 'המשימה נוספה');
      if (toCal) taskToCalendar(saved);
    },
    task ? () => { db.tasks = db.tasks.filter((x) => x !== task); save(); render(); toast('המשימה נמחקה'); } : null);
    // Saved while typing, so the other users see it at once (a new task once it has a title).
    // A task from the sheet is not: the next sync of the sheet replaces it anyway.
    let rec = task;
    if (!t.sheet) liveForm(() => {
      const data = modalData(); delete data.toCal;
      if (!data.title) return;
      if (rec && !db.tasks.includes(rec)) rec = byId(db.tasks, rec.id) || null;
      const isNew = !rec;
      if (rec) Object.assign(rec, data); else db.tasks.push(rec = Object.assign({ id: uid() }, data));
      save();
      if (isNew) {
        render();
        modalDelete = () => { db.tasks = db.tasks.filter((x) => x.id !== rec.id); save(); render(); toast('המשימה נמחקה'); };
        $('#modalDelete').style.display = '';
      }
    });
  }

  // ---------- Sync from the tasks sheet ("משימות פמי" in Drive) ----------
  // The sheet is the source of the tasks and contacts: every 10 minutes (and on demand) the site reads it,
  // replaces the tasks that came from it, and keeps the tasks that were added on the site itself.
  const TASK_SHEET = (window.FEMY_GOOGLE && window.FEMY_GOOGLE.tasksSheetId) || '';
  const XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  let sheetSyncing = false;
  function sheetStatusText() {
    const st = settings().sheetSync;
    if (sheetSyncing) return '🔄 מסנכרן מהגיליון "משימות פמי"...';
    if (!st) return SYNC || (GOOGLE && G.status().connected) ? 'המשימות יסונכרנו מהגיליון "משימות פמי"' : 'כדי לסנכרן מהגיליון "משימות פמי", חברו את חשבון ה-Google (בלשונית יומן, מייל ו-Drive)';
    const min = Math.round((Date.now() - st.at) / 60000);
    return `מסונכרן מהגיליון "משימות פמי": ${st.tasks} משימות, ${st.contacts} אנשי קשר · ${min < 1 ? 'עכשיו' : min < 60 ? `לפני ${min} דק׳` : new Date(st.at).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' })}`;
  }
  function showSheetStatus() { const e = $('#sheetStatus'); if (e) e.textContent = sheetStatusText(); }
  // With a Google account connected the site reads the sheet itself (always the latest); without one it
  // takes the copy the sync server keeps (at most 15 minutes old).
  async function syncTaskSheet(manual) {
    if (!TASK_SHEET || !window.FemySheet || sheetSyncing || !isAdmin()) return;
    const direct = GOOGLE && (G.silent() || (manual && !SYNC));
    if (!direct && !useSync(manual)) return;
    sheetSyncing = true; showSheetStatus();
    try {
      let buf, at = Date.now();
      if (direct) {
        if (manual) await G.token(); // may ask to connect, straight from the click
        buf = await G.drive.exportFile(TASK_SHEET, XLSX);
      } else {
        if (manual) await syncRefresh();
        const r = await syncFetch('/data/sheet');
        at = Number(r.headers.get('X-Synced-At')) || at;
        const st = settings().sheetSync;
        if (!manual && st && st.at >= at) return; // nothing new since the last sync
        buf = await r.arrayBuffer();
      }
      const JSZip = await loadJSZip();
      const res = FemySheet.parse(await FemySheet.readXlsx(buf, JSZip));
      if (!res.tasks.length) throw new Error('לא נמצאו משימות בגיליון');
      applySheet(res, at);
      if (manual) toast(`סונכרנו ${res.tasks.length} משימות ו-${res.contacts.length} אנשי קשר מהגיליון`);
    } catch (e) {
      if (manual) toast('הסנכרון מהגיליון נכשל: ' + gErr(e));
    } finally { sheetSyncing = false; showSheetStatus(); }
  }
  function applySheet(res, at) {
    const st = settings();
    const map = st.sheetMap = st.sheetMap || {}; // "לקוח|פרויקט בגיליון" -> project id on the site
    res.groups.forEach((g) => {
      const key = g.client + '|' + g.name;
      if (map[key] && byId(db.projects, map[key])) return;
      let p = FemySheet.matchProject(g.name, g.client, db.projects);
      if (!p) {
        p = { id: 'sh-p-' + FemySheet.hash(key), name: g.name, client: g.client, location: '', manager: '', status: 'active', progress: 0, start: '', end: '', budget: '', notes: 'נוצר מהגיליון "משימות פמי".' };
        if (!byId(db.projects, p.id)) db.projects.push(p);
      }
      map[key] = p.id;
    });

  // ---------- Per-task links: call whoever handles it, open its mail thread ----------
  const normName = (x) => String(x || '').replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
  function contactFor(name) {
    const n = normName(name); if (!n) return null;

    return list.find((c) => normName(c.name) === n) || list.find((c) => { const cn = normName(c.name); return cn && (cn.startsWith(n + ' ') || n.startsWith(cn + ' ')); }) || null;
  }

  function taskPerson(t) {
    // Not yourself: when you are the assignee, only the task's outside contact counts.

  function taskMailQuery(t, withPerson) {

    if (withPerson && who.email) parts.push(`{from:${who.email} to:${who.email} cc:${who.email}}`);

    const go = (url) => { if (win) win.location.href = url; else window.open(url, '_blank'); };
    const fallback = 'https://mail.google.com/mail/u/0/#search/' + encodeURIComponent(queries[0] || t.title);
    if (!GOOGLE || !G.valid()) { go(fallback); return; }

  // ---------- Project folder browser ----------
  // Browses a project's Drive folder like a file explorer: a folder opens in place, the breadcrumb goes back.
  // Lists live with the user's Google account when it is connected; otherwise through the sync server
  // (GET /data/folder, with the Google account already connected there), and as a last resort from the
  // folders and documents the protocols sync already knows.
  const driveFolderUrl = (id) => 'https://drive.google.com/drive/folders/' + encodeURIComponent(id);
  async function listDriveFolder(id) {
    if (GOOGLE && G.valid()) {
      try { const r = await G.drive.browse(id, {}); return { files: r.files, src: 'google' }; }
      catch (e) { if (!SYNC) throw e; }
    }
    if (SYNC) {
      try {
        const r = await fetch(SYNC + '/data/folder?id=' + encodeURIComponent(id), { cache: 'no-store' });
        if (r.ok) { const j = await r.json(); return { files: j.files || [], name: j.name || '', src: 'server' }; }
      } catch (e) { /* fall back to the cache */ }
    }
    return cachedDriveFolder(id);
  }
  function cachedDriveFolder(id) {
    const folders = Object.assign({}, (dprot.base && dprot.base.folders) || {}, dprot.folders);
    const files = Object.keys(folders).filter((k) => folders[k][0] === id && folders[k][1])
      .map((k) => ({ id: k, name: folders[k][1], folder: true }))
      .sort((a, b) => a.name.localeCompare(b.name, 'he'));
    // The documents of this folder: those whose folder path under their project folder leads here.
    const names = []; let at = id; let top = '';
    for (let g = 0; at && g < 30; g++) {
      if (db.projects.some((x) => x.driveFolder === at)) { top = at; break; }
      if (!folders[at]) break;
      names.unshift(folders[at][1]); at = folders[at][0];
    }
    if (top) {
      const want = names.join(' / ');
      dprot.items.filter((it) => it.projectFolder === top && (it.folder || '') === want)
        .forEach((it) => it.files.forEach((f) => files.push({ id: f.id, name: f.name, webViewLink: dpUrl(f), modifiedTime: it.modified || it.date || '' })));
    }
    if (!files.length && !top) throw new Error('התיקייה עוד לא סונכרנה');
    return { files, src: 'cache' };
  }
  // Every folder and file under a project folder, collected once (folder by folder) for the search box,
  // and kept for 10 minutes.
  const pdIndex = {};
  function projDriveIndex(p, onProgress) {
    const c = pdIndex[p.driveFolder];
    if (c && (c.running || Date.now() - c.at < 10 * 60 * 1000)) { if (onProgress) c.listeners.push(onProgress); return c.promise; }
    const ix = pdIndex[p.driveFolder] = { at: 0, running: true, items: [], partial: false, listeners: onProgress ? [onProgress] : [] };
    ix.promise = (async () => {
      const queue = [{ id: p.driveFolder, path: [] }]; let seen = 0;
      const worker = async () => {
        while (queue.length) {
          const d = queue.shift();
          if (++seen > 600) { ix.partial = true; queue.length = 0; return; }
          let res; try { res = await listDriveFolder(d.id); } catch (e) { ix.partial = true; continue; }
          if (res.src === 'cache') ix.partial = true;
          res.files.forEach((f) => {
            ix.items.push({ f, path: d.path });
            if (f.folder) queue.push({ id: f.id, path: d.path.concat([{ id: f.id, name: f.name }]) });
          });
          ix.listeners.forEach((fn) => fn(ix));
        }
      };
      // A few folders at a time; a worker that finds the queue empty waits for the others to add to it.
      const run = async () => { await worker(); };
      let active = [];
      do { active = Array.from({ length: Math.min(6, Math.max(1, queue.length)) }, run); await Promise.all(active); } while (queue.length);
      ix.running = false; ix.at = Date.now();
      return ix;
    })();
    return ix.promise;
  }
  function renderProjDriveSearch(p, box) {
    const st = ui.projDrive; const q = st.q; const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    const rootName = folderNames[p.driveFolder] || p.name;
    const copyBtn = (attr) => `<button type="button" class="g-copy" ${attr} title="העתקת הנתיב במחשב (Google Drive למחשב), להדבקה בסייר הקבצים עם Ctrl+L">📋</button>`;
    const alive = () => document.body.contains(box) && ui.projDrive === st && st.q === q;
    const draw = (ix) => {
      if (!alive()) return;
      const hits = ix.items.filter((it) => { const n = it.f.name.toLowerCase(); return words.every((w) => n.includes(w)); })
        .sort((a, b) => (b.f.folder ? 1 : 0) - (a.f.folder ? 1 : 0) || a.path.length - b.path.length);
      const shown = hits.slice(0, 200);
      const where = (it) => `<div class="pd-where">${esc([rootName].concat(it.path.map((c) => c.name)).join(' › '))}</div>`;
      const fileUrl = (f) => f.webViewLink || ('https://drive.google.com/file/d/' + encodeURIComponent(f.id) + '/view');
      box.innerHTML = `<div class="g-crumbs pd-crumbs"><b>תוצאות חיפוש: "${esc(q)}"</b><span style="flex:1"></span><button type="button" class="g-copy" data-clear>✕ ניקוי החיפוש</button></div>
        <div class="pd-list">${shown.map((it, i) => (it.f.folder
          ? `<div class="g-file pd-dir" data-i="${i}"><span>📁</span><div class="pd-name"><a href="#" data-dir="${i}" title="פתיחת התיקייה">${esc(it.f.name)}</a>${where(it)}</div>${copyBtn(`data-copy="${i}"`)}</div>`
          : `<div class="g-file">${it.f.iconLink ? `<img src="${esc(it.f.iconLink)}" alt="">` : '<span>📄</span>'}<div class="pd-name"><a href="${esc(fileUrl(it.f))}" target="_blank" rel="noopener" title="פתיחה ב-Google Drive">${esc(it.f.name)}</a>${where(it)}</div>${copyBtn(`data-copy="${i}"`)}</div>`)).join('')
          || `<div class="hint" style="padding:8px 0">${ix.running ? 'מחפש...' : 'לא נמצא קובץ או תיקייה בשם הזה'}</div>`}</div>
        <div class="hint" style="padding-top:8px">${hits.length} תוצאות${hits.length > shown.length ? ` (מוצגות ${shown.length})` : ''}${ix.running ? ` · סורק תיקיות... (${ix.items.length} פריטים עד עכשיו)` : ''}${!ix.running && ix.partial ? ' · ייתכן שחלק מהתיקיות לא נסרקו' : ''}</div>`;
      const pick = (i) => shown[Number(i)];
      $('[data-clear]', box).addEventListener('click', () => { st.q = ''; const inp = $('#pdq'); if (inp) inp.value = ''; renderProjDrive(p, box); });
      const openDir = (it) => { st.q = ''; const inp = $('#pdq'); if (inp) inp.value = ''; st.path = it.path.concat([{ id: it.f.id, name: it.f.name }]); renderProjDrive(p, box); };
      $$('[data-dir]', box).forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); openDir(pick(a.dataset.dir)); }));
      $$('.pd-dir', box).forEach((r) => r.addEventListener('click', (e) => { if (e.target.closest('a,button')) return; openDir(pick(r.dataset.i)); }));
      $$('[data-copy]', box).forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); const it = pick(b.dataset.copy); copyProjectPath(p, it.path.map((c) => c.name).concat([it.f.name])); }));
    };
    box.innerHTML = '<div class="hint" style="padding:8px 0">מחפש...</div>';
    let last = 0;
    projDriveIndex(p, (ix) => { if (Date.now() - last > 300) { last = Date.now(); draw(ix); } }).then(draw).catch((e) => {
      if (alive()) box.innerHTML = `<div class="hint" style="padding:8px 0">החיפוש נכשל (${esc(gErr(e))})</div>`;
    });
  }
  function renderProjDrive(p, box) {
    if (ui.projDrive.q) { renderProjDriveSearch(p, box); return; }
    const st = ui.projDrive; const path = st.path;
    const here = path.length ? path[path.length - 1].id : p.driveFolder;
    const rootName = folderNames[p.driveFolder] || p.name;
    const crumbs = [{ name: rootName }].concat(path);
    const names = path.map((c) => c.name);
    const copyBtn = (attr, label) => `<button type="button" class="g-copy" ${attr} title="העתקת הנתיב במחשב (Google Drive למחשב), להדבקה בסייר הקבצים עם Ctrl+L">📋${label ? ' ' + label : ''}</button>`;
    const head = `<div class="g-crumbs pd-crumbs">${path.length ? '<button type="button" class="g-copy" data-up title="חזרה לתיקייה הקודמת">⬆</button>' : ''}
      ${crumbs.map((c, i) => (i === crumbs.length - 1 ? `<b>${i ? '' : '📁 '}${esc(c.name)}</b>` : `<a href="#" data-crumb="${i}">${i ? '' : '📁 '}${esc(c.name)}</a>`)).join(' <span class="hint">›</span> ')}
      <span style="flex:1"></span><a class="g-copy" href="${esc(driveFolderUrl(here))}" target="_blank" rel="noopener" title="פתיחת התיקייה ב-Google Drive">פתח ב-Drive ↗</a>${copyBtn('data-copyhere', 'העתק נתיב')}</div>`;
    box.innerHTML = head + '<div class="hint" style="padding:8px 0">טוען...</div>';
    const alive = () => document.body.contains(box) && ui.projDrive === st && st.path === path;
    const go = (np) => { st.path = np; renderProjDrive(p, box); };
    const open = (f) => go(path.concat([{ id: f.id, name: f.name }]));
    const bindHead = () => {
      $$('[data-crumb]', box).forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); go(path.slice(0, Number(a.dataset.crumb))); }));
      const up = $('[data-up]', box); if (up) up.addEventListener('click', () => go(path.slice(0, -1)));
      $('[data-copyhere]', box).addEventListener('click', () => copyProjectPath(p, names));
    };
    bindHead();
    listDriveFolder(here).then((res) => {
      if (!alive()) return;
      if (!path.length && res.name && res.name !== rootName) { folderNames[p.driveFolder] = res.name; renderProjDrive(p, box); return; }
      const when = (f) => (f.modifiedTime ? `<small>${esc(new Date(f.modifiedTime).toLocaleDateString('he-IL'))}</small>` : '');
      const fileUrl = (f) => f.webViewLink || ('https://drive.google.com/file/d/' + encodeURIComponent(f.id) + '/view');
      const rows = res.files.map((f, i) => (f.folder
        ? `<div class="g-file pd-dir" data-i="${i}"><span>📁</span><a href="#" data-dir="${i}" title="פתיחת התיקייה">${esc(f.name)}</a>${when(f)}${copyBtn(`data-copy="${i}"`)}</div>`
        : `<div class="g-file">${f.iconLink ? `<img src="${esc(f.iconLink)}" alt="">` : '<span>📄</span>'}<a href="${esc(fileUrl(f))}" target="_blank" rel="noopener" title="פתיחה ב-Google Drive">${esc(f.name)}</a>${when(f)}${copyBtn(`data-copy="${i}"`)}</div>`)).join('');
      const nf = res.files.filter((f) => f.folder).length;
      box.innerHTML = head + `<div class="pd-list">${rows || '<div class="hint" style="padding:8px 0">התיקייה ריקה</div>'}</div>`
        + `<div class="hint" style="padding-top:8px">${nf} תיקיות · ${res.files.length - nf} קבצים${res.src === 'cache' ? ' · מהסנכרון האחרון, רק תיקיות וסיכומים שכבר זוהו. לרשימה המלאה חברו את חשבון ה-Google בלשונית <a href="#google">יומן, מייל ו-Drive</a>' : ''}</div>`;
      bindHead();
      $$('[data-dir]', box).forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); open(res.files[Number(a.dataset.dir)]); }));
      $$('.pd-dir', box).forEach((r) => r.addEventListener('click', (e) => { if (e.target.closest('a,button')) return; open(res.files[Number(r.dataset.i)]); }));
      $$('[data-copy]', box).forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); copyProjectPath(p, names.concat([res.files[Number(b.dataset.copy)].name])); }));
    }).catch((e) => {
      if (!alive()) return;
      box.innerHTML = head + `<div class="hint" style="padding:8px 0">לא ניתן לטעון את התיקייה (${esc(gErr(e))}). אפשר לפתוח אותה ב-Drive או להעתיק את הנתיב.</div>`;
      bindHead();
    });
  }

  // Projects collected from the company's Drive folder ("פרויקטים פמי"), in projects/drive-projects.json.
  // Added once per version of that file; a project already in the system (same id or name) is left as is,
  // so edits made on the site are never overwritten. manual: the button on the projects page.
  async function importDriveProjects(manual) {
    if (!isAdmin()) return;
    let data;
    try { data = await (await fetch('projects/drive-projects.json', { cache: 'no-cache' })).json(); }
    catch (e) { if (manual) toast('טעינת רשימת הפרויקטים מה-Drive נכשלה'); return; }
    if (!data || !Array.isArray(data.projects)) return;
    if (!manual && settings().driveImport === data.version) return;
    if (db.demo) db = emptyDb(); // replace the sample data with the real projects
    const norm = (x) => (x || '').replace(/\s+/g, ' ').trim();
    const ids = new Set(db.projects.map((p) => p.id));
    const names = new Set(db.projects.map((p) => norm(p.name)));
    let n = 0;
    const added = {};
    data.projects.forEach((p) => {
      if (ids.has(p.id) || names.has(norm(p.name))) return;
      db.projects.push(Object.assign({}, p)); added[p.id] = 1; n++;
    });
    // Open action items and recent meeting summaries, only for projects added now.
    let nt = 0;
    [['tasks', data.tasks], ['protocols', data.protocols]].forEach(([col, list]) => (list || []).forEach((x) => {
      if (!added[x.projectId] || db[col].some((y) => y.id === x.id)) return;
      db[col].push(Object.assign({}, x)); if (col === 'tasks') nt++;
    }));
    settings().driveImport = data.version;
    save(); render();
    if (n) toast(`נוספו ${n} פרויקטים ו-${nt} משימות מתיקיית פרויקטים פמי ב-Drive`);
    else if (manual) toast('כל הפרויקטים מה-Drive כבר נמצאים במערכת');
  }

  function openProjectForm(proj) {
    const p = proj || { name: '', client: '', location: '', manager: '', status: 'planning', progress: 0, start: todayStr(), end: '', budget: '', notes: '' };
    openModal(proj ? 'עריכת פרויקט' : 'פרויקט חדש', `
      <div class="field full"><label>שם הפרויקט *</label><input class="input" name="name" required value="${esc(p.name)}"></div>
      <div class="field"><label>לקוח</label><input class="input" name="client" value="${esc(p.client)}"></div>
      <div class="field"><label>מיקום</label><input class="input" name="location" value="${esc(p.location)}"></div>
      <div class="field"><label>מנהל פרויקט</label><input class="input" name="manager" value="${esc(p.manager)}"></div>
      <div class="field"><label>סטטוס</label><select class="input" name="status">${dictOptions(PROJECT_STATUS, p.status)}</select></div>
      <div class="field"><label>תאריך התחלה</label><input class="input" type="date" name="start" value="${esc(p.start)}"></div>
      <div class="field"><label>תאריך סיום מתוכנן</label><input class="input" type="date" name="end" value="${esc(p.end)}"></div>
      <div class="field"><label>תקציב (₪, לפני מע״מ)</label><input class="input" type="number" min="0" name="budget" value="${esc(p.budget)}"></div>
      <div class="field"><label>התקדמות: <output id="progOut">${p.progress || 0}</output>%</label><input type="range" min="0" max="100" step="5" name="progress" value="${p.progress || 0}" oninput="document.getElementById('progOut').textContent=this.value"></div>
      <div class="field full"><label>קישור לתיקיית הפרויקט ב-Google Drive</label><input class="input" name="driveFolder" dir="ltr" placeholder="https://drive.google.com/drive/folders/..." value="${p.driveFolder ? esc(driveUrl(p)) : ''}"></div>
      <div class="field full"><label>הערות / סיכום מצב</label><textarea class="input" name="notes">${esc(p.notes)}</textarea></div>`,
    (data) => {
      data.progress = Number(data.progress) || 0; data.budget = data.budget === '' ? '' : Number(data.budget);

      data.driveFolder = fm ? fm[1] : '';
      if (proj) Object.assign(proj, data); else db.projects.push(Object.assign({ id: uid() }, data));
      save(); render(); toast(proj ? 'הפרויקט עודכן' : 'הפרויקט נוסף');
    },
    proj ? () => {
      db.projects = db.projects.filter((x) => x !== proj);
      [db.tasks, db.invoices, db.protocols].forEach((arr) => arr.forEach((x) => { if (x.projectId === proj.id) x.projectId = ''; }));
      save(); toast('הפרויקט נמחק');
      if (currentView() === 'project') location.hash = 'projects'; else render();
    } : null, 'המשימות, החשבונות והפרוטוקולים של הפרויקט יישארו, בלי שיוך לפרויקט.');
  }

  // ---------- Accounts ----------
  // Two tabs: consultant ledgers per project (from the office's Excel sheets) and single invoices.

          <td class="actions">${i.status === 'sent' ? '<button class="btn sm" data-paid>סמן כשולם</button> ' : ''}<button class="icon-btn" data-edit title="עריכה">✏️</button></td></tr>`;
      }).join('') || '<tr><td colspan="10" class="empty">לא נמצאו חשבונות</td></tr>'}</tbody>
      ${list.length ? `<tfoot><tr><td colspan="5">סה״כ מאזן בתצוגה (הכנסות פחות הוצאות)</td><td class="num">${fmtMoney(total)}</td><td colspan="4"></td></tr></tfoot>` : ''}

  function openInvoiceForm(inv) {

      <div class="field full"><label>הערות</label><textarea class="input" name="notes">${esc(i.notes)}</textarea></div>`,
    (data) => {
      data.amount = Number(data.amount) || 0;
      if (inv) Object.assign(inv, data); else db.invoices.push(Object.assign({ id: uid() }, data));
      save(); render(); toast(inv ? 'החשבון עודכן' : 'החשבון נוסף');
    },
    inv ? () => { db.invoices = db.invoices.filter((x) => x !== inv); save(); render(); toast('החשבון נמחק'); } : null);

  function exportInvoicesCsv() {
    const rows = [['מספר', 'סוג', 'לקוח/ספק', 'פרויקט', 'סכום לפני מעמ', 'סהכ', 'תאריך הפקה', 'לתשלום עד', 'סטטוס', 'הערות']];
    filteredInvoices().forEach((i) => {
      const p = byId(db.projects, i.projectId);
      rows.push([i.number, byId(INVOICE_TYPE, i.type).short, i.party, p ? p.name : '', i.amount, invTotal(i).toFixed(2), fmtDate(i.issueDate), fmtDate(i.dueDate), byId(INVOICE_STATUS, invoiceStatus(i)).label, i.notes || '']);
    });
    const csv = '﻿' + rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    download('חשבונות-' + todayStr() + '.csv', csv, 'text/csv;charset=utf-8');
  }

  // ---------- Consultant ledgers (חשבונות יועצים) ----------
  // Each project can hold project.ledger, read from the office's "חשבונות ..." Excel sheet:
  // { file, fileDate, title, rows: [{ group, field, name, service, total, payments: [{ amount, billed }], person, phone, email }], deposits }
  // Amounts include VAT. A payment with billed: true was submitted but not paid yet.
  // accounts/consultant-accounts.json holds the sheets already collected from Drive; importLedgers adds them once per version.
  const ledPayments = (r) => (r.payments || []).filter((x) => x && Number(x.amount));
  const ledPaid = (r) => ledPayments(r).filter((x) => !x.billed).reduce((s, x) => s + Number(x.amount), 0);
  const ledBilled = (r) => ledPayments(r).filter((x) => x.billed).reduce((s, x) => s + Number(x.amount), 0);
  function ledSum(rows) {
    const o = { total: 0, paid: 0, billed: 0 };
    rows.forEach((r) => { o.total += Number(r.total) || 0; o.paid += ledPaid(r); o.billed += ledBilled(r); });
    o.left = Math.max(0, o.total - o.paid);
    o.pct = o.total ? Math.min(100, Math.round((o.paid / o.total) * 100)) : 0;
    return o;
  }
  const ledProjects = () => db.projects.filter((p) => p.ledger && Array.isArray(p.ledger.rows));
  // Category names as the office reads them: consultants, additional costs, paid directly by the developer.
  const ledGroupLabel = (g) => (!g || /יועצ/.test(g) ? 'עלות יועצים' : /נוספ/.test(g) ? 'עלויות נוספות' : g);

  async function importLedgers(manual) {
    if (!isAdmin()) return;
    let data;
    try { data = await (await fetch('accounts/consultant-accounts.json', { cache: 'no-cache' })).json(); }
    catch (e) { if (manual) toast('טעינת חשבונות היועצים נכשלה'); return; }
    if (!data || !Array.isArray(data.ledgers)) return;
    if (!manual && settings().ledgerImport === data.version) return;
    const norm = (x) => (x || '').replace(/\s+/g, ' ').trim();
    let n = 0;
    data.ledgers.forEach((l) => {
      const p = byId(db.projects, l.projectId) || db.projects.find((x) => norm(x.name) === norm(l.projectName));
      if (!p) return;
      if (p.ledger && (p.ledger.edited || p.ledger.seed === data.version)) return;
      const led = Object.assign({}, l, { seed: data.version });
      delete led.projectId; delete led.projectName;
      p.ledger = led; n++;
    });
    settings().ledgerImport = data.version;
    save();
    if (n) { render(); toast(`נוספו חשבונות יועצים ל-${n} פרויקטים`); }
    else if (manual) toast('חשבונות היועצים כבר מעודכנים');
  }

  function ledgerCardHtml(p, q) {
    const L = p.ledger; const s = ledSum(L.rows);
    const open = !!(ui.ledOpen || {})[p.id] || (!!q && L.rows.some((r) => [r.field, r.name, r.service, r.person, r.group].join(' ').toLowerCase().includes(q)));
    const match = (r) => !q || [r.field, r.name, r.service, r.person, r.group].join(' ').toLowerCase().includes(q);
    const rows = L.rows.map((r, i) => ({ r, i })).filter((x) => match(x.r));
    const groups = [];
    rows.forEach((x) => { const g = ledGroupLabel(x.r.group); let gr = groups.find((y) => y.g === g); if (!gr) groups.push(gr = { g, items: [] }); gr.items.push(x); });
    const chips = (r) => (r.payments || []).map((x, k) => (x && Number(x.amount) ? `<span class="lchip ${x.billed ? 'billed' : 'paid'}" title="${x.billed ? 'הוגש, טרם שולם' : 'שולם'}">${k + 1} · ${fmtMoney(x.amount)}</span>` : '')).join('');
    // Each consultant is one main line; clicking it opens its bills, contact details and edit button.
    const rowHtml = ({ r, i }) => {
      const paid = ledPaid(r); const billed = ledBilled(r); const total = Number(r.total) || 0;

      const key = p.id + '/' + i; const ro = !!(ui.ledRowOpen || {})[key];

        r.email ? '✉️ ' + r.email.split(/[,\s]+/).filter(Boolean).map((m) => `<a href="mailto:${esc(m)}">${esc(m)}</a>`).join(', ') : ''].filter(Boolean).join(' · ');
      return `<tr data-row="${i}" class="lmain ${ro ? 'open' : ''}">
        <td><span class="larrow">${ro ? '▾' : '◂'}</span> ${esc(r.field || r.service || '')}</td>

        ${ro ? `<tr class="ldetail" data-row="${i}"><td colspan="7">
          ${r.service && r.field ? `<div class="hint" style="margin-bottom:6px">סוג השירות: ${esc(r.service)}</div>` : ''}
          <div class="lchips">${chips(r) || '<span class="hint">עדיין אין חשבונות</span>'}</div>
          ${billed ? `<div class="hint" style="margin-top:6px">שולם ${fmtMoney(paid)} · הוגש וממתין ${fmtMoney(billed)}</div>` : ''}
          ${contact ? `<div class="led-contact">${contact}</div>` : ''}
          <div style="margin-top:8px"><button class="btn sm" data-ledit>✏️ עריכה</button></div>
        </td></tr>` : ''}`;
    };
    const dep = (L.deposits || []).filter((d) => Number(d.amount));
    const depTotal = dep.reduce((a, d) => a + Number(d.amount), 0);
    // Collapsed: one summary line per project; the button opens the full table.
    if (!open) {
      return `<div class="card ledger led-line" data-pid="${esc(p.id)}">
        <a class="ov-name led-name" href="${projectHref(p)}">${esc(p.name)}</a>
        <span class="led-c"><small>עלות כוללת</small><strong>${fmtMoney(s.total)}</strong></span>

              <td class="num">${fmtMoney(gs.left)}</td>
              <td><div style="display:flex;gap:6px;align-items:center"><div class="progress ${gs.pct >= 100 ? 'done' : ''}" style="flex:1"><span style="width:${gs.pct}%"></span></div><span class="hint">${gs.pct}%</span></div></td>

        <tfoot><tr><td colspan="2">סה״כ</td><td class="num">${fmtMoney(s.total)}</td><td class="num">${fmtMoney(s.paid)}${s.billed ? `<div class="hint" style="color:var(--amber)">+ ${fmtMoney(s.billed)} ממתין</div>` : ''}</td><td class="num">${fmtMoney(s.left)}</td><td><span class="hint">${s.pct}%</span></td><td></td></tr></tfoot>

  }

  function bindLedgerCards(box) {
    $$('.ledger', box).forEach((card) => {
      const p = byId(db.projects, card.dataset.pid);
      if (!p) return;
      $('[data-ltoggle]', card).addEventListener('click', () => { ui.ledOpen = ui.ledOpen || {}; ui.ledOpen[p.id] = !ui.ledOpen[p.id]; render(); });
      if (card.classList.contains('led-line')) {
        card.addEventListener('click', (e) => { if (!e.target.closest('a, button')) $('[data-ltoggle]', card).click(); });
        return;
      }
      $('[data-lreimport]', card).addEventListener('click', () => openLedgerImport(p.id));
      $('[data-ladd]', card).addEventListener('click', () => openLedgerRowForm(p, -1));
      $$('tr.lgroup', card).forEach((tr) => tr.addEventListener('click', () => {
        ui.ledGrpOpen = ui.ledGrpOpen || {}; ui.ledGrpOpen[tr.dataset.gk] = !ui.ledGrpOpen[tr.dataset.gk]; render();
      }));
      $$('tr.lmain', card).forEach((tr) => tr.addEventListener('click', (e) => {
        if (e.target.closest('a, button')) return;
        const key = p.id + '/' + tr.dataset.row; ui.ledRowOpen = ui.ledRowOpen || {}; ui.ledRowOpen[key] = !ui.ledRowOpen[key]; render();
      }));
      $$('tr.ldetail [data-ledit]', card).forEach((b) => b.addEventListener('click', () => openLedgerRowForm(p, Number(b.closest('tr').dataset.row))));
    });
  }

  function openLedgerRowForm(p, idx) {
    const L = p.ledger;
    const r = idx >= 0 ? L.rows[idx] : { group: (L.rows[0] && L.rows[0].group) || '', field: '', name: '', total: '', payments: [] };
    const pays = (r.payments || []).filter((x) => x && Number(x.amount));
    const slots = Math.max(4, pays.length + 2);
    const groups = Array.from(new Set(L.rows.map((x) => x.group || '')));
    openModal(idx >= 0 ? 'עריכת שורת יועץ' : 'יועץ / תשלום חדש', `
      <div class="field"><label>תחום</label><input class="input" name="field" value="${esc(r.field)}"></div>
      <div class="field"><label>יועץ / ספק</label><input class="input" name="name" value="${esc(r.name)}"></div>
      <div class="field"><label>סוג השירות</label><input class="input" name="service" value="${esc(r.service || '')}"></div>
      <div class="field"><label>קבוצה</label><input class="input" name="group" list="ledGroups" value="${esc(r.group || '')}" placeholder="${esc(ledGroupLabel(''))}"><datalist id="ledGroups">${groups.filter(Boolean).map((g) => `<option value="${esc(g)}">`).join('')}</datalist></div>
      <div class="field"><label>עלות תכנון כוללת, כולל מע״מ (₪)</label><input class="input" type="number" step="0.01" min="0" name="total" value="${r.total == null ? '' : esc(r.total)}"></div>
      <div class="field"><label>איש קשר</label><input class="input" name="person" value="${esc(r.person || '')}"></div>
      <div class="field"><label>טלפון</label><input class="input" name="phone" dir="ltr" value="${esc(r.phone || '')}"></div>
      <div class="field"><label>מייל</label><input class="input" name="email" dir="ltr" value="${esc(r.email || '')}"></div>
      <div class="field full"><label>חשבונות (סכום כולל מע״מ)</label>
        <div class="led-pays">${Array.from({ length: slots }, (_, k) => { const x = pays[k] || {}; return `<div><span class="hint">חשבון ${k + 1}</span><input class="input" type="number" step="0.01" min="0" name="pay${k}" value="${x.amount ? esc(x.amount) : ''}"><label class="hint"><input type="checkbox" name="billed${k}" ${x.billed ? 'checked' : ''}> הוגש, טרם שולם</label></div>`; }).join('')}</div></div>`,
    (data) => {
      const out = Object.assign({}, idx >= 0 ? r : {}, { group: data.group, field: data.field, name: data.name, total: data.total === '' ? null : Number(data.total), payments: [] });
      ['service', 'person', 'phone', 'email'].forEach((k) => { if (data[k]) out[k] = data[k]; else delete out[k]; });
      for (let k = 0; k < slots; k++) { const a = Number(data['pay' + k]); if (a) out.payments.push(data['billed' + k] ? { amount: a, billed: true } : { amount: a }); }
      if (idx >= 0) L.rows[idx] = out; else L.rows.push(out);
      L.edited = true; save(); render(); toast(idx >= 0 ? 'השורה עודכנה' : 'השורה נוספה');
    },
    idx >= 0 ? () => { L.rows.splice(idx, 1); L.edited = true; save(); render(); toast('השורה נמחקה'); } : null);
  }

  // Picks the project whose name shares the most words with the file name ("חשבונות שמידמן.xlsx" -> שמידמן 3).
  function guessLedgerProject(fileName) {
    const f = fileName.replace(/\.[^.]+$/, '').replace(/[_\-.]+/g, ' ');
    let best = null; let score = 0;
    db.projects.forEach((p) => {
      const n = (p.name || '').split(/[\s\-–,()]+/).filter((w) => w.length >= 3 && !/^(בית|ספר|בתי|מתחם|פרויקט)$/.test(w)).filter((w) => f.includes(w)).length;
      if (n > score) { score = n; best = p; }
    });
    return best;
  }

  function openLedgerImport(projectId) {
    const p0 = projectId ? byId(db.projects, projectId) : null;
    openModal('ייבוא חשבונות יועצים מאקסל', `
      <div class="field full"><label>קובץ אקסל (xlsx) *</label><input class="input" type="file" id="ledFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required></div>
      <div class="field full"><label>פרויקט *</label><select class="input" name="projectId" id="ledProj" required>${projectOptions(projectId || '', 'בחירת פרויקט')}</select></div>
      <div class="field full hint">הקובץ צריך להיות בתבנית החשבונות של המשרד: שורת כותרות עם "עלות תכנון" ו"חשבון 1", "חשבון 2"... ושורה לכל יועץ. חשבונות שצבועים בצבע "הוגש חשבון" יסומנו כממתינים לתשלום.${p0 && p0.ledger ? ' <strong>החשבונות הקיימים של הפרויקט יוחלפו בנתונים מהקובץ.</strong>' : ''}</div>
      <div class="field full" id="ledPreview"></div>`,
    (data) => { if (pendingLedger && data.projectId) applyLedgerImport(data.projectId, pendingLedger); else toast('הקובץ לא נקרא, החשבונות לא עודכנו'); });
    let pendingLedger = null;
    const fileInp = $('#ledFile');
    fileInp.addEventListener('change', async () => {
      const f = fileInp.files[0]; const pv = $('#ledPreview');
      pendingLedger = null; if (!f) { pv.innerHTML = ''; return; }
      pv.innerHTML = '<span class="hint">קורא את הקובץ...</span>';
      try {
        const JSZip = await loadJSZip();
        const led = await window.FemyLedger.ledgerFromXlsx(await f.arrayBuffer(), JSZip);
        led.file = f.name; led.fileDate = f.lastModified ? toISO(new Date(f.lastModified)) : todayStr();
        pendingLedger = led;
        const s = ledSum(led.rows);
        pv.innerHTML = `<div class="led-preview">נמצאו <strong>${led.rows.length}</strong> שורות · עלות כוללת ${fmtMoney(s.total)} · שולם ${fmtMoney(s.paid)}${s.billed ? ' · הוגש וממתין ' + fmtMoney(s.billed) : ''}${led.deposits.length ? ' · ' + led.deposits.length + ' הפקדות יזם' : ''}</div>`;
        const sel = $('#ledProj');
        if (!sel.value) { const g = guessLedgerProject(f.name); if (g) sel.value = g.id; }
      } catch (e) {
        pv.innerHTML = `<div class="led-preview err">לא הצלחתי לקרוא את הקובץ: ${esc(e.message || e)}</div>`;
      }
    });
  }
  function applyLedgerImport(projectId, led) {
    const p = byId(db.projects, projectId);
    if (!p) return;
    p.ledger = Object.assign({}, led, { importedAt: new Date().toISOString() });
    ui.accTab = 'ledgers'; ui.ledClient = '';
    save(); render(); toast(`נטענו ${led.rows.length} שורות חשבונות לפרויקט ${p.name}`);
  }

  function exportLedgersCsv(list) {
    const rows = [['לקוח', 'פרויקט', 'קבוצה', 'תחום', 'יועץ / ספק', 'עלות כולל מעמ', 'חשבון 1', 'חשבון 2', 'חשבון 3', 'חשבון 4', 'חשבון 5', 'שולם', 'הוגש וממתין', 'יתרה', 'אחוז ששולם']];
    list.forEach((p) => p.ledger.rows.forEach((r) => {
      const pays = (r.payments || []).map((x) => (x && Number(x.amount) ? x.amount + (x.billed ? ' (הוגש)' : '') : ''));
      const total = Number(r.total) || 0; const paid = ledPaid(r);
      rows.push([p.client || '', p.name, ledGroupLabel(r.group), r.field || r.service || '', r.name || '', r.total == null ? '' : total, pays[0] || '', pays[1] || '', pays[2] || '', pays[3] || '', pays[4] || '', paid, ledBilled(r), total ? Math.max(0, total - paid) : '', total ? Math.round((paid / total) * 100) + '%' : '']);

  }

  // ---------- Protocols ----------

  const PROTO_TPL_KEYS = Object.keys(PROTO_TPL);

  const protoTpl = (pr) => PROTO_TPL[pr && pr.template] || null;

  const protoNo = (pr) => (pr && (pr.template === 'supervision' || pr.template === 'meeting') && pr.reportNo ? String(pr.reportNo) : '');
