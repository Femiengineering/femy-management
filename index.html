<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>פמי הנדסה - ניהול</title>
  <meta name="description" content="מערכת ניהול ומעקב: משימות, פרויקטים, חשבונות ופרוטוקולים">
  <meta name="theme-color" content="#15253d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="פמי הנדסה">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e3e8ef;
  --text: #1c2533;
  --muted: #64748b;
  --primary: #1f5fae;
  --primary-soft: #e6effa;
  --sidebar: #15253d;
  --sidebar-text: #c9d5e6;
  --green: #1e8a5a;
  --green-soft: #e3f4ec;
  --amber: #b7791f;
  --amber-soft: #fdf3e1;
  --red: #c53b3b;
  --red-soft: #fbe9e9;
  --gray-soft: #eef1f5;
  --purple: #6b4fbb;
  --purple-soft: #efeafb;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Assistant", "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }

/* Layout */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 230px;
  background: var(--sidebar);
  color: var(--sidebar-text);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand-name { color: #fff; font-size: 20px; font-weight: 700; }
.brand-sub { font-size: 13px; opacity: .7; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 8px;
  color: var(--sidebar-text); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.active { background: var(--primary); color: #fff; }
.nav .ico { width: 20px; text-align: center; }
.nav .badge {
  margin-inline-start: auto; background: rgba(255,255,255,.15);
  border-radius: 10px; padding: 0 8px; font-size: 12px;
}
.sidebar-foot { padding: 14px 20px; font-size: 12px; opacity: .6; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 28px; display: flex; align-items: center; gap: 18px;
  z-index: 5;
}
.topbar h1 { font-size: 20px; margin: 0; flex: 1; }
.top-logo-link { display: flex; flex-shrink: 0; padding-inline-end: 18px; border-inline-end: 1px solid var(--border); }
.top-logo { height: 120px; width: auto; display: block; }
.menu-btn { display: none; background: none; border: 0; font-size: 22px; cursor: pointer; padding: 4px 8px; }
.content { padding: 24px 28px 48px; max-width: 1400px; width: 100%; }

/* Buttons */
.btn {
  border: 1px solid var(--border); background: var(--surface);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.icon-btn {
  background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 6px;
  color: var(--muted); font-size: 15px;
}
.icon-btn:hover { background: var(--gray-soft); color: var(--text); }

/* Cards & grid */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.card-pad { padding: 18px 20px; }
.card h2 { font-size: 16px; margin: 0 0 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-head h2 { margin: 0; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
.kpi { padding: 16px 18px; }
.kpi .label { color: var(--muted); font-size: 13px; font-weight: 600; }
.kpi .value { font-size: 28px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.kpi.warn .value { color: var(--red); }
.kpi.good .value { color: var(--green); }

.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-bottom: 18px; }
.grid-2 > * { min-width: 0; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar .spacer { flex: 1; }
.input, select.input, textarea.input {
  border: 1px solid var(--border); background: var(--surface);
  border-radius: 8px; padding: 8px 10px; min-width: 0;
}
.input:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
.search { width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--primary-soft); color: var(--primary); }

/* Pills */
.pill {
  display: inline-block; padding: 1px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.pill.gray { background: var(--gray-soft); color: #475569; }
.pill.blue { background: var(--primary-soft); color: var(--primary); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.purple { background: var(--purple-soft); color: var(--purple); }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 13px; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
tbody tr:hover { background: var(--surface-2); }
td.num, th.num { text-align: left; font-variant-numeric: tabular-nums; direction: ltr; }
td.actions { white-space: nowrap; text-align: left; width: 1%; }
tfoot td { font-weight: 700; background: var(--surface-2); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* Kanban */
.kanban { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.col { background: #eaeef3; border-radius: var(--radius); padding: 10px; min-height: 200px; display: flex; flex-direction: column; }
.col.drop { outline: 2px dashed var(--primary); background: var(--primary-soft); }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 10px; font-weight: 700; }
.col-head .count { color: var(--muted); font-weight: 600; font-size: 13px; }
.col-body { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.tcard {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; cursor: grab; box-shadow: var(--shadow);
  border-inline-start: 4px solid var(--border);
}
.tcard.dragging { opacity: .5; }
.tcard.p-urgent { border-inline-start-color: var(--red); }
.tcard.p-high { border-inline-start-color: var(--amber); }
.tcard.p-medium { border-inline-start-color: var(--primary); }
.tcard.p-low { border-inline-start-color: #94a3b8; }
.tcard .t-title { font-weight: 600; margin-bottom: 6px; }
.tcard .t-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.overdue { color: var(--red) !important; font-weight: 700; }

/* Projects */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.proj { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.proj-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.proj-name { font-size: 17px; font-weight: 700; }
.proj-client { color: var(--muted); font-size: 13.5px; }
.proj dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13.5px; }
.proj dt { color: var(--muted); }
.proj dd { margin: 0; }
.progress { height: 8px; background: var(--gray-soft); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.progress.done > span { background: var(--green); }
.proj-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; font-size: 13px; color: var(--muted); }

/* Lists in dashboard */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .meta { font-size: 12.5px; color: var(--muted); }

.prog-row { display: grid; grid-template-columns: 1fr 2fr 44px; gap: 10px; align-items: center; padding: 7px 0; font-size: 14px; }
.prog-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-row .pct { text-align: left; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Bar chart */
.chart { display: flex; align-items: flex-end; gap: 14px; height: 180px; padding: 10px 4px 0; border-bottom: 1px solid var(--border); }
.chart .m { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.chart .bars { display: flex; gap: 3px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
.chart .bar { width: 40%; max-width: 22px; border-radius: 4px 4px 0 0; min-height: 2px; }
.chart .bar.in { background: var(--primary); }
.chart .bar.out { background: #e0a43a; }
.chart-labels { display: flex; gap: 14px; padding: 6px 4px 0; }
.chart-labels span { flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: middle; }

/* Protocols */
.proto { margin-bottom: 12px; }
.proto-head { display: flex; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; }
.proto-date { background: var(--primary-soft); color: var(--primary); border-radius: 8px; padding: 6px 10px; text-align: center; min-width: 64px; font-weight: 700; line-height: 1.2; }
.proto-date small { display: block; font-weight: 500; font-size: 11.5px; }
.proto-title { font-weight: 700; }
.proto-sub { font-size: 13px; color: var(--muted); }
.proto-body { padding: 0 18px 16px; border-top: 1px solid var(--border); display: none; }
.proto.open .proto-body { display: block; }
.proto-body h4 { margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
.proto-body p { margin: 0; white-space: pre-wrap; }
.proto-body ul { margin: 0; padding-inline-start: 20px; }
.chev { transition: transform .15s; color: var(--muted); }
.proto.open .chev { transform: rotate(-90deg); }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.summary .card { padding: 12px 16px; }
.summary .label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.summary .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
  display: none; align-items: flex-start; justify-content: center; z-index: 50;
  padding: 40px 16px; overflow-y: auto;
}
.modal-bg.show { display: flex; }
.modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 620px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-head h3 { margin: 0; font-size: 18px; }
.modal-body { padding: 18px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-start; }
.modal-foot .spacer { flex: 1; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field textarea { min-height: 80px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1c2533; color: #fff; padding: 10px 18px; border-radius: 8px;
  opacity: 0; transition: all .2s; z-index: 60; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.settings p { color: var(--muted); margin-top: 0; }
.settings .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.settings select.input { max-width: 100%; min-width: 0; width: 100%; }

.overlay { display: none; }

/* Responsive */
@media (max-width: 1000px) {
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 800px) {
  .sidebar {
    position: fixed; inset-inline-start: 0; top: 0; z-index: 40;
    transform: translateX(100%); transition: transform .2s;
  }
  .sidebar.open { transform: translateX(0); }
  .overlay.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
  .menu-btn { display: block; }
  .topbar { position: sticky; top: 0; }
  .topbar { padding: 10px 16px; gap: 10px; }
  .top-logo { height: 56px; }
  .top-logo-link { padding-inline-end: 10px; }
  .topbar h1 { font-size: 17px; }
  .content { padding: 16px 16px 40px; }
  .search { width: 100%; flex: 1 1 100%; }
  .kanban { grid-template-columns: repeat(4, 82vw); scroll-snap-type: x mandatory; }
  .col { scroll-snap-align: start; }
  .modal-body { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { padding: 12px 14px; }
  .kpi .value { font-size: 21px; }
  .kpi .sub { font-size: 12px; }
  .topbar .btn .lbl { display: none; }
}

@media print {
  .sidebar, .topbar, .toolbar, td.actions { display: none !important; }
  .content { padding: 0; }
}

/* Claude chat */
.ai-fab { position: fixed; left: 20px; bottom: 20px; z-index: 45; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.ai-panel { position: fixed; left: 20px; bottom: 88px; z-index: 46; width: 380px; max-width: calc(100vw - 32px); height: 540px; max-height: calc(100vh - 120px); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.25); display: none; flex-direction: column; overflow: hidden; }
.ai-panel.show { display: flex; }
.ai-head { background: var(--sidebar); color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 8px; }
.ai-head strong { flex: 1; }
.ai-head button { background: none; border: 0; color: #fff; cursor: pointer; font-size: 16px; opacity: .8; }
.ai-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.ai-msg { padding: 8px 12px; border-radius: 12px; max-width: 88%; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; }
.ai-msg.user { background: var(--primary); color: #fff; align-self: flex-start; }
.ai-msg.bot { background: var(--surface); border: 1px solid var(--border); align-self: flex-end; }
.ai-msg.note { background: var(--green-soft); color: var(--green); align-self: center; font-size: 12.5px; }
.ai-msg.err { background: var(--red-soft); color: var(--red); align-self: center; font-size: 13px; }
.ai-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
.ai-form textarea { flex: 1; resize: none; height: 42px; }
.ai-suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; background: var(--surface-2); }
.ai-suggest button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
@media (max-width: 800px) { .ai-fab { left: 16px; bottom: 16px; } .ai-panel { left: 16px; right: 16px; width: auto; bottom: 80px; height: calc(100vh - 110px); } }
@media print { .ai-fab, .ai-panel { display: none !important; } }

/* Sign-in and cloud */
.auth-gate { position: fixed; inset: 0; z-index: 100; background: var(--sidebar); display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
.auth-gate[hidden] { display: none; }
.auth-card { background: var(--surface); border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,.35); text-align: center; }
.auth-logo { max-width: 200px; width: 70%; margin: 0 auto 6px; display: block; }
.auth-card h2 { margin: 4px 0 18px; font-size: 18px; color: var(--muted); font-weight: 600; }
.auth-card p { color: var(--muted); font-size: 14.5px; line-height: 1.55; margin: 0 0 14px; }
.auth-card .input { width: 100%; margin-bottom: 10px; }
.auth-card .btn { width: 100%; justify-content: center; margin-bottom: 8px; min-height: 44px; }
.auth-or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 14px 0; }
.auth-or::before, .auth-or::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
.auth-links { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.auth-links button { background: none; border: 0; color: var(--primary); cursor: pointer; font: inherit; padding: 4px 0; }
.auth-err { color: var(--red); font-size: 13.5px; min-height: 18px; margin-bottom: 6px; }
.g-btn { background: #fff; border: 1px solid #c8cfd8; font-weight: 600; gap: 10px; }
.user-box { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 10px; }
.user-box img, .user-box .av { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.user-box .who { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
.user-box .who b { color: #fff; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-box .who span { opacity: .65; font-size: 12px; }
.user-box button { background: none; border: 1px solid rgba(255,255,255,.2); color: var(--sidebar-text); border-radius: 6px; padding: 4px 8px; cursor: pointer; font: inherit; font-size: 12px; }
.member-list { list-style: none; padding: 0; margin: 0 0 12px; border: 1px solid var(--border); border-radius: 10px; }
.member-list li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.member-list li:first-child { border-top: 0; }
.member-list .em { flex: 1; min-width: 160px; direction: ltr; text-align: right; overflow-wrap: anywhere; }
.drive-files { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
.drive-files li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
.drive-files li a { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.drive-files small { color: var(--muted); }
/* Google: calendar, mail, Drive */
.g-conn { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.g-conn .grow { flex: 1; min-width: 200px; }
.g-conn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gray-soft); flex-shrink: 0; }
.g-conn .dot.on { background: var(--green); }
.g-conn .dot.warn { background: var(--amber); }
.g-day { font-weight: 700; margin: 14px 0 4px; font-size: 14px; color: var(--muted); }
.g-day:first-child { margin-top: 0; }
.g-ev { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--border); }
.g-ev .time { width: 92px; flex-shrink: 0; font-size: 13px; color: var(--muted); direction: ltr; text-align: right; }
.g-ev .grow, .g-mail .grow { flex: 1; min-width: 0; }
.g-ev a, .g-mail a { color: inherit; text-decoration: none; }
.g-ev a:hover, .g-mail a:hover .title { text-decoration: underline; }
.g-mail { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
.g-mail .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-mail.unread .title { font-weight: 700; }
.g-mail .from { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-mail .snip { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-mail .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.g-file { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.g-file img { width: 16px; height: 16px; flex-shrink: 0; }
.g-file a { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.g-file small { color: var(--muted); white-space: nowrap; }
.g-crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-size: 14px; }
.g-search { display: flex; gap: 8px; flex: 1; min-width: 200px; }
.g-search .input { flex: 1; }
</style>

      <button>מה המשימות באיחור?</button><button>סכם את הפרוטוקול האחרון</button><button>אילו חשבונות פתוחים?</button>
    </div>

  <script src="firebase-config.js"></script>
  <script src="google-config.js"></script>
  <script src="google.js"></script>
  <script>
/* פמי הנדסה - מערכת ניהול ומעקב
 * מצב מקומי: הנתונים נשמרים בדפדפן (localStorage).
 * מצב ענן (כשמוגדר firebase-config.js): התחברות, ונתונים משותפים ב-Firestore דרך cloud.js.
 */
(function () {
  'use strict';

  const BASE_KEY = 'femy-data-v1';
  // Local mode: simple sign-in against users.json. Each user's data has its own key (username_femy-data-v1).
  const SESSION_KEY = 'femy-session';
  const localSession = (() => {
    if (window.FEMY_FIREBASE && window.FEMY_FIREBASE.apiKey) return null;
    try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); return s && s.username ? s : null; } catch (e) { return null; }
  })();
  let STORE_KEY = localSession ? localSession.username + '_' + BASE_KEY : BASE_KEY;

  // ---------- Dictionaries ----------
  const TASK_STATUS = [
    { id: 'todo', label: 'לביצוע', color: 'gray' },
    { id: 'doing', label: 'בתהליך', color: 'blue' },
    { id: 'waiting', label: 'ממתין', color: 'amber' },
    { id: 'done', label: 'הושלם', color: 'green' },
  ];
  const PRIORITY = [
    { id: 'urgent', label: 'דחוף', color: 'red', rank: 0 },
    { id: 'high', label: 'גבוהה', color: 'amber', rank: 1 },
    { id: 'medium', label: 'בינונית', color: 'blue', rank: 2 },
    { id: 'low', label: 'נמוכה', color: 'gray', rank: 3 },
  ];
  const PROJECT_STATUS = [
    { id: 'planning', label: 'תכנון', color: 'purple' },
    { id: 'active', label: 'בביצוע', color: 'blue' },
    { id: 'paused', label: 'מושהה', color: 'amber' },
    { id: 'done', label: 'הושלם', color: 'green' },
  ];
  const INVOICE_TYPE = [
    { id: 'income', label: 'הכנסה (ללקוח)', short: 'הכנסה', color: 'green' },
    { id: 'expense', label: 'הוצאה (מספק)', short: 'הוצאה', color: 'amber' },
  ];
  const INVOICE_STATUS = [
    { id: 'draft', label: 'טיוטה', color: 'gray' },
    { id: 'sent', label: 'נשלח / ממתין לתשלום', short: 'ממתין', color: 'blue' },
    { id: 'paid', label: 'שולם', color: 'green' },
    { id: 'overdue', label: 'באיחור', color: 'red' },
  ];
  const MEETING_TYPE = ['ישיבת צוות', 'ישיבת תיאום', 'סיור באתר', 'פגישה עם לקוח', 'פגישה עם ספק', 'אחר'];

  const byId = (list, id) => list.find((x) => x.id === id);

  // ---------- Utils ----------
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const todayStr = () => toISO(new Date());
  function toISO(d) {
    const z = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  }
  function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return toISO(d); }
  function fmtDate(s) {
    if (!s) return '';
    const [y, m, d] = s.split('-');
    return d + '/' + m + '/' + y;
  }
  const money = new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 0 });
  const fmtMoney = (n) => money.format(Number(n) || 0);
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const pill = (dict, id, useShort) => {
    const o = byId(dict, id);
    return o ? `<span class="pill ${o.color}">${esc(useShort && o.short ? o.short : o.label)}</span>` : '';
  };
  const daysUntil = (s) => {
    if (!s) return null;
    const a = new Date(s + 'T00:00:00'); const b = new Date(todayStr() + 'T00:00:00');
    return Math.round((a - b) / 86400000);
  };
  const isOverdueTask = (t) => t.status !== 'done' && t.due && daysUntil(t.due) < 0;
  const invoiceStatus = (inv) => (inv.status === 'sent' && inv.dueDate && daysUntil(inv.dueDate) < 0 ? 'overdue' : inv.status);
  const invTotal = (inv) => (Number(inv.amount) || 0) * (inv.vat ? 1 + VAT : 1);
  const VAT = 0.18;

  // ---------- Data ----------
  const CLOUD = !!(window.FEMY_FIREBASE && window.FEMY_FIREBASE.apiKey);
  let cloud = null; // the cloud.js module, once loaded
  // The signed-in user's own Google account (calendar, Gmail, Drive), via google.js.
  const G = window.FemyGoogle || { enabled: false, status: () => ({}), valid: () => false, init() {}, forget() {}, onChange() {} };
  const GOOGLE = !!G.enabled;
  let me = null; // signed-in user { uid, email, name, photo, role }
  let profile = {}; // the user's private profile (Claude key)
  const isAdmin = () => !CLOUD || (me && me.role === 'admin');
  let db = CLOUD || !localSession ? emptyDb() : load();

  function emptyDb() { return { projects: [], tasks: [], invoices: [], protocols: [], settings: {}, demo: false }; }
  const settings = () => (db.settings = db.settings || {});

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        return Object.assign(emptyDb(), d);
      }
    } catch (e) { /* ignore */ }
    return demoData();
  }
  function save() {
    if (CLOUD) { if (cloud && me) cloud.push(db).catch(() => {}); return; }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
    catch (e) { toast('שמירה נכשלה: האחסון בדפדפן אינו זמין'); }
  }
  // Data saved in this browser before the move to the cloud (not the demo data).
  function localLegacy() {
    try { const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); return d && !d.demo && (d.tasks || []).length + (d.projects || []).length + (d.protocols || []).length + (d.invoices || []).length ? d : null; } catch (e) { return null; }
  }

  function demoData() {
    const p1 = uid(), p2 = uid(), p3 = uid(), p4 = uid();
    return {
      demo: true,
      projects: [
        { id: p1, name: 'בניין מגורים - רחוב הרצל 12', client: 'לקוח לדוגמה א׳', location: 'רמת גן', manager: 'דני', status: 'active', progress: 55, start: addDays(-120), end: addDays(150), budget: 4200000, notes: 'שלב שלד, קומה 4 מתוך 7' },
        { id: p2, name: 'מבנה תעשייה - אזור התעשייה', client: 'לקוח לדוגמה ב׳', location: 'חולון', manager: 'רונית', status: 'planning', progress: 15, start: addDays(-20), end: addDays(300), budget: 2800000, notes: 'הגשת היתר בתהליך' },
        { id: p3, name: 'שיפוץ משרדים', client: 'לקוח לדוגמה ג׳', location: 'תל אביב', manager: 'דני', status: 'active', progress: 80, start: addDays(-60), end: addDays(25), budget: 650000, notes: '' },
        { id: p4, name: 'חיזוק מבנה תמ״א 38', client: 'לקוח לדוגמה ד׳', location: 'גבעתיים', manager: 'יוסי', status: 'done', progress: 100, start: addDays(-400), end: addDays(-15), budget: 3100000, notes: 'נמסר ללקוח' },
      ],
      tasks: [
        { id: uid(), title: 'הזמנת ברזל לקומה 5', projectId: p1, assignee: 'דני', priority: 'urgent', status: 'todo', due: addDays(1), notes: '' },
        { id: uid(), title: 'בדיקת מעבדה ליציקת תקרה', projectId: p1, assignee: 'יוסי', priority: 'high', status: 'doing', due: addDays(3), notes: '' },
        { id: uid(), title: 'השלמת מסמכים להיתר בנייה', projectId: p2, assignee: 'רונית', priority: 'high', status: 'waiting', due: addDays(-2), notes: 'ממתין לחתימת מהנדס קונסטרוקציה' },
        { id: uid(), title: 'תיאום יועץ חשמל', projectId: p2, assignee: 'רונית', priority: 'medium', status: 'todo', due: addDays(7), notes: '' },
        { id: uid(), title: 'התקנת תקרה אקוסטית', projectId: p3, assignee: 'דני', priority: 'medium', status: 'doing', due: addDays(10), notes: '' },
        { id: uid(), title: 'רשימת תיקונים לפני מסירה', projectId: p3, assignee: 'יוסי', priority: 'low', status: 'todo', due: addDays(20), notes: '' },
        { id: uid(), title: 'הגשת חשבון סופי ללקוח', projectId: p4, assignee: 'מוטי', priority: 'high', status: 'done', due: addDays(-5), notes: '' },
      ],
      invoices: [
        { id: uid(), number: '1045', type: 'income', party: 'לקוח לדוגמה א׳', projectId: p1, amount: 380000, vat: true, issueDate: addDays(-40), dueDate: addDays(-10), status: 'sent', notes: 'חשבון חלקי 4' },
        { id: uid(), number: '1046', type: 'income', party: 'לקוח לדוגמה ג׳', projectId: p3, amount: 120000, vat: true, issueDate: addDays(-12), dueDate: addDays(18), status: 'sent', notes: '' },
        { id: uid(), number: '1041', type: 'income', party: 'לקוח לדוגמה ד׳', projectId: p4, amount: 450000, vat: true, issueDate: addDays(-70), dueDate: addDays(-40), status: 'paid', notes: 'חשבון סופי' },
        { id: uid(), number: 'ס-778', type: 'expense', party: 'ספק ברזל לדוגמה', projectId: p1, amount: 96000, vat: true, issueDate: addDays(-25), dueDate: addDays(5), status: 'sent', notes: '' },
        { id: uid(), number: 'ס-512', type: 'expense', party: 'ספק בטון לדוגמה', projectId: p1, amount: 142000, vat: true, issueDate: addDays(-55), dueDate: addDays(-25), status: 'paid', notes: '' },
        { id: uid(), number: 'ס-90', type: 'expense', party: 'קבלן משנה לדוגמה', projectId: p3, amount: 54000, vat: true, issueDate: addDays(-8), dueDate: addDays(22), status: 'draft', notes: '' },
      ],
      protocols: [
        { id: uid(), date: addDays(-3), title: 'ישיבת התקדמות שבועית', type: 'ישיבת צוות', projectId: p1, participants: 'מוטי, דני, יוסי', summary: 'נסקרה התקדמות השלד. היציקה של קומה 4 הושלמה בהצלחה.', decisions: 'להקדים הזמנת ברזל לקומה 5\nלתאם בדיקת מעבדה לשבוע הבא', actions: 'דני: הזמנת ברזל לקומה 5\nיוסי: בדיקת מעבדה ליציקת תקרה' },
        { id: uid(), date: addDays(-9), title: 'פגישת תיאום עם הלקוח', type: 'פגישה עם לקוח', projectId: p2, participants: 'מוטי, רונית, נציג הלקוח', summary: 'הוצגו תוכניות ראשוניות. הלקוח ביקש שינוי בחזית.', decisions: 'לעדכן את תוכנית החזית עד הפגישה הבאה', actions: 'רונית: עדכון תוכנית חזית' },
      ],
    };
  }

  // ---------- Router ----------
  const VIEWS = {
    dashboard: { title: 'לוח בקרה', render: renderDashboard },
    tasks: { title: 'משימות', render: renderTasks },
    projects: { title: 'פרויקטים', render: renderProjects },
    accounts: { title: 'חשבונות', render: renderAccounts },
    protocols: { title: 'פרוטוקולים', render: renderProtocols },
    google: { title: 'יומן, מייל ו-Drive', render: renderGoogle },
    settings: { title: 'הגדרות וגיבוי', render: renderSettings },
  };
  const ui = { taskView: 'board', taskFilter: { q: '', project: '', assignee: '', priority: '' }, invFilter: { q: '', type: '', status: '', project: '' }, projFilter: '', protoQ: '', openProto: null, gTab: 'calendar', gMailQ: '', gDriveQ: '', gDrivePath: [] };

  const $ = (sel, el) => (el || document).querySelector(sel);
  const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
  const content = () => $('#content');

  function currentView() {
    const h = location.hash.replace('#', '');
    return VIEWS[h] ? h : 'dashboard';
  }
  function render() {
    const v = currentView();
    $('#pageTitle').textContent = VIEWS[v].title;
    $$('.nav a').forEach((a) => a.classList.toggle('active', a.dataset.view === v));
    const openTasks = db.tasks.filter((t) => t.status !== 'done').length;
    $('#badgeTasks').textContent = openTasks || '';
    $('#badgeTasks').style.display = openTasks ? '' : 'none';
    const addBtn = $('#addBtn');
    const addMap = { tasks: 'משימה חדשה', projects: 'פרויקט חדש', accounts: 'חשבון חדש', protocols: 'פרוטוקול חדש', dashboard: 'משימה חדשה' };
    if (addMap[v]) { addBtn.style.display = ''; $('.lbl', addBtn).textContent = addMap[v]; }
    else addBtn.style.display = 'none';
    VIEWS[v].render(content());
    closeSidebar();
  }

  // ---------- Dashboard ----------
  function renderDashboard(el) {
    const open = db.tasks.filter((t) => t.status !== 'done');
    const overdue = open.filter(isOverdueTask);
    const activeProjects = db.projects.filter((p) => p.status === 'active' || p.status === 'planning');
    const receivable = db.invoices.filter((i) => i.type === 'income' && (i.status === 'sent')).reduce((s, i) => s + invTotal(i), 0);
    const overdueInv = db.invoices.filter((i) => invoiceStatus(i) === 'overdue');
    const payable = db.invoices.filter((i) => i.type === 'expense' && i.status === 'sent').reduce((s, i) => s + invTotal(i), 0);

    const upcoming = open.slice().sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999')).slice(0, 6);

    // Last 6 months income/expense (by issue date)
    const months = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), label: d.toLocaleDateString('he-IL', { month: 'short' }), inc: 0, exp: 0 });
    }
    db.invoices.forEach((inv) => {
      if (inv.status === 'draft' || !inv.issueDate) return;
      const m = months.find((x) => x.key === inv.issueDate.slice(0, 7));
      if (!m) return;
      if (inv.type === 'income') m.inc += invTotal(inv); else m.exp += invTotal(inv);
    });
    const maxV = Math.max(1, ...months.map((m) => Math.max(m.inc, m.exp)));

    const recentProto = db.protocols.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);

    el.innerHTML = `
      ${db.demo ? `<div class="card card-pad" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--amber-soft);border-color:#f1d9a8">
        <div style="flex:1;min-width:220px"><strong>אלה נתוני דוגמה.</strong> הם נועדו רק להראות איך המערכת נראית. כשתהיו מוכנים, נקו אותם והתחילו להזין נתונים אמיתיים.</div>
        <button class="btn" data-act="clear-demo">ניקוי נתוני הדוגמה</button></div>` : ''}
      <div class="kpis">
        <div class="card kpi"><div class="label">משימות פתוחות</div><div class="value">${open.length}</div><div class="sub">${db.tasks.filter((t) => t.status === 'doing').length} בתהליך</div></div>
        <div class="card kpi ${overdue.length ? 'warn' : ''}"><div class="label">משימות באיחור</div><div class="value">${overdue.length}</div><div class="sub">עבר תאריך היעד</div></div>
        <div class="card kpi"><div class="label">פרויקטים פעילים</div><div class="value">${activeProjects.length}</div><div class="sub">מתוך ${db.projects.length} פרויקטים</div></div>
        <div class="card kpi good"><div class="label">צפוי להתקבל</div><div class="value">${fmtMoney(receivable)}</div><div class="sub">חשבונות פתוחים ללקוחות, כולל מע״מ</div></div>

  // ---------- Tasks ----------
  function filteredTasks() {
    const f = ui.taskFilter; const q = f.q.trim().toLowerCase();
    return db.tasks.filter((t) => {
      if (f.project && t.projectId !== f.project) return false;
      if (f.assignee && t.assignee !== f.assignee) return false;
      if (f.priority && t.priority !== f.priority) return false;
      if (q && !(t.title + ' ' + (t.notes || '') + ' ' + (t.assignee || '')).toLowerCase().includes(q)) return false;
      return true;
    });
  }
  function projectOptions(selected, emptyLabel) {
    return `<option value="">${emptyLabel}</option>` + db.projects.map((p) => `<option value="${p.id}" ${p.id === selected ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  }
  function dictOptions(dict, selected, emptyLabel) {
    return (emptyLabel != null ? `<option value="">${emptyLabel}</option>` : '') + dict.map((o) => `<option value="${o.id}" ${o.id === selected ? 'selected' : ''}>${esc(o.label)}</option>`).join('');
  }
  const assignees = () => Array.from(new Set(db.tasks.map((t) => t.assignee).filter(Boolean))).sort();

  function renderTasks(el) {
    const f = ui.taskFilter;
    el.innerHTML = `
      <div class="toolbar">
        <input class="input search" id="tq" placeholder="חיפוש משימה..." value="${esc(f.q)}">
        <select class="input" id="tp">${projectOptions(f.project, 'כל הפרויקטים')}</select>
        <select class="input" id="ta"><option value="">כל האחראים</option>${assignees().map((a) => `<option ${a === f.assignee ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select>
        <select class="input" id="tpr">${dictOptions(PRIORITY, f.priority, 'כל העדיפויות')}</select>
        <span class="spacer"></span>
        <div class="seg"><button data-v="board" class="${ui.taskView === 'board' ? 'on' : ''}">לוח</button><button data-v="list" class="${ui.taskView === 'list' ? 'on' : ''}">רשימה</button></div>
      </div>
      <div id="taskArea"></div>`;
    const rerender = () => drawTasks($('#taskArea', el));
    $('#tq', el).addEventListener('input', (e) => { f.q = e.target.value; rerender(); });
    $('#tp', el).addEventListener('change', (e) => { f.project = e.target.value; rerender(); });
    $('#ta', el).addEventListener('change', (e) => { f.assignee = e.target.value; rerender(); });

  function taskCard(t) {
    const p = byId(db.projects, t.projectId);
    const od = isOverdueTask(t);
    return `<div class="tcard p-${t.priority}" draggable="true" data-id="${t.id}">
      <div class="t-title">${esc(t.title)}</div>
      <div class="t-meta">${pill(PRIORITY, t.priority)}
        ${t.assignee ? `<span>👤 ${esc(t.assignee)}</span>` : ''}
        ${t.due ? `<span class="${od ? 'overdue' : ''}">📅 ${fmtDate(t.due)}</span>` : ''}
      </div>
      ${p ? `<div class="t-meta" style="margin-top:4px">🏗 ${esc(p.name)}</div>` : ''}
    </div>`;
  }

  function drawTasks(area) {
    const list = filteredTasks().sort((a, b) => byId(PRIORITY, a.priority).rank - byId(PRIORITY, b.priority).rank || (a.due || '9999').localeCompare(b.due || '9999'));
    if (ui.taskView === 'board') {
      area.innerHTML = `<div class="kanban">${TASK_STATUS.map((s) => {
        const items = list.filter((t) => t.status === s.id);
        return `<div class="col" data-status="${s.id}">
          <div class="col-head"><span>${s.label}</span><span class="count">${items.length}</span></div>
          <div class="col-body">${items.map(taskCard).join('')}</div>
          <button class="btn sm" style="margin-top:8px;justify-content:center;background:transparent;border-style:dashed" data-add="${s.id}">+ הוספה</button>
        </div>`;
      }).join('')}</div>`;
      $$('.tcard', area).forEach((c) => {
        c.addEventListener('click', () => openTaskForm(byId(db.tasks, c.dataset.id)));
        c.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging'); });
        c.addEventListener('dragend', () => c.classList.remove('dragging'));
      });
      $$('.col', area).forEach((col) => {
        col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drop'); });
        col.addEventListener('dragleave', () => col.classList.remove('drop'));
        col.addEventListener('drop', (e) => {
          e.preventDefault(); col.classList.remove('drop');
          const t = byId(db.tasks, e.dataTransfer.getData('text/plain'));
          if (t && t.status !== col.dataset.status) { t.status = col.dataset.status; save(); drawTasks(area); updateBadge(); }
        });
      });
      $$('[data-add]', area).forEach((b) => b.addEventListener('click', () => openTaskForm(null, { status: b.dataset.add })));
    } else {
      area.innerHTML = `<div class="card table-wrap"><table>
        <thead><tr><th style="width:1%"></th><th>משימה</th><th>פרויקט</th><th>אחראי</th><th>עדיפות</th><th>סטטוס</th><th>תאריך יעד</th><th></th></tr></thead>
        <tbody>${list.map((t) => {
          const p = byId(db.projects, t.projectId); const od = isOverdueTask(t);

            <td>${p ? esc(p.name) : '<span class="hint">ללא</span>'}</td>
            <td>${esc(t.assignee || '')}</td>
            <td>${pill(PRIORITY, t.priority)}</td>
            <td>${pill(TASK_STATUS, t.status)}</td>
            <td class="${od ? 'overdue' : ''}">${fmtDate(t.due)}</td>
            <td class="actions"><button class="icon-btn" data-edit title="עריכה">✏️</button></td></tr>`;
        }).join('') || '<tr><td colspan="8" class="empty">לא נמצאו משימות</td></tr>'}</tbody></table></div>`;
      $$('tr[data-id]', area).forEach((tr) => {
        const t = byId(db.tasks, tr.dataset.id);
        $('[data-edit]', tr).addEventListener('click', () => openTaskForm(t));
        $('[data-done]', tr).addEventListener('change', (e) => { t.status = e.target.checked ? 'done' : 'todo'; save(); drawTasks(area); updateBadge(); });
      });

  }
  function updateBadge() {
    const n = db.tasks.filter((t) => t.status !== 'done').length;
    $('#badgeTasks').textContent = n || ''; $('#badgeTasks').style.display = n ? '' : 'none';
  }

  function openTaskForm(task, defaults) {
    const t = task || Object.assign({ title: '', projectId: ui.taskFilter.project || '', assignee: '', priority: 'medium', status: 'todo', due: '', notes: '' }, defaults || {});
    openModal(task ? 'עריכת משימה' : 'משימה חדשה', `

      <div class="field"><label>פרויקט</label><select class="input" name="projectId">${projectOptions(t.projectId, 'ללא פרויקט')}</select></div>

      ${GOOGLE ? `<div class="field full"><label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--text)"><input type="checkbox" name="toCal" ${taskCalId(t) ? 'checked' : ''}> ${taskCalId(t) ? 'לעדכן את האירוע ביומן Google שלי' : 'להוסיף ליומן Google שלי (ביום היעד)'}</label></div>` : ''}`,

          <div class="proj-top"><div><div class="proj-name">${esc(p.name)}</div><div class="proj-client">${esc(p.client || '')}${p.location ? ' · ' + esc(p.location) : ''}</div></div>

          <div class="proj-foot"><span>${openT} משימות פתוחות${odT ? ` · <span class="overdue">${odT} באיחור</span>` : ''}</span>
            <span>${p.driveFolder ? `<a class="btn sm" href="https://drive.google.com/drive/folders/${encodeURIComponent(p.driveFolder)}" target="_blank" rel="noopener">📁 Drive</a> ` : ''}<button class="btn sm" data-tasks>משימות</button> <button class="btn sm" data-edit>עריכה</button></span></div>
        </div>`;
      }).join('') || '<div class="card empty" style="grid-column:1/-1">אין פרויקטים להצגה. לחצו על "פרויקט חדש" כדי להוסיף.</div>'}</div>`;

  // Projects collected from the company's Drive folder ("פרויקטים פמי"), in projects/drive-projects.json.
  // Added once per version of that file; a project already in the system (same id or name) is left as is,
  // so edits made on the site are never overwritten. manual: the button on the projects page.
  async function importDriveProjects(manual) {
    if (!isAdmin()) return;
    let data;
    try { data = await (await fetch('projects/drive-projects.json', { cache: 'no-cache' })).json(); }
    catch (e) { if (manual) toast('טעינת רשימת הפרויקטים מה-Drive נכשלה'); return; }
    if (!data || !Array.isArray(data.projects)) return;
    if (!manual && settings().driveImport === data.version) return;
    if (db.demo) db = emptyDb(); // replace the sample data with the real projects
    const norm = (x) => (x || '').replace(/\s+/g, ' ').trim();
    const ids = new Set(db.projects.map((p) => p.id));
    const names = new Set(db.projects.map((p) => norm(p.name)));
    let n = 0;
    const added = {};
    data.projects.forEach((p) => {
      if (ids.has(p.id) || names.has(norm(p.name))) return;
      db.projects.push(Object.assign({}, p)); added[p.id] = 1; n++;
    });
    // Open action items and recent meeting summaries, only for projects added now.
    let nt = 0;
    [['tasks', data.tasks], ['protocols', data.protocols]].forEach(([col, list]) => (list || []).forEach((x) => {
      if (!added[x.projectId] || db[col].some((y) => y.id === x.id)) return;
      db[col].push(Object.assign({}, x)); if (col === 'tasks') nt++;
    }));
    settings().driveImport = data.version;
    save(); render();
    if (n) toast(`נוספו ${n} פרויקטים ו-${nt} משימות מתיקיית פרויקטים פמי ב-Drive`);
    else if (manual) toast('כל הפרויקטים מה-Drive כבר נמצאים במערכת');
  }

    openModal(proj ? 'עריכת פרויקט' : 'פרויקט חדש', `

    } : null, 'המשימות, החשבונות והפרוטוקולים של הפרויקט יישארו, בלי שיוך לפרויקט.');

  // ---------- Accounts ----------
  function renderAccounts(el) {

  // Word: fills the company letterhead template (docs/blank-template.docx).
  let jszipLoading = null;
  function loadJSZip() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    if (!jszipLoading) jszipLoading = new Promise((res, rej) => {
      const sc = document.createElement('script'); sc.src = 'vendor/jszip.min.js';
      sc.onload = () => res(window.JSZip); sc.onerror = () => { jszipLoading = null; rej(new Error('jszip')); };
      document.head.appendChild(sc);
    });
    return jszipLoading;
  }
  function wRun(text, o) {
    o = o || {};
    const sz = o.size ? `<w:sz w:val="${o.size}"/><w:szCs w:val="${o.size}"/>` : '';
    const b = o.bold ? '<w:b/><w:bCs/>' : '';
    const color = o.color ? `<w:color w:val="${o.color}"/>` : '';
    return `<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${b}${color}${sz}<w:rtl/></w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r>`;
  }
  function wPara(runs, o) {
    o = o || {};
    const bdr = o.border ? '<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="1" w:color="52BD76"/></w:pBdr>' : '';
    const ind = o.indent ? '<w:ind w:start="360" w:hanging="360"/>' : '';
    return `<w:p><w:pPr>${o.keepNext ? '<w:keepNext/>' : ''}${bdr}<w:bidi/><w:spacing w:before="${o.before || 0}" w:after="${o.after == null ? 100 : o.after}"/>${ind}</w:pPr>${runs}</w:p>`;
  }
  async function buildProtocolDocx(pr) {
      const [JSZip, tpl] = await Promise.all([loadJSZip(), fetch('docs/blank-template.docx').then((r) => { if (!r.ok) throw new Error('template'); return r.arrayBuffer(); })]);
      const zip = await JSZip.loadAsync(tpl);
      const docXml = await zip.file('word/document.xml').async('string');
      const { meta, sections } = protoSections(pr);
      let body = wPara(wRun('פרוטוקול: ' + (pr.title || ''), { bold: true, size: 34 }), { after: 80 });
      body += wPara(meta.map((m, i) => (i ? wRun('   |   ') : '') + wRun(m[0] + ': ', { bold: true }) + wRun(m[1])).join(''), { after: 160 });
      sections.forEach((sec) => {
        body += wPara(wRun(sec.title, { bold: true, size: 25 }), { before: 200, after: 100, border: true, keepNext: true });
        if (sec.list) sec.list.forEach((x, i) => { body += wPara(wRun((i + 1) + '.\t' + x), { indent: true, after: 60 }); });
        else sec.paras.forEach((x) => { body += wPara(wRun(x)); });

      zip.file('word/document.xml', docXml.slice(0, i1) + body + docXml.slice(i2));

  function protocolText(pr) {
    const { meta, sections } = protoSections(pr);
    let t = 'פרוטוקול: ' + (pr.title || '') + '\n' + meta.map((m) => m[0] + ': ' + m[1]).join(' | ') + '\n';
    sections.forEach((sec) => {

      t += sec.list ? sec.list.map((x, i) => (i + 1) + '. ' + x).join('\n') : sec.paras.join('\n');

  function emailProtocol(pr) {
    const st = settings();
    const subject = 'פרוטוקול: ' + (pr.title || '') + ' - ' + fmtDate(pr.date);
    let body = protocolText(pr);
    if (body.length > 6000) body = body.slice(0, 6000) + '\n...\n(הפרוטוקול קוצר. את הגרסה המלאה אפשר לצרף כקובץ Word או PDF מהמערכת)';
    const to = cleanEmails(st.emailTo), cc = cleanEmails(st.emailCc);
    let url;
    if (GOOGLE && st.mailApp === 'gmailApi') { sendProtocolGmail(pr, to, cc, subject, protocolText(pr)); return; }
    if (st.mailApp === 'mailto') {
      const q = [cc && 'cc=' + encodeURIComponent(cc), 'subject=' + encodeURIComponent(subject), 'body=' + encodeURIComponent(body)].filter(Boolean).join('&');

  async function aiSend(text) {

    aiBusy = true;

    try {
      if (!aiClient || aiClient._femyKey !== key) {

  // Remote changes are merged into the existing objects, so open forms keep valid references.
  let pendingRender = false;
  function applyRemote(state) {
    ['projects', 'tasks', 'invoices', 'protocols'].forEach((col) => {
      const cur = new Map(db[col].map((x) => [x.id, x]));
      db[col] = state[col].map((r) => {
        const o = cur.get(r.id);
        if (!o) return r;
        Object.keys(o).forEach((k) => { if (!(k in r)) delete o[k]; });
        return Object.assign(o, r);
      });
    });
    const st = settings();
    Object.keys(st).forEach((k) => { if (!(k in state.settings)) delete st[k]; });
    Object.assign(st, state.settings);
    db.demo = false;
    // Don't redraw under someone who is typing in a search box or filter.
    const a = document.activeElement;
    if (a && $('#content').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) {
      if (!pendingRender) { pendingRender = true; a.addEventListener('blur', () => { pendingRender = false; render(); }, { once: true }); }
    } else render();
  }

  // ---------- Local sign-in (users.json) ----------
  function localGate() {
    const g = $('#authGate'), b = $('#authBody');
    g.hidden = false;
    b.innerHTML = `
      <form id="lgForm">
        <input class="input" id="lgUser" type="email" dir="ltr" placeholder="אימייל" autocomplete="username" required autocapitalize="off">
        <input class="input" id="lgPw" type="password" dir="ltr" placeholder="סיסמה" autocomplete="current-password" required>
        <div class="auth-err" id="lgErr"></div>
        <button class="btn primary" type="submit" id="lgSubmit">כניסה</button>
      </form>`;
    $('#lgUser').focus();
    $('#lgForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = (m) => { $('#lgErr').textContent = m; };
      err(''); $('#lgSubmit').disabled = true;
      const un = $('#lgUser').value.trim().toLowerCase(), pw = $('#lgPw').value;
      try {
        const r = await fetch('users.json', { cache: 'no-store' });
        if (!r.ok) throw new Error('http ' + r.status);
        const users = await r.json();
        const u = (Array.isArray(users) ? users : []).find((x) => String(x.username || '').toLowerCase() === un && String(x.password) === pw);
        if (!u) { err('אימייל או סיסמה שגויים'); $('#lgSubmit').disabled = false; return; }
        const key = un + '_' + BASE_KEY;
        // Usernames used to be short names (e.g. "moti"); move that user's data to the email-based key.
        const oldKey = un.split('@')[0] + '_' + BASE_KEY;
        if (oldKey !== key && !localStorage.getItem(key) && localStorage.getItem(oldKey)) {
          localStorage.setItem(key, localStorage.getItem(oldKey));
          localStorage.removeItem(oldKey);
        }
        // Data saved in this browser before sign-in existed moves only to the admin (moti@femy.co.il), never to another user.
        if (u.role === 'admin' && !localStorage.getItem(key) && localStorage.getItem(BASE_KEY)) {
          localStorage.setItem(key, localStorage.getItem(BASE_KEY));
          localStorage.setItem(BASE_KEY + '-before-login', localStorage.getItem(BASE_KEY));
          localStorage.removeItem(BASE_KEY);
        }
        localStorage.setItem(SESSION_KEY, JSON.stringify({ username: un, name: u.name || un, role: u.role || 'user' }));
        location.reload();
      } catch (x) {
        err(navigator.onLine === false ? 'אין חיבור לאינטרנט' : 'טעינת רשימת המשתמשים נכשלה');
        $('#lgSubmit').disabled = false;
      }
    });
  }
  function localSignOut() {
    if (!confirm('לצאת מהמערכת במכשיר הזה?')) return;
    G.forget();
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
    location.reload();
  }

  async function startCloud() {
    gate('loading');

      gate('error', { msg: navigator.onLine === false ? 'אין חיבור לאינטרנט. בכניסה הראשונה צריך חיבור.' : 'טעינת החיבור לענן נכשלה.' });
      return;
    }
    let first = true;
    cloud.start({
      onState: (s) => {
        if (s.state !== 'ready') { me = null; renderUserBox(); gate(s.state, s); return; }
        me = s.user; profile = s.profile || {};
        G.init(me.email, me.email);
        renderUserBox(); aiClient = null; aiReset();
        gate('loading');
      },
      onData: (state) => {
        applyRemote(state);
        if (first) { first = false; gate('ready'); }
      },
      onError: (e) => {
        if (e && e.code === 'permission-denied') toast('אין הרשאה לפעולה הזו');

        <span class="dot ${s.valid ? 'on' : s.connected ? 'warn' : ''}"></span>
        <div class="grow">${s.connected ? `מחובר לחשבון <b dir="ltr">${esc(s.email)}</b>${s.valid ? '' : '. החיבור פג (זה קורה כל שעה בערך), לחצו לחידוש.'}` : 'עדיין לא חיברתם את חשבון ה-Google שלכם. אחרי החיבור תראו כאן את היומן, המיילים והקבצים שלכם, ורק אתם תראו אותם.'}</div>
        ${s.valid ? '' : `<button class="btn primary g-btn" data-gconnect>${s.connected ? 'חידוש החיבור' : 'חיבור לחשבון Google'}</button>`}
      </div>
      <div class="toolbar">
        <div class="seg">${tabs.map(([k, l]) => `<button data-gtab="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        ${tab === 'gmail' ? `<form class="g-search" id="gSearch"><input class="input" id="gq" placeholder="חיפוש במיילים (כמו ב-Gmail)" value="${esc(ui.gMailQ)}"><button class="btn">חיפוש</button></form>` : ''}
        ${tab === 'drive' ? `<form class="g-search" id="gSearch"><input class="input" id="gq" placeholder="${ui.gDrivePath.length ? 'חיפוש בתיקייה הזו' : 'חיפוש פרויקט'}" value="${esc(ui.gDriveQ)}"><button class="btn">חיפוש</button></form>` : ''}
        <span class="spacer"></span>
        ${tab === 'calendar' ? '<button class="btn primary" data-gnew>+ אירוע חדש</button>' : ''}
        ${tab === 'gmail' ? '<button class="btn primary" data-gnew>+ מייל חדש</button>' : ''}
        ${tab === 'drive' && ui.gDrivePath.length ? '<label class="btn primary">⬆ העלאת קובץ לתיקייה<input type="file" id="gUpload" hidden></label>' : ''}
      </div>
      <div class="card card-pad" id="gArea"></div>`;
    const area = $('#gArea', el);
    $$('[data-gtab]', el).forEach((b) => b.addEventListener('click', () => { ui.gTab = b.dataset.gtab; renderGoogle(el); }));
    const gc = $('[data-gconnect]', el);
    if (gc) gc.addEventListener('click', () => G.connect().catch((e) => toast(gErr(e))));
    const nb = $('[data-gnew]', el);
    if (nb) nb.addEventListener('click', () => (tab === 'calendar' ? openEventForm() : openComposeForm()));
    const sf = $('#gSearch', el);
    if (sf) sf.addEventListener('submit', (e) => { e.preventDefault(); if (tab === 'gmail') ui.gMailQ = $('#gq', el).value.trim(); else ui.gDriveQ = $('#gq', el).value.trim(); renderGoogle(el); });
    const up = $('#gUpload', el);
    if (up) up.addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      const here = ui.gDrivePath[ui.gDrivePath.length - 1];
      try {
        await G.token(); toast('מעלה...');
        const r = await G.drive.save(f.name, f, null, here && here.id);
        toast(r.inFolder ? `הקובץ הועלה לתיקייה "${here.name}"` : 'Google לא אפשרה להעלות לתיקייה הזו, הקובץ הועלה לתיקייה "פמי הנדסה - מערכת ניהול"');
        renderGoogle(el);
      }
      catch (x) { toast('ההעלאה נכשלה: ' + gErr(x)); }
    });
    if (!s.valid) { area.innerHTML = '<div class="empty">כדי לראות את התוכן, חברו את חשבון ה-Google שלכם (הכפתור למעלה)</div>'; return; }
    area.innerHTML = '<div class="hint">טוען...</div>';
    const alive = () => document.body.contains(area);
    const fail = (e) => { if (alive()) area.innerHTML = `<div class="empty">הטעינה נכשלה: ${esc(gErr(e))}</div>`; };
    if (tab === 'calendar') {
      G.calendar.events(14).then((evs) => {
        if (!alive()) return;
        area.innerHTML = eventsHtml(evs) || '<div class="empty">אין אירועים בשבועיים הקרובים</div>';
      }).catch(fail);
    } else if (tab === 'gmail') {
      G.gmail.inbox(ui.gMailQ || 'in:inbox', 25).then((msgs) => {
        if (!alive()) return;
        area.innerHTML = msgs.map((m) => `<div class="g-mail ${m.unread ? 'unread' : ''}" data-mid="${esc(m.id)}">
          <a class="grow" href="${esc(G.gmail.link(m))}" target="_blank" rel="noopener">
            <div class="from">${esc(m.from.replace(/\s*<[^>]+>/, ''))}</div><div class="title">${esc(m.subject)}</div><div class="snip">${esc(m.snippet)}</div></a>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="when">${esc(mailWhen(m.date))}</span>
          <button class="btn sm" data-mtask title="יצירת משימה מהמייל">+ משימה</button></div></div>`).join('') || '<div class="empty">לא נמצאו מיילים</div>';
        $$('[data-mid]', area).forEach((row) => {
          const m = msgs.find((x) => x.id === row.dataset.mid);
          $('[data-mtask]', row).addEventListener('click', () => openTaskForm(null, { title: m.subject, notes: 'ממייל של ' + m.from + ':\n' + m.snippet + '\n' + G.gmail.link(m) }));
        });
      }).catch(fail);
    } else {
      // Only the company's projects folder: at the top its project folders, inside a folder its contents.
      const path = ui.gDrivePath;
      const here = path[path.length - 1];
      G.drive.browse(here && here.id, { foldersOnly: !here, search: ui.gDriveQ }).then((res) => {
        if (!alive()) return;
        const crumbs = [{ name: '📁 ' + G.drive.projectsName }].concat(path);
        const when = (f) => `<small>${esc(new Date(f.modifiedTime).toLocaleDateString('he-IL'))}</small>`;
        area.innerHTML = `<div class="g-crumbs">${crumbs.map((c, i) => i === crumbs.length - 1 ? `<b>${esc(c.name)}</b>` : `<a href="#" data-crumb="${i}">${esc(c.name)}</a>`).join(' <span class="hint">›</span> ')}</div>`
          + (res.files.map((f) => f.folder
            ? `<div class="g-file"><span>📁</span><a href="#" data-dir="${esc(f.id)}">${esc(f.name)}</a>${when(f)}<a class="hint" href="${esc(f.webViewLink || '#')}" target="_blank" rel="noopener" title="פתיחה ב-Drive" style="flex:0">↗</a></div>`
            : `<div class="g-file">${f.iconLink ? `<img src="${esc(f.iconLink)}" alt="">` : '📄'}<a href="${esc(f.webViewLink || '#')}" target="_blank" rel="noopener">${esc(f.name)}</a>${when(f)}</div>`).join('')
          || `<div class="empty">${ui.gDriveQ ? 'לא נמצא דבר בשם הזה' : here ? 'התיקייה ריקה' : 'אין תיקיות'}</div>`);
        $$('[data-dir]', area).forEach((a) => a.addEventListener('click', (e) => {
          e.preventDefault(); ui.gDrivePath = path.concat([{ id: a.dataset.dir, name: a.textContent }]); ui.gDriveQ = ''; renderGoogle(el);
        }));
        $$('[data-crumb]', area).forEach((a) => a.addEventListener('click', (e) => {
          e.preventDefault(); ui.gDrivePath = path.slice(0, Number(a.dataset.crumb)); ui.gDriveQ = ''; renderGoogle(el);
        }));
      }).catch(fail);
    }
  }

  // ---------- Settings ----------
  function renderSettings(el) {
    const st = settings();
    el.innerHTML = cloudSettingsHtml() + googleSettingsHtml() + `
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>עוזר Claude</h2>
        <p>העוזר (הכפתור ✨ בפינה) עונה על שאלות על הנתונים במערכת, מסכם פרוטוקולים, ויכול ליצור ולעדכן משימות. הוא עובד עם מפתח API של Anthropic, וכל שיחה מחויבת בחשבון ה-API שלכם. ${CLOUD ? 'המפתח אישי: הוא נשמר בפרופיל הפרטי שלכם בענן, רק אתם יכולים לקרוא אותו, והוא זמין בכל המכשירים שבהם אתם מחוברים.' : 'המפתח נשמר רק בדפדפן הזה.'} הוא לא עולה לגיטהב ולא נכלל בקובץ הגיבוי. בכל שאלה נשלחים ל-Claude גם נתוני המערכת, כדי שיוכל לענות.</p>
        <div class="row"><input class="input" id="aiKeyInput" type="password" dir="ltr" autocomplete="off" placeholder="sk-ant-..." style="flex:1;min-width:220px" value="${esc(getAiKey())}">
        <button class="btn primary" id="aiKeySave">שמירה</button><button class="btn" id="aiKeyDel">מחיקה</button></div>
        <div class="hint">יוצרים מפתח ב-console.anthropic.com, תחת API Keys.</div>
      </div>
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>שליחת פרוטוקולים במייל</h2>
        <p>הנמענים האלה ימולאו אוטומטית בכל פעם שלוחצים "שליחה במייל" בפרוטוקול. אפשר לשנות אותם במייל עצמו לפני השליחה. מפרידים בין כתובות בפסיק.</p>
        <div class="modal-body" style="padding:0;margin-bottom:12px">
          <div class="field full"><label>נמענים קבועים (אל)</label><input class="input" id="setTo" dir="ltr" placeholder="name@example.com, name2@example.com" value="${esc(st.emailTo || '')}"></div>
          <div class="field full"><label>רשימת תפוצה (העתק)</label><textarea class="input" id="setCc" dir="ltr" placeholder="כתובת בכל שורה או מופרדות בפסיק">${esc(st.emailCc || '')}</textarea></div>
          <div class="field full"><label>לפתוח את המייל ב</label><select class="input" id="setApp">
            <option value="gmail" ${!st.mailApp || st.mailApp === 'gmail' ? 'selected' : ''}>Gmail (פתיחת טיוטה)</option>
            <option value="mailto" ${st.mailApp === 'mailto' ? 'selected' : ''}>אפליקציית המייל של המכשיר (Outlook, Mail)</option>
            ${GOOGLE ? `<option value="gmailApi" ${st.mailApp === 'gmailApi' ? 'selected' : ''}>Gmail: שליחה ישירה עם Word מצורף</option>` : ''}</select></div>
        </div>
        <div class="row"><button class="btn primary" id="saveMail">שמירה</button></div>
      </div>
      <div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>גיבוי ושחזור</h2>
        <p>${CLOUD ? 'הנתונים נשמרים בענן ומסונכרנים בין כל המשתמשים והמכשירים, וזמינים גם בלי רשת (השינויים נשלחים כשהחיבור חוזר). אפשר גם להוריד קובץ גיבוי למחשב.' : 'הנתונים נשמרים רק בדפדפן ובמכשיר הזה. כדי לא לאבד אותם, או כדי להעביר אותם למכשיר אחר, הורידו קובץ גיבוי מדי פעם וטענו אותו במכשיר השני.'}</p>
        <div class="row"><button class="btn primary" id="expBtn">הורדת קובץ גיבוי</button>
        ${isAdmin() ? '<label class="btn">טעינת קובץ גיבוי<input type="file" id="impFile" accept=".json,application/json" hidden></label>' : ''}</div>
        <div class="hint">במערכת כרגע: ${db.projects.length} פרויקטים, ${db.tasks.length} משימות, ${db.invoices.length} חשבונות, ${db.protocols.length} פרוטוקולים.</div>
      </div>
      ${nativeBridge() ? '' : `<div class="card card-pad settings" style="max-width:720px;margin-bottom:16px">
        <h2>התקנה כאפליקציה בטלפון</h2>
        <p><strong>אייפון:</strong> פתחו את האתר בספארי, לחצו על כפתור השיתוף ובחרו "הוספה למסך הבית".<br>
        <strong>אנדרואיד:</strong> פתחו את האתר בכרום, לחצו על תפריט שלוש הנקודות ובחרו "התקנת אפליקציה".</p>
        <div class="row"><button class="btn primary" id="installBtn" style="display:none">התקנה עכשיו</button></div>
      </div>`}
      ${isAdmin() ? `<div class="card card-pad settings" style="max-width:720px">
        <h2>איפוס</h2>
        <p>${CLOUD ? 'מחיקה של כל נתוני החברה בענן, אצל כל המשתמשים.' : 'מחיקה של כל הנתונים במכשיר הזה.'} כדאי להוריד קובץ גיבוי לפני כן.</p>
        <div class="row"><button class="btn danger" id="wipeBtn">מחיקת כל הנתונים</button>
        ${CLOUD ? '' : '<button class="btn" id="demoBtn">טעינת נתוני דוגמה</button>'}</div>
      </div>` : ''}`;
    $('#aiKeySave', el).addEventListener('click', async () => {
      const v = $('#aiKeyInput', el).value.trim();
      try { await setAiKey(v); } catch (e) { toast('שמירת המפתח נכשלה'); return; }
      aiClient = null; aiReset(); toast(v ? 'המפתח נשמר' : 'המפתח נמחק');
    });
    $('#aiKeyDel', el).addEventListener('click', async () => {
      try { await setAiKey(''); } catch (e) { toast('מחיקת המפתח נכשלה'); return; }
      $('#aiKeyInput', el).value = ''; aiClient = null; aiReset(); toast('המפתח נמחק');
    });
    $('#saveMail', el).addEventListener('click', () => {
      const bad = [$('#setTo', el).value, $('#setCc', el).value].join(',').split(/[\s,;]+/).filter((x) => x && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
      st.emailTo = $('#setTo', el).value.trim(); st.emailCc = $('#setCc', el).value.trim(); st.mailApp = $('#setApp', el).value;
      save(); toast(bad.length ? 'נשמר. כתובות לא תקינות ידולגו: ' + bad.join(', ') : 'הגדרות המייל נשמרו');
    });
    $('#expBtn', el).addEventListener('click', () => download('femy-גיבוי-' + todayStr() + '.json', JSON.stringify(db, null, 2), 'application/json'));
    const imp = $('#impFile', el);
    if (imp) imp.addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.projects)) throw new Error();
          if (!confirm(CLOUD ? 'הטעינה תחליף את כל נתוני החברה בענן, אצל כל המשתמשים. להמשיך?' : 'הטעינה תחליף את כל הנתונים הנוכחיים במכשיר. להמשיך?')) return;
          db = Object.assign(emptyDb(), d); if (CLOUD) db.demo = false; save(); render(); toast('הגיבוי נטען בהצלחה');
        } catch (err) { toast('הקובץ אינו קובץ גיבוי תקין'); }
      };
      r.readAsText(file);
    });
    const wipe = $('#wipeBtn', el);
    if (wipe) wipe.addEventListener('click', () => { if (confirm(CLOUD ? 'למחוק את כל נתוני החברה בענן, אצל כל המשתמשים? לא ניתן לבטל.' : 'למחוק את כל הנתונים? לא ניתן לבטל.')) { db = emptyDb(); save(); render(); toast('כל הנתונים נמחקו'); } });
    const demo = $('#demoBtn', el);
    if (demo) demo.addEventListener('click', () => { if (confirm('נתוני הדוגמה יחליפו את הנתונים הנוכחיים. להמשיך?')) { db = demoData(); save(); render(); } });
    bindCloudSettings(el);
    bindGoogleSettings(el);
    const ib = $('#installBtn', el);
    if (ib && deferredInstall) { ib.style.display = ''; ib.addEventListener('click', promptInstall); }
  }

  // ---------- Modal ----------
  let modalSubmit = null; let modalDelete = null;
  function openModal(title, bodyHtml, onSubmit, onDelete, deleteNote) {
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = bodyHtml;
    modalSubmit = onSubmit; modalDelete = onDelete;
    const del = $('#modalDelete');
    del.style.display = onDelete ? '' : 'none';
    del.dataset.note = deleteNote || '';
    $('#modalBg').classList.add('show');
    const first = $('#modalBody input, #modalBody select, #modalBody textarea');
    if (first && window.matchMedia('(min-width: 800px)').matches) first.focus();
  }
  function closeModal() { $('#modalBg').classList.remove('show'); modalSubmit = modalDelete = null; }

  // ---------- Misc ----------
  // When running inside the phone app (Expo WebView), hand files to the native side.
  const nativeBridge = () => window.ReactNativeWebView;
  function downloadBlob(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
  function download(name, text, type) {
    if (nativeBridge()) { nativeBridge().postMessage(JSON.stringify({ type: 'download', name, text, mime: type })); return; }
    const blob = new Blob([text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function closeSidebar() { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }

  // PWA install prompt (Android / desktop Chrome)
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredInstall = e;
    $('#installTop').style.display = '';
    if (currentView() === 'settings') render();
  });
  function promptInstall() {
    if (!deferredInstall) { location.hash = 'settings'; return; }
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(() => { deferredInstall = null; $('#installTop').style.display = 'none'; });
  }
  window.addEventListener('appinstalled', () => { $('#installTop').style.display = 'none'; toast('האפליקציה הותקנה'); });

  // ---------- Init ----------
  document.addEventListener('DOMContentLoaded', () => {
    initAi();
    $('#modalForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target); const data = {};
      $$('#modalBody [name]').forEach((inp) => { data[inp.name] = inp.type === 'checkbox' ? inp.checked : (fd.get(inp.name) || '').toString().trim(); });
      const fn = modalSubmit; closeModal(); if (fn) fn(data);
    });
    $('#modalDelete').addEventListener('click', () => {
      const note = $('#modalDelete').dataset.note;
      if (!confirm('למחוק את הפריט?' + (note ? '\n' + note : ''))) return;
      const fn = modalDelete; closeModal(); if (fn) fn();
    });
    $$('[data-close]').forEach((b) => b.addEventListener('click', closeModal));
    $('#modalBg').addEventListener('mousedown', (e) => { if (e.target.id === 'modalBg') closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    $('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
    $('#overlay').addEventListener('click', closeSidebar);
    $('#installTop').addEventListener('click', promptInstall);
    $('#addBtn').addEventListener('click', () => {
      const v = currentView();
      if (v === 'projects') openProjectForm();
      else if (v === 'accounts') openInvoiceForm();
      else if (v === 'protocols') openProtocolForm();
      else openTaskForm();
    });
    window.addEventListener('hashchange', render);
    G.onChange(() => { if (currentView() === 'google' || currentView() === 'settings') render(); });
    if (CLOUD) { render(); startCloud(); }
    else if (!localSession) { localGate(); }
    else {
      $('#logoutName').textContent = localSession.name || localSession.username;
      $('#logoutTop').style.display = '';
      $('#logoutTop').addEventListener('click', localSignOut);
      G.init(localSession.username, /@/.test(localSession.username) ? localSession.username : '');
      window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) { db = load(); render(); } });
      if (!localStorage.getItem(STORE_KEY)) save();
      render();
      importDriveProjects(false);
    }

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  });
})();
</script>
</body>
</html>
